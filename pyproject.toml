[build-system]
# setuptools>=77 — первый релиз с SPDX-строкой `license` и `license-files`
# (PEP 639). На более старых сборка либо падает на этих полях, либо пишет в
# метаданные устаревшую таблицу [project.license].
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3bot"
description = "Telegram-бот: конвертация медиа, AI-анализ, дубляж и субтитры"
readme = "README.md"
# Только free tier — осознанное ограничение deployment'а (см.
# docs/dependency-policy.md), а не техдолг: платный ключ не является
# зависимостью проекта.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

# Версия живёт в core/version.py, зависимости — в requirements.txt: два
# единственных источника, которые уже проверяются гейтами (lock == closure).
# Дублировать пины в pyproject.toml означало бы третье место правды.
[project.scripts]
mp3bot = "bot_new:main"

[tool.setuptools.dynamic]
version = { attr = "core.version.__version__" }
dependencies = { file = ["requirements.txt"] }

# Явный список: автопоиск в flat-layout нашёл бы и tests, и tools/voxcpm2/
# examples, и корневой __init__.py. Пакеты перечислены ровно те, что нужны
# рантайму и CLI; tests/ и docs/ в wheel не попадают.
[tool.setuptools]
# Без этой строки в wheel нет ни bot_new.py, ни main.py: точки входа
# `mp3bot` и `python bot_new.py` падают с ImportError уже после установки.
# Проверяется сборкой в tests/test_packaging_metadata.py.
py-modules = ["bot", "bot_new", "main"]

[tool.setuptools.packages.find]
include = ["core*", "services*", "pipelines*", "handlers*", "converters*", "tools*"]
exclude = ["tests*", "docs*", "vot_helper*"]

[tool.coverage.run]
# branch = true: «строка выполнена» ничего не говорит о том, что проверены обе
# ветки `if`. Statement-only покрытие завышает картину ровно там, где больно —
# в обработке ошибок.
branch = true
source = ["core", "services", "converters", "pipelines", "handlers"]
# tools/voxcpm2 — экспериментальные прогоны моделей, не прод; тесты под них
# живут отдельно и в гейт покрытия не входят.
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
# Порог = измеренное значение минус запас, а не цель. Поднимается ratchet'ом
# (+2 пункта раз в квартал), см. docs/AUDIT_2026-10-23_NEXT.md §P0-2.
fail_under = 52
skip_covered = true
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
# Строгость живёт здесь, а не в командной строке CI: один источник правды.
# Гейт запускает tools/check_types.py и проверяет только объявленный срез.
python_version = "3.12"
strict = true
# Корневой __init__.py делает пакеты «видимыми дважды»; без этого флага mypy
# падает с «Duplicate module named 'database'» ещё до проверки.
explicit_package_bases = true
ignore_missing_imports = true
# Импорты за пределами среза следуют молча: их собственные ошибки — предмет
# следующей волны, но ошибки в вызывающем коде среза видны всегда.
follow_imports = "silent"
# Голый `# type: ignore` скрывает сразу все классы ошибок; разрешён только
# адресный, с кодом. Причина к каждому подавлению — текстом, по конвенции.
enable_error_code = ["ignore-without-code"]
show_error_codes = true
warn_unused_configs = true
cache_dir = ".mypy_cache"

[tool.ruff]
# 3.12 — floor проекта (numpy 2.5 / av 19 / актуальные Pillow wheels).
target-version = "py312"
line-length = 120
exclude = [
  ".git",
  ".pytest_cache",
  "__pycache__",
  "downloads",
  "node_modules",
  # Markdown examples are documentation, not rewritable production source.
  "docs",
  # This historical module is byte-stable; replacements live in its collector.
  "tests/livedub_qa_cases.py",
]

[tool.ruff.lint]
# На старте V3 включаем только классы, которые ловят синтаксические/опасные ошибки
# без массового style-churn в легаси-коде. Расширять после schema/observability.
# 2026-06-10: расширено после стабилизации — добавлены F811 (повторные
# определения), B023 (late-binding замыкания в циклах — ловили реальный баг
# в gemini_analyze), E722 (bare except), F841 (неиспользуемые переменные).
# F401 включён после repository-wide ручной чистки; compatibility re-exports
# сохранены явными aliases/assignments, lazy imports не autofix'ятся.
# E501 включён после шести ручных slices с неизменными executable AST.
# 2026-10-26: extended-волны добавили B904/PLW1510/RET504/SIM105 и UP006/UP009/UP045/W293.
# ASYNC230 добавлен после ручного переноса blocking open/write в worker threads.
select = [
  "ASYNC230",
  "E9",
  "E501",
  "F401",
  "F63",
  "F7",
  "F82",
  "F811",
  "B023",
  "B904",
  "E722",
  "F841",
  "PLW1510",
  "RET504",
  "SIM105",
  "UP006",
  "UP009",
  "UP045",
  "W293",
]
