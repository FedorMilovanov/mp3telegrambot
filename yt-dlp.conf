# YouTube 2026-08: maximum-quality GVS URLs increasingly require a video-bound
# Proof-of-Origin token. MP3Bot uses mweb plus one exact-source browserless
# bgutil provider tree provisioned by tools/ensure_bgutil_provider.py.
#
# Disable every default/global plugin location before adding the one reviewed
# source root. yt-dlp discovers <root>/plugin/yt_dlp_plugins from this directory.
--no-plugin-dirs
--plugin-dirs .runtime/bgutil-ytdlp-pot-provider
#
# Do NOT put cookie options here. services.ffmpeg owns cookie selection so
# cookies.txt / explicit browser cookies cannot conflict with this policy.
--extractor-args "youtube:player_client=mweb"
--extractor-args "youtubepot-bgutilscript:server_home=.runtime/bgutil-ytdlp-pot-provider/server"
