# YouTube 2026-08: maximum-quality GVS URLs increasingly require a video-bound
# Proof-of-Origin token. yt-dlp's recommended durable setup is mweb + a PO Token
# Provider. MP3Bot uses the official bgutil script provider from a pinned,
# repo-local build; it does not launch Chrome/Chromium.
#
# The relative server_home is resolved from the bot's project-root working dir.
# Start Bot.bat builds/validates this runtime before bot_new.py starts.
#
# Do NOT put cookie options here. services.ffmpeg owns cookie selection so
# cookies.txt / explicit browser cookies cannot conflict with this policy.
--extractor-args "youtube:player_client=mweb"
--extractor-args "youtubepot-bgutilscript:server_home=.runtime/bgutil-ytdlp-pot-provider/server"