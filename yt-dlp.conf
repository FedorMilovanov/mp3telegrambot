# YouTube client policy (2026-08): do NOT pin a player_client here.
#
# In 2026-08 YouTube GVS rejects the `mweb` client's media URLs even when bgutil
# generates a valid video-bound PO Token (verified: token present + IP-consistent,
# media still returns HTTP 403). yt-dlp's maintained default client set currently
# selects `visionos` for media, which does NOT require a GVS PO Token and returns
# the SAME bestaudio quality (itag 251 opus) as the old `mweb` route. Letting
# yt-dlp choose keeps MP3Bot ahead of the arms race; bgutil below still supplies
# tokens for any default client that wants one. Verified PASS: bgutil 1.3.1 +
# yt-dlp 2026.8.19, full bestaudio download through the production proxy.
#
# Disable every default/global plugin location before adding the one reviewed
# source root. yt-dlp discovers <root>/plugin/yt_dlp_plugins from this directory.
--no-plugin-dirs
--plugin-dirs .runtime/bgutil-ytdlp-pot-provider
#
# Do NOT put cookie options here. services.ffmpeg owns cookie selection so
# cookies.txt / explicit browser cookies cannot conflict with this policy.
# Do NOT add youtube:player_client=... — see the policy note above.
# The pinned upstream HTTP provider has preference 130 and keeps SessionManager
# resident. This avoids the script provider's per-yt-dlp Node startup and hard
# 15-second generate_once.js --version probe on Windows.
--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
