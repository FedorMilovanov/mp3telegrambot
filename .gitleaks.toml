# Конфиг gitleaks: правила по умолчанию + узкий allowlist проверенных заглушек.
#
# Allowlist не должен становиться дырой: здесь нет ни одного пути целиком
# (`tests/`, `docs/`), потому что настоящий токен чаще всего попадает в код
# именно в тесте — при отладке. Разрешены только конкретные образцы-заглушки,
# которые используются в тестах маскирования и в шаблоне `.env.example`.

[extend]
useDefault = true

[allowlist]
description = "Проверенные вручную заглушки (аудит 2026-10-23)"

# Заглушки basic-auth в шаблоне конфигурации и в тестах `mask_credentials`.
regexes = [
  '''https?://user:pass@(?:127\.0\.0\.1|localhost|10\.0\.0\.1)(?::\d+)?''',
  '''bot123456:AAH''',
]

# Фейковый Telegram-токен из фикстуры tests/test_livedub_audio_companion.py:
# правильный формат (9 цифр : 35 символов), поэтому ловится правилом
# telegram-bot-token, но это литерал-заглушка, а не ключ.
stopwords = [
  "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi_123456",
]
