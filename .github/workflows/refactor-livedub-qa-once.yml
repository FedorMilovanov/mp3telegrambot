name: One-shot source-owned LiveDub QA refactor

on:
  push:
    branches:
      - agent/no-monkey-patch-runtime-refactor

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Apply deterministic LiveDub QA codemod
        run: python tools/_stage_source_owned_livedub_qa.py
      - name: Compile source-owned QA surfaces
        run: |
          python -m py_compile \
            services/livedub_qa.py \
            services/livedub_long_qa.py \
            services/livedub_qa_trust.py \
            services/livedub_qa_hardening.py \
            services/livedub_ru_provenance.py \
            services/yandex_live_dub.py \
            services/livedub_mix.py \
            services/pre_main_policy.py \
            services/runtime_manifest.py \
            tests/test_source_owned_livedub_qa_architecture.py
      - name: Run focused architecture and transaction tests
        run: |
          python -m pytest -q \
            tests/test_source_owned_livedub_qa_architecture.py \
            tests/test_source_owned_conspect_architecture.py \
            tests/test_explicit_livedub_delivery_architecture.py \
            tests/test_explicit_livedub_delivery_transactions.py
      - name: Commit source-owned LiveDub QA refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move LiveDub QA and provenance to source owners"
          git push origin HEAD:agent/no-monkey-patch-runtime-refactor
