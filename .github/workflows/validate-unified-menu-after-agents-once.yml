name: Validate Unified Menu After Agents Once

on:
  push:
    paths:
      - '.github/workflows/validate-unified-menu-after-agents-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Remove duplicated Dub commands from start text
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('handlers/commands.py')
          source = path.read_text(encoding='utf-8')
          old = (
              '                "/mode — все режимы обработки и дубляжа\\n"\n'
              '                "/dub — дубляж: Gemini MAX или готовый SRT\\n"\n'
              '                "/dubcheck — проверить готовность Dub Studio\\n"\n'
          )
          if source.count(old) != 1:
              raise RuntimeError(f'Expected one duplicated Dub command block, got {source.count(old)}')
          path.write_text(source.replace(old, '', 1), encoding='utf-8')
          '@ | python -

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile integrated navigation and runtime
        shell: pwsh
        run: |
          python -m py_compile `
            handlers/mode_command.py `
            handlers/commands.py `
            handlers/dub_wizard.py `
            handlers/dub_commands.py `
            handlers/dub_health.py `
            handlers/dub_delivery.py `
            main.py `
            services/dub_studio.py `
            services/dub_studio_runtime.py `
            tools/voxcpm2/dub_worker.py `
            tools/voxcpm2/dub_worker_hardened.py `
            tools/voxcpm2/generic_short_runtime.py `
            tools/voxcpm2/generic_gemini_runtime.py `
            tools/voxcpm2/generic_direct_checked_runtime.py `
            tools/voxcpm2/semantic_tts_guard.py `
            tools/voxcpm2/voxcpm2_cpu_semantic_wrapper.py

      - name: Run navigation and Dub Studio regression tests
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_mode_navigation.py `
            tests/test_dub_modes.py `
            tests/test_dub_wizard.py `
            tests/test_dub_delivery.py `
            tests/test_dub_studio.py `
            tests/test_dub_worker.py `
            tests/test_generic_project_runtime.py `
            tests/test_generic_direct_runtime.py `
            tests/test_generic_gemini_runtime.py `
            tests/test_semantic_tts_guard.py

      - name: Verify exact callback routing and menu contracts
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from types import SimpleNamespace

          from handlers.mode_command import _clear_dub_wizard_state, _mode_home_keyboard

          callbacks = [
              button.callback_data
              for row in _mode_home_keyboard('rus', is_admin=True).inline_keyboard
              for button in row
              if button.callback_data
          ]
          assert callbacks == [
              'mode_menu:analysis',
              'dubwiz|mode|gemini',
              'dubwiz|mode|direct',
              'dubwiz|projects|list',
              'mode_menu:dubcheck',
          ]
          context = SimpleNamespace(user_data={'dub_universal_wizard': {'awaiting': 'url'}})
          assert _clear_dub_wizard_state(context)
          assert not context.user_data

          main = Path('main.py').read_text(encoding='utf-8')
          mode_route = 'handle_mode_callback, pattern=r"^(?:set_mode:|mode_menu:)"'
          global_route = 'CallbackQueryHandler(handle_callback)'
          assert main.index(mode_route) < main.index(global_route)
          assert 'BotCommand("dub",        "🎙 Дубляж: Gemini MAX / готовый SRT")' in main

          commands = Path('handlers/commands.py').read_text(encoding='utf-8')
          assert commands.count('/mode — все режимы обработки и дубляжа') == 1
          assert 'InlineKeyboardButton("🎙 Дубляж видео", callback_data="dubwiz|home|show")' in commands
          print('Unified menu contracts: OK')
          '@ | python -

      - name: Ruff and whitespace
        shell: pwsh
        run: |
          python -m ruff check `
            handlers/mode_command.py `
            handlers/dub_wizard.py `
            handlers/dub_commands.py `
            handlers/dub_health.py `
            handlers/dub_delivery.py `
            services/dub_studio_runtime.py `
            tools/voxcpm2/dub_worker_hardened.py `
            tests/test_mode_navigation.py `
            tests/test_dub_modes.py `
            tests/test_dub_worker.py
          git diff --check

      - name: Publish result and remove one-time workflow
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Passed = ${{ job.status == 'success' }}
          $Status = if ($Passed) { 'PASS' } else { 'FAIL' }
          New-Item -ItemType Directory -Force docs | Out-Null
          @(
            '# Unified MODE menu integration validation',
            '',
            "- Result: **$Status**",
            '- Source: ${{ github.sha }}',
            '- Scope: concurrent-agent diff, handler priority, stale wizard state, menu callbacks, compile, focused tests, Ruff.',
            '- Physical Telegram click-through and media render remain local-only.'
          ) | Set-Content docs/unified_mode_menu_validation_latest.md -Encoding utf8
          Remove-Item .github/workflows/validate-unified-menu-after-agents-once.yml -Force
          git add handlers/commands.py docs/unified_mode_menu_validation_latest.md .github/workflows/validate-unified-menu-after-agents-once.yml
          git commit -m "Record unified MODE menu validation: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
          if (-not $Passed) { exit 1 }
