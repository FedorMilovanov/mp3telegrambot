name: Validate Dub Studio Final Once
on:
  push:
    paths: ['.github/workflows/validate-dub-studio-final-once.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Final focused gate
        id: gate
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m py_compile tools/voxcpm2/generic_gemini_runtime.py tools/voxcpm2/generic_direct_runtime.py tools/voxcpm2/generic_direct_checked_runtime.py tools/voxcpm2/semantic_tts_guard.py tools/voxcpm2/dub_worker_hardened.py handlers/dub_wizard.py handlers/dub_commands.py handlers/dub_delivery.py handlers/dub_health.py services/dub_studio_runtime.py 2>&1 | Tee-Object final-dub-gate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool tools/voxcpm2/recipes/generic_short_v1.json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_generic_direct_runtime.py tests/test_generic_gemini_runtime.py tests/test_semantic_tts_guard.py tests/test_dub_modes.py tests/test_dub_wizard.py tests/test_dub_delivery.py tests/test_dub_studio.py tests/test_dub_worker.py 2>&1 | Tee-Object -Append final-dub-gate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check tools/voxcpm2/generic_gemini_runtime.py tools/voxcpm2/generic_direct_runtime.py tools/voxcpm2/generic_direct_checked_runtime.py tools/voxcpm2/semantic_tts_guard.py tools/voxcpm2/dub_worker_hardened.py handlers/dub_wizard.py handlers/dub_commands.py handlers/dub_delivery.py handlers/dub_health.py services/dub_studio_runtime.py tests/test_generic_direct_runtime.py tests/test_generic_gemini_runtime.py tests/test_semantic_tts_guard.py tests/test_dub_modes.py tests/test_dub_worker.py 2>&1 | Tee-Object -Append final-dub-gate.log
          exit $LASTEXITCODE
      - name: Publish result
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Status = if ('${{ steps.gate.outcome }}' -eq 'success') { 'PASS' } else { 'FAIL' }
          $Lines = @('# Dub Studio final Windows gate','',"- Result: **$Status**",'- Source: ${{ github.sha }}','- Focused compile/tests/Ruff: ${{ steps.gate.outcome }}','- Physical media render remains local-only; run /dubcheck.')
          if ($Status -eq 'FAIL' -and (Test-Path final-dub-gate.log)) { $Lines += ''; $Lines += (Get-Content final-dub-gate.log -Tail 140) }
          $Lines | Set-Content docs/dub_studio_validation_latest.md -Encoding utf8
          Remove-Item .github/workflows/validate-dub-studio-final-once.yml -Force
          git add docs/dub_studio_validation_latest.md .github/workflows/validate-dub-studio-final-once.yml
          git commit -m "Record final Dub Studio Windows gate: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
