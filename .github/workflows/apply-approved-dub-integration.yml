name: Apply approved-dub integration

on:
  push:
    branches:
      - agent/approved-translation-production

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/approved-translation-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply idempotent integration
        run: |
          python tools/dev/integrate_approved_dub.py
          python tools/dev/harden_approved_dub.py
      - name: Compile changed Python
        run: |
          python -m py_compile \
            core/dub_projects.py \
            pipelines/dubbing/preflight.py \
            handlers/dub_production.py \
            tools/voxcpm2/production/segmented_voice_clone.py \
            tools/voxcpm2/production/master_constant_mix.py \
            main.py handlers/commands.py
      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            main.py handlers/commands.py requirements.txt README.md .env.example \
            core/dub_projects.py pipelines/dubbing/preflight.py handlers/dub_production.py
          git commit -m "Harden approved-translation production integration"
          git push origin HEAD:agent/approved-translation-production
