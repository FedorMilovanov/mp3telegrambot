name: Audit Hardening Apply

on:
  push:
    branches:
      - agent/audit-hardening-no-quality-downgrade

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/audit-hardening-no-quality-downgrade
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact audited transforms
        run: python tools/apply_audit_hardening_once.py
      - name: Compile patched Python
        run: python -m compileall -q core services pipelines handlers tests tools bot_new.py
      - name: Commit patched tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply audit hardening without quality downgrade [audit-patched]"
          git push origin HEAD:agent/audit-hardening-no-quality-downgrade
