name: Windows Bootstrap CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Start Bot.bat"
      - "requirements.txt"
      - "requirements-lock.txt"
      - "tools/check_requirements_lock.py"
      - "tests/test_start_bot_bootstrap.py"
      - ".github/workflows/windows-bootstrap-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Start Bot.bat"
      - "requirements.txt"
      - "requirements-lock.txt"
      - "tools/check_requirements_lock.py"
      - "tests/test_start_bot_bootstrap.py"
      - ".github/workflows/windows-bootstrap-ci.yml"

concurrency:
  group: windows-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-contract:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Compile bootstrap tests
        run: python -m py_compile tests/test_start_bot_bootstrap.py tools/check_requirements_lock.py

      - name: Validate BAT bootstrap contract
        run: python -m pytest -q tests/test_start_bot_bootstrap.py
