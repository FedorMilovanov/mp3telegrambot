name: Windows Bootstrap CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "bot_new.py"
      - "Start Bot.bat"
      - "requirements.txt"
      - "requirements-lock.txt"
      - "yt-dlp.conf"
      - "services/bgutil_http_runtime.py"
      - "services/runtime_dependency_lock.py"
      - "services/youtube_po_token_runtime.py"
      - "tools/ensure_bgutil_provider.py"
      - "tools/check_youtube_gvs.py"
      - "tools/check_requirements_lock.py"
      - "tools/install_from_lock.py"
      - "tests/test_start_bot_bootstrap.py"
      - "tests/test_bot_compat_launcher.py"
      - "tests/test_bgutil_provider_setup.py"
      - "tests/test_bgutil_http_runtime.py"
      - "tests/test_direct_youtube_bootstrap.py"
      - "tests/test_youtube_po_token_runtime.py"
      - "tests/test_youtube_po_wheel_guard.py"
      - "tests/test_youtube_gvs_probe.py"
      - ".github/workflows/windows-bootstrap-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "bot_new.py"
      - "Start Bot.bat"
      - "requirements.txt"
      - "requirements-lock.txt"
      - "yt-dlp.conf"
      - "services/bgutil_http_runtime.py"
      - "services/runtime_dependency_lock.py"
      - "services/youtube_po_token_runtime.py"
      - "tools/ensure_bgutil_provider.py"
      - "tools/check_youtube_gvs.py"
      - "tools/check_requirements_lock.py"
      - "tools/install_from_lock.py"
      - "tests/test_start_bot_bootstrap.py"
      - "tests/test_bot_compat_launcher.py"
      - "tests/test_bgutil_provider_setup.py"
      - "tests/test_bgutil_http_runtime.py"
      - "tests/test_direct_youtube_bootstrap.py"
      - "tests/test_youtube_po_token_runtime.py"
      - "tests/test_youtube_po_wheel_guard.py"
      - "tests/test_youtube_gvs_probe.py"
      - ".github/workflows/windows-bootstrap-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-contract:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # Версии берутся из requirements-lock.txt, а не пишутся здесь второй раз:
      # раньше этот шаг ставил pytest==8.4.2 и yt-dlp==2026.7.4, тогда как lock
      # уже фиксировал pytest 9.1.1 и yt-dlp 2026.10.21 — Windows-контракты
      # проверялись на другом наборе пакетов, чем production.
      - name: Install focused Python runtime from the lock
        run: >-
          python tools/install_from_lock.py
          packaging pytest yt-dlp yt-dlp-ejs

      - name: Compile bootstrap and YouTube runtime contracts
        run: >-
          python -m py_compile
          bot_new.py
          services/runtime_dependency_lock.py
          tests/test_start_bot_bootstrap.py
          tests/test_bot_compat_launcher.py
          tests/test_bgutil_provider_setup.py
          tests/test_bgutil_http_runtime.py
          tests/test_direct_youtube_bootstrap.py
          tests/test_youtube_po_token_runtime.py
          tests/test_youtube_po_wheel_guard.py
          tests/test_youtube_gvs_probe.py
          tools/check_requirements_lock.py
          tools/ensure_bgutil_provider.py
          tools/check_youtube_gvs.py
          services/bgutil_http_runtime.py
          services/youtube_po_token_runtime.py

      - name: Validate Windows bootstrap and exact-source YouTube contracts
        run: >-
          python -m pytest -q
          tests/test_start_bot_bootstrap.py
          tests/test_bot_compat_launcher.py
          tests/test_bgutil_provider_setup.py
          tests/test_bgutil_http_runtime.py
          tests/test_direct_youtube_bootstrap.py
          tests/test_youtube_po_token_runtime.py
          tests/test_youtube_po_wheel_guard.py
          tests/test_youtube_gvs_probe.py

      - name: Provision real exact-source bgutil runtime on Windows
        run: python tools/ensure_bgutil_provider.py

      - name: Prove reuse and production readiness offline
        shell: pwsh
        run: |
          python tools/ensure_bgutil_provider.py
          python -c "from services.youtube_po_token_runtime import require_youtube_po_token_runtime; runtime=require_youtube_po_token_runtime(); print(runtime.status_text())"
