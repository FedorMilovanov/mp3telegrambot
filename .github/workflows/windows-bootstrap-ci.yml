name: Windows Bootstrap CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Start Bot.bat"
      - "requirements.txt"
      - "requirements-lock.txt"
      - "yt-dlp.conf"
      - "services/youtube_po_token_runtime.py"
      - "tools/ensure_bgutil_provider.py"
      - "tools/check_requirements_lock.py"
      - "tests/test_start_bot_bootstrap.py"
      - "tests/test_bgutil_provider_setup.py"
      - "tests/test_youtube_po_token_runtime.py"
      - "tests/test_youtube_po_wheel_guard.py"
      - ".github/workflows/windows-bootstrap-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Start Bot.bat"
      - "requirements.txt"
      - "requirements-lock.txt"
      - "yt-dlp.conf"
      - "services/youtube_po_token_runtime.py"
      - "tools/ensure_bgutil_provider.py"
      - "tools/check_requirements_lock.py"
      - "tests/test_start_bot_bootstrap.py"
      - "tests/test_bgutil_provider_setup.py"
      - "tests/test_youtube_po_token_runtime.py"
      - "tests/test_youtube_po_wheel_guard.py"
      - ".github/workflows/windows-bootstrap-ci.yml"

concurrency:
  group: windows-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-contract:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Compile bootstrap and YouTube runtime contracts
        run: >-
          python -m py_compile
          tests/test_start_bot_bootstrap.py
          tests/test_bgutil_provider_setup.py
          tests/test_youtube_po_token_runtime.py
          tests/test_youtube_po_wheel_guard.py
          tools/check_requirements_lock.py
          tools/ensure_bgutil_provider.py
          services/youtube_po_token_runtime.py

      - name: Validate Windows bootstrap and exact-source YouTube contracts
        run: >-
          python -m pytest -q
          tests/test_start_bot_bootstrap.py
          tests/test_bgutil_provider_setup.py
          tests/test_youtube_po_token_runtime.py
          tests/test_youtube_po_wheel_guard.py
