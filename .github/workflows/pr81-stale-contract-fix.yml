name: PR81 stale contract fix

on:
  push:
    branches:
      - agent/chat-findings-final-closure-20260803

permissions:
  contents: write

concurrency:
  group: pr81-stale-contract-fix
  cancel-in-progress: false

jobs:
  patch-stale-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/chat-findings-final-closure-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Patch stale startup diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/chat-findings-final-closure-20260803 | awk '{print $1}')"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved: expected $GITHUB_SHA, got $remote_head" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_livedub_qa.py")
          source = test_path.read_text(encoding="utf-8")
          old = '    assert "молча деградирует" in src\n'
          new = (
              '    assert "обязательная возможность недоступна" in src\n'
              '    assert "явно отклонены, а не молча ухудшены" in src\n'
              '    assert "опционально недоступен" in src\n'
              '    assert "без скрытой деградации" in src\n'
          )
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one stale startup assertion")
          test_path.write_text(source.replace(old, new), encoding="utf-8")

          workflow = Path(".github/workflows/pr81-stale-contract-fix.yml")
          if not workflow.is_file():
              raise SystemExit("Temporary workflow is missing")
          workflow.unlink()
          PY
          python -m compileall -q main.py tests/test_livedub_qa.py tests/test_gemini_model_status.py
          git diff --check
          if grep -F 'assert "молча деградирует" in src' tests/test_livedub_qa.py; then
            echo "Stale assertion survived" >&2
            exit 1
          fi
          grep -F 'assert "обязательная возможность недоступна" in src' tests/test_livedub_qa.py
          grep -F 'assert "без скрытой деградации" in src' tests/test_livedub_qa.py

      - name: Commit clean test-contract repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_livedub_qa.py .github/workflows/pr81-stale-contract-fix.yml
          git commit -m "Align startup diagnostics regression with fail-closed wording"
          git push origin HEAD:agent/chat-findings-final-closure-20260803
