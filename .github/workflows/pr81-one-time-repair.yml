name: PR81 one-time repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr81-one-time-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 81 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair stale test contract and remove branch patch workflow
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo "PR head moved: expected $EXPECTED_HEAD, got $remote_head" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_livedub_qa.py")
          source = test_path.read_text(encoding="utf-8")
          old = '    assert "молча деградирует" in src\n'
          new = (
              '    assert "обязательная возможность недоступна" in src\n'
              '    assert "явно отклонены, а не молча ухудшены" in src\n'
              '    assert "опционально недоступен" in src\n'
              '    assert "без скрытой деградации" in src\n'
          )
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one stale startup assertion")
          test_path.write_text(source.replace(old, new), encoding="utf-8")

          branch_workflow = Path(".github/workflows/pr81-stale-contract-fix.yml")
          branch_workflow.unlink(missing_ok=True)
          PY
          python -m compileall -q main.py tests/test_livedub_qa.py tests/test_gemini_model_status.py
          git diff --check
          grep -F 'assert "обязательная возможность недоступна" in src' tests/test_livedub_qa.py
          grep -F 'assert "без скрытой деградации" in src' tests/test_livedub_qa.py
          if grep -F 'assert "молча деградирует" in src' tests/test_livedub_qa.py; then
            echo "Stale assertion survived" >&2
            exit 1
          fi

      - name: Commit repaired PR head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_livedub_qa.py
          git add -u .github/workflows/pr81-stale-contract-fix.yml || true
          git commit -m "Align startup diagnostics regression with fail-closed wording"
          git push origin "HEAD:$HEAD_REF"
