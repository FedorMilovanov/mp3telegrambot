name: Final Gemini policy cleanup v2

on:
  push:
    branches:
      - agent/gemini-37-quality-routing
    paths:
      - .github/workflows/final-gemini-policy-cleanup-v2.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gemini-37-quality-routing
      - name: Apply cleanup
        run: python scripts/_final_gemini_policy_cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          git rm scripts/_final_gemini_policy_cleanup.py
          git rm .github/workflows/final-gemini-policy-cleanup-v2.yml
          git rm .github/workflows/final-gemini-policy-doc-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md core/database.py services/gemini_qa_policy.py
          git commit -m "Finish Gemini 3.7 policy cleanup"
          git push origin HEAD:agent/gemini-37-quality-routing
# retry: ASCII-safe anchors
