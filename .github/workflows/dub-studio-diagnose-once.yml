name: Diagnose Dub Studio Once

on:
  push:
    paths:
      - .github/workflows/dub-studio-diagnose-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Capture import traceback
        id: imports
        continue-on-error: true
        shell: pwsh
        run: |
          $env:DUB_STUDIO_ENABLED = '0'
          python -c "import services.dub_studio, tools.voxcpm2.dub_worker, handlers.dub_commands, services.dub_studio_runtime; print('Dub Studio imports: OK')" *>&1 | Tee-Object dub-import.log
          exit $LASTEXITCODE

      - name: Capture full verifier output
        id: verifier
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/verify_repo.py *>&1 | Tee-Object dub-verifier.log
          exit $LASTEXITCODE

      - name: Commit diagnostic tails and remove workflow
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Lines = @(
            'Dub Studio Windows diagnostic',
            'imports=${{ steps.imports.outcome }}',
            'verifier=${{ steps.verifier.outcome }}',
            'source_commit=${{ github.sha }}',
            '',
            '=== IMPORT LOG ==='
          )
          if (Test-Path dub-import.log) { $Lines += Get-Content dub-import.log -Tail 160 }
          $Lines += @('', '=== VERIFIER LOG TAIL ===')
          if (Test-Path dub-verifier.log) { $Lines += Get-Content dub-verifier.log -Tail 260 }
          $Lines | Set-Content docs/dub_studio_ci_diagnostic.txt -Encoding utf8
          Remove-Item .github/workflows/dub-studio-diagnose-once.yml -Force
          git add docs/dub_studio_ci_diagnostic.txt .github/workflows/dub-studio-diagnose-once.yml
          git commit -m 'Record Dub Studio Windows diagnostic'
          git push origin HEAD:main
