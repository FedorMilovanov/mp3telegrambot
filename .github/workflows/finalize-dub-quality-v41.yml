name: Finalize Dub Quality V4.1

on:
  push:
    paths:
      - '.github/dub-quality-v41.trigger'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply exact v4.1 health and worker contract
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          old_runtime = 'dub-worker-tree-cancel-v3'
          new_runtime = 'dub-worker-quality-v4.1'
          for filename in (
              'services/dub_studio_runtime.py',
              'tools/voxcpm2/dub_worker_hardened.py',
              'handlers/dub_health.py',
              'tests/test_dub_worker.py',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old_runtime not in text:
                  raise RuntimeError(f'{filename}: old worker runtime token not found')
              path.write_text(text.replace(old_runtime, new_runtime), encoding='utf-8')

          health_path = Path('handlers/dub_health.py')
          health = health_path.read_text(encoding='utf-8')
          old_block = '''    quality_paths = (\n        repo / "tools" / "voxcpm2" / "dub_quality_v4.py",\n        repo / "tools" / "voxcpm2" / "semantic_tts_guard_v4.py",\n        repo / "tools" / "voxcpm2" / "voxcpm2_quality_v4_renderer.py",\n        repo / "tools" / "voxcpm2" / "master_quality_v4.py",\n    )\n    quality_ok = all(path.is_file() and path.stat().st_size > 0 for path in quality_paths)\n    checks.append(\n        _check(\n            "NoChew Quality v4",\n            quality_ok,\n            "; ".join(str(path) for path in quality_paths),\n        )\n    )\n'''
          new_block = '''    quality_policy_path = repo / "tools" / "voxcpm2" / "dub_quality_v4.py"\n    quality_guard_path = repo / "tools" / "voxcpm2" / "semantic_tts_guard_v4.py"\n    quality_renderer_path = repo / "tools" / "voxcpm2" / "voxcpm2_quality_v4_renderer.py"\n    quality_master_path = repo / "tools" / "voxcpm2" / "master_quality_v4.py"\n    gemini_entry_path = repo / "tools" / "voxcpm2" / "generic_gemini_runtime.py"\n    direct_entry_path = repo / "tools" / "voxcpm2" / "generic_direct_checked_runtime.py"\n    contract_files = (\n        quality_policy_path, quality_guard_path, quality_renderer_path,\n        quality_master_path, gemini_entry_path, direct_entry_path,\n    )\n    contract_text = {\n        path: path.read_text(encoding="utf-8") if path.is_file() else ""\n        for path in contract_files\n    }\n    quality_ok = bool(\n        all(contract_text.values())\n        and "production._build_render_segments = build_render_segments_v4"\n        in contract_text[quality_policy_path]\n        and "local-window-v4.1" in contract_text[quality_policy_path]\n        and '_GUARD_VERSION = "semantic-tts-guard-v4.1"'\n        in contract_text[quality_guard_path]\n        and "verify_timeline_v4" in contract_text[quality_guard_path]\n        and "pipeline_signature" in contract_text[quality_guard_path]\n        and 'env.pop("VOXCPM_PROMPT_TEXTS_JSON", None)'\n        in contract_text[quality_guard_path]\n        and '_QUALITY_VERSION = "voxcpm2-quality-v4.1"'\n        in contract_text[quality_renderer_path]\n        and "nested retry remains disabled" in contract_text[quality_renderer_path]\n        and '"whole_mix_loudnorm": False' in contract_text[quality_master_path]\n        and "alimiter=limit=0.985:level=false" in contract_text[quality_master_path]\n        and "semantic_tts_guard_v4.install()" in contract_text[gemini_entry_path]\n        and "semantic_tts_guard_v4.install()" in contract_text[direct_entry_path]\n        and "legacy_semantic_guard.install = _disable_legacy_guard_install"\n        in contract_text[gemini_entry_path]\n        and "legacy_semantic_guard.install = _disable_legacy_guard_install"\n        in contract_text[direct_entry_path]\n    )\n    checks.append(\n        _check(\n            "NoChew Quality v4.1",\n            quality_ok,\n            (\n                "local windows + caption coverage; reference-only renderer; "\n                "semantic/timing/chirp QA; signed checkpoints; exact-gain master; "\n                "Gemini MAX + ready SRT entrypoints"\n            ),\n        )\n    )\n'''
          if health.count(old_block) != 1:
              raise RuntimeError(f'health old quality block count={health.count(old_block)}')
          health = health.replace(old_block, new_block, 1)
          health = health.replace(
              'Оба режима требуют зелёные NoChew Quality v4, SoundFile, Whisper QA, FFmpeg, CPU Python, archive, storage и worker.',
              'Оба режима требуют зелёные NoChew Quality v4.1, SoundFile, Whisper QA, FFmpeg, CPU Python, archive, storage и worker.',
          )
          health_path.write_text(health, encoding='utf-8')

          audit_path = Path('docs/voxcpm2_quality_v4_audit.md')
          audit = audit_path.read_text(encoding='utf-8')
          addendum = '''\n\n## Quality v4.1 hardening\n\nThe v4.1 follow-up closes four gaps discovered during the final code-to-audio audit:\n\n- a single long caption cue is split even when it has no sentence punctuation, without changing word order;\n- Gemini render windows are local and cannot overrun or overlap after the Russian delay is applied;\n- final QA rejects late onset, clipped endings and isolated pre-speech chirps in addition to semantic/acoustic failure;\n- checkpoints are invalidated when text, either reference WAV, renderer code, CFG, steps or cache length changes.\n\nThe detached worker runtime is versioned as `dub-worker-quality-v4.1`, so an idle pre-v4.1 worker is replaced after update instead of being treated as current.\n'''
          if '## Quality v4.1 hardening' not in audit:
              audit_path.write_text(audit.rstrip() + addendum, encoding='utf-8')
          print('v4.1 contract patch applied')
          '@ | python -

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile and test final v4.1 surface
        id: gate
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m py_compile `
            tools/voxcpm2/dub_quality_v4.py `
            tools/voxcpm2/semantic_tts_guard_v4.py `
            tools/voxcpm2/voxcpm2_quality_v4_renderer.py `
            tools/voxcpm2/master_quality_v4.py `
            tools/voxcpm2/generic_gemini_runtime.py `
            tools/voxcpm2/generic_direct_checked_runtime.py `
            tools/voxcpm2/generic_project_runtime.py `
            tools/voxcpm2/generic_direct_runtime.py `
            tools/voxcpm2/dub_worker_hardened.py `
            handlers/dub_health.py `
            services/dub_studio_runtime.py 2>&1 | Tee-Object dub-quality-v41.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pytest -q `
            tests/test_dub_quality_v4.py `
            tests/test_generic_project_runtime.py `
            tests/test_generic_direct_runtime.py `
            tests/test_generic_gemini_runtime.py `
            tests/test_semantic_tts_guard.py `
            tests/test_dub_modes.py `
            tests/test_mode_navigation.py `
            tests/test_dub_wizard.py `
            tests/test_dub_delivery.py `
            tests/test_dub_studio.py `
            tests/test_dub_worker.py 2>&1 | Tee-Object -Append dub-quality-v41.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m ruff check `
            tools/voxcpm2/dub_quality_v4.py `
            tools/voxcpm2/semantic_tts_guard_v4.py `
            tools/voxcpm2/voxcpm2_quality_v4_renderer.py `
            tools/voxcpm2/master_quality_v4.py `
            tools/voxcpm2/generic_gemini_runtime.py `
            tools/voxcpm2/generic_direct_checked_runtime.py `
            tools/voxcpm2/dub_worker_hardened.py `
            handlers/dub_health.py `
            services/dub_studio_runtime.py `
            tests/test_dub_quality_v4.py `
            tests/test_dub_worker.py 2>&1 | Tee-Object -Append dub-quality-v41.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check 2>&1 | Tee-Object -Append dub-quality-v41.log
          exit $LASTEXITCODE

      - name: Publish validated changes or exact failure
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Status = if ('${{ steps.gate.outcome }}' -eq 'success') { 'PASS' } else { 'FAIL' }
          $Log = @()
          if (Test-Path dub-quality-v41.log) { $Log = Get-Content dub-quality-v41.log -Tail 260 }
          if ($Status -eq 'FAIL') {
            git restore handlers/dub_health.py services/dub_studio_runtime.py tools/voxcpm2/dub_worker_hardened.py tests/test_dub_worker.py docs/voxcpm2_quality_v4_audit.md
          }
          $Report = @(
            '# Dub Studio Quality v4.1 validation',
            '',
            "- Result: **$Status**",
            '- Source trigger: ${{ github.sha }}',
            '- Scope: local timing, long-cue splitting, onset/chirp/trailing QA, signed checkpoints, exact-gain master, both modes and worker replacement.',
            "- Compile/tests/Ruff: ${{ steps.gate.outcome }}",
            '- Physical VoxCPM2 A/B render still requires the local Windows model archive.'
          )
          if ($Status -eq 'FAIL') {
            $Report += ''; $Report += '```text'; $Report += $Log; $Report += '```'
          }
          $Report | Set-Content docs/dub_quality_v41_validation_latest.md -Encoding utf8
          Remove-Item .github/dub-quality-v41.trigger -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/finalize-dub-quality-v41.yml -Force
          git add -A
          git commit -m "Finalize Dub Studio Quality v4.1: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
          if ($Status -ne 'PASS') { exit 1 }
