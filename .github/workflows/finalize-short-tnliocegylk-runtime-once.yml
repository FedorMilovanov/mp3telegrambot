name: Finalize Hardened tNlIoCeGyLk Dub Once

on:
  push:
    paths:
      - .github/workflows/finalize-short-tnliocegylk-runtime-once.yml

permissions:
  contents: write

jobs:
  final-gate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Compile production surface
        shell: pwsh
        run: |
          python -m py_compile tools/voxcpm2/generic_short_production.py tools/voxcpm2/generic_short_runtime.py handlers/dub_delivery.py handlers/dub_quickstart.py services/dub_studio_runtime.py
          python -m compileall -q tools/voxcpm2 handlers services bot_new.py

      - name: Validate recipe and hardened command
        shell: pwsh
        run: |
          $Recipe = Get-Content tools/voxcpm2/recipes/short_tnliocegylk.json -Raw | ConvertFrom-Json
          if ($Recipe.actions.render.module -ne 'tools.voxcpm2.generic_short_runtime') { throw 'hardened runtime missing' }
          if ([double]$Recipe.actions.render.parameters.OriginalLevel -ne 0.18) { throw 'original level mismatch' }
          if ([int]$Recipe.actions.render.parameters.RussianDelayMs -ne 420) { throw 'delay mismatch' }
          $Piper = Get-Content tools/voxcpm2/recipes/john_piper_z20py4yqhyq.json -Raw | ConvertFrom-Json
          if ([double]$Piper.actions.render.parameters.OriginalLevel -ne 0.18) { throw 'Piper render mismatch' }
          if ([double]$Piper.actions.repair_psalm15.parameters.OriginalLevel -ne 0.18) { throw 'Piper repair mismatch' }
          python -m tools.voxcpm2.generic_short_runtime --help | Out-Null
          python -c "from tools.voxcpm2.dub_worker import build_command; c,_=build_command('short_tnliocegylk','render'); j=' '.join(c); assert 'tools.voxcpm2.generic_short_runtime' in j; assert '-OriginalLevel 0.18' in j; assert '-RussianDelayMs 420' in j"

      - name: Import Telegram and runtime adapters
        shell: pwsh
        run: python -c "import tools.voxcpm2.generic_short_runtime, handlers.dub_delivery, handlers.dub_quickstart, services.dub_studio_runtime; print('imports: OK')"

      - name: Run focused tests
        shell: pwsh
        run: python -m pytest -q tests/test_generic_short_production.py tests/test_dub_delivery.py tests/test_dub_studio.py tests/test_dub_worker.py

      - name: Ruff changed surface
        shell: pwsh
        run: python -m ruff check tools/voxcpm2/generic_short_production.py tools/voxcpm2/generic_short_runtime.py handlers/dub_delivery.py handlers/dub_quickstart.py services/dub_studio_runtime.py tests/test_generic_short_production.py tests/test_dub_delivery.py tests/test_dub_worker.py

      - name: Patch cleanliness
        shell: pwsh
        run: git diff --check

      - name: Record success and remove temporary workflows
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $History = 'docs/quality_audit_history.md'
          $Heading = '## 2026-07-27 — tNlIoCeGyLk premium Dub Studio recipe'
          if (-not (Select-String -Path $History -Pattern ([regex]::Escape($Heading)) -Quiet)) {
            Add-Content -Path $History -Encoding utf8 -Value @"

          $Heading

          - Added one-command /dubstart production for the supplied Short.
          - Hardened source acquisition reuses the bot-wide yt-dlp cookie, proxy and
            JavaScript-runtime policy; English captions fall back to CPU Whisper.
          - Translation uses the shared Gemini high-thinking config, rotates available
            keys, performs literal-literary drafting plus independent fidelity review,
            and compresses only timing-overloaded lines without dropping claims.
          - VoxCPM2 runs CPU-only through the proven NoChew multi-candidate renderer.
          - Original audio is constant 18%; Russian speech is delayed 420 ms and each
            render slot is shortened by the same amount to preserve the source endpoint.
          - /dubsend sends the primary MP4 and documents; /dubsend all adds Russian-only.
          - John Piper render and repair recipes were migrated from 25% to 18% original.
          - Windows final gate passed: compile, hardened recipe/worker contract, imports,
            focused tests, ruff and git diff check.
          "@
          }
          Remove-Item docs/tnliocegylk_ci_failure.txt -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/validate-short-tnliocegylk-once.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/finalize-short-tnliocegylk-once.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/finalize-short-tnliocegylk-runtime-once.yml -Force
          git add docs/quality_audit_history.md docs/tnliocegylk_ci_failure.txt .github/workflows/validate-short-tnliocegylk-once.yml .github/workflows/finalize-short-tnliocegylk-once.yml .github/workflows/finalize-short-tnliocegylk-runtime-once.yml
          git commit -m 'Finalize hardened tNlIoCeGyLk Dub Studio production'
          git push origin HEAD:main
