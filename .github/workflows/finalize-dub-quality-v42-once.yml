name: Finalize Dub Quality V42 Once
on:
  push:
    paths:
      - '.github/workflows/finalize-dub-quality-v42-once.yml'
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Patch Quality v4.2 QA
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          guard_path = Path("tools/voxcpm2/semantic_tts_guard_v4.py")
          guard = guard_path.read_text(encoding="utf-8")
          guard = guard.replace(
              "import numpy as np\n\nfrom tools.voxcpm2 import semantic_tts_guard as legacy\n",
              "import numpy as np\n\nfrom tools.voxcpm2.activity_quality import sustained_activity_index\nfrom tools.voxcpm2 import semantic_tts_guard as legacy\n",
              1,
          )
          guard = guard.replace(
              '_GUARD_VERSION = "semantic-tts-guard-v4.1"',
              '_GUARD_VERSION = "semantic-tts-guard-v4.2"',
              1,
          )
          old_sustained = '''def _sustained_index(active: np.ndarray, *, reverse: bool = False) -> int | None:\n    indices = range(len(active) - 1, -1, -1) if reverse else range(len(active))\n    for index in indices:\n        left = max(0, index - 2)\n        right = min(len(active), index + 3)\n        if active[index] and int(np.count_nonzero(active[left:right])) >= 3:\n            return int(index)\n    return None\n'''
          new_sustained = '''def _sustained_index(active: np.ndarray, *, reverse: bool = False) -> int | None:\n    return sustained_activity_index(active, reverse=reverse)\n'''
          if old_sustained not in guard:
              raise SystemExit("semantic guard sustained block not found")
          guard = guard.replace(old_sustained, new_sustained, 1)

          insertion = '''\n\ndef _pre_speech_artifact(\n    audio: np.ndarray,\n    sample_rate: int,\n    speech_start: int,\n    speech_rms: float,\n) -> dict[str, Any]:\n    """Detect a short click/chirp separated from the sustained sentence."""\n    pre_end = max(0, int(speech_start) - int(sample_rate * 0.012))\n    pre = np.asarray(audio[:pre_end], dtype=np.float32)\n    pre_peak = float(np.max(np.abs(pre))) if len(pre) else 0.0\n    pre_step = float(np.max(np.abs(np.diff(pre)))) if len(pre) > 1 else 0.0\n    pre_rms = math.sqrt(float(np.mean(pre**2)) + 1e-12) if len(pre) else 0.0\n    pre_zcr = (\n        float(np.mean(np.signbit(pre[1:]) != np.signbit(pre[:-1])))\n        if len(pre) > 1\n        else 0.0\n    )\n    bursts: list[dict[str, Any]] = []\n    isolated = False\n\n    frame = max(8, int(sample_rate * 0.002))\n    hop = max(4, int(sample_rate * 0.001))\n    if len(pre) >= frame:\n        starts = np.arange(0, max(1, len(pre) - frame + 1), hop, dtype=np.int64)\n        levels = np.asarray(\n            [math.sqrt(float(np.mean(pre[start : start + frame] ** 2)) + 1e-12) for start in starts],\n            dtype=np.float64,\n        )\n        active = levels >= max(0.0035, float(speech_rms) * 0.06)\n        run_start: int | None = None\n        runs: list[tuple[int, int]] = []\n        for index, value in enumerate(active):\n            if value and run_start is None:\n                run_start = index\n            if run_start is not None and (not value or index == len(active) - 1):\n                run_end = index if not value else index + 1\n                runs.append((run_start, run_end))\n                run_start = None\n\n        for left, right in runs:\n            sample_start = int(starts[left])\n            sample_end = min(len(pre), int(starts[right - 1]) + frame)\n            chunk = pre[sample_start:sample_end]\n            duration_ms = (sample_end - sample_start) * 1000.0 / sample_rate\n            gap_ms = (speech_start - sample_end) * 1000.0 / sample_rate\n            peak = float(np.max(np.abs(chunk))) if len(chunk) else 0.0\n            max_step = float(np.max(np.abs(np.diff(chunk)))) if len(chunk) > 1 else 0.0\n            zcr = (\n                float(np.mean(np.signbit(chunk[1:]) != np.signbit(chunk[:-1])))\n                if len(chunk) > 1\n                else 0.0\n            )\n            rms = math.sqrt(float(np.mean(chunk**2)) + 1e-12) if len(chunk) else 0.0\n            suspicious = bool(\n                gap_ms >= 18.0\n                and duration_ms <= 75.0\n                and (\n                    (max_step > 0.075 and peak > 0.055)\n                    or (zcr > 0.18 and rms > max(0.004, float(speech_rms) * 0.045))\n                    or peak > max(0.14, float(speech_rms) * 1.70)\n                )\n            )\n            bursts.append(\n                {\n                    "start_ms": round(sample_start * 1000.0 / sample_rate, 3),\n                    "duration_ms": round(duration_ms, 3),\n                    "gap_to_speech_ms": round(gap_ms, 3),\n                    "peak": round(peak, 6),\n                    "max_step": round(max_step, 6),\n                    "zcr": round(zcr, 6),\n                    "rms": round(rms, 6),\n                    "suspicious": suspicious,\n                }\n            )\n            isolated = isolated or suspicious\n\n    return {\n        "isolated": isolated,\n        "pre_peak": pre_peak,\n        "pre_max_step": pre_step,\n        "pre_rms": pre_rms,\n        "pre_zcr": pre_zcr,\n        "bursts": bursts,\n    }\n'''
          marker = "\n\ndef measure_timing_quality(\n"
          if marker not in guard:
              raise SystemExit("timing function marker missing")
          if "def _pre_speech_artifact(" not in guard:
              guard = guard.replace(marker, insertion + marker, 1)

          old_artifact = '''    pre_end = max(0, speech_start - int(sample_rate * 0.012))\n    pre = audio[:pre_end]\n    pre_peak = float(np.max(np.abs(pre))) if len(pre) else 0.0\n    pre_step = float(np.max(np.abs(np.diff(pre)))) if len(pre) > 1 else 0.0\n    speech_probe = audio[speech_start : min(len(audio), speech_start + int(sample_rate * 0.30))]\n    speech_rms = math.sqrt(float(np.mean(speech_probe**2)) + 1e-12) if len(speech_probe) else 0.0\n    isolated_artifact = bool(\n        len(pre)\n        and (\n            (pre_step > 0.30 and pre_peak > 0.12)\n            or (onset_ms >= 90.0 and pre_peak > max(0.18, speech_rms * 3.2))\n        )\n    )\n'''
          new_artifact = '''    speech_probe = audio[speech_start : min(len(audio), speech_start + int(sample_rate * 0.30))]\n    speech_rms = math.sqrt(float(np.mean(speech_probe**2)) + 1e-12) if len(speech_probe) else 0.0\n    artifact = _pre_speech_artifact(audio, sample_rate, speech_start, speech_rms)\n    pre_peak = float(artifact["pre_peak"])\n    pre_step = float(artifact["pre_max_step"])\n    isolated_artifact = bool(artifact["isolated"])\n'''
          if old_artifact not in guard:
              raise SystemExit("old artifact block missing")
          guard = guard.replace(old_artifact, new_artifact, 1)
          guard = guard.replace(
              '        "isolated_start_artifact": isolated_artifact,\n',
              '        "isolated_start_artifact": isolated_artifact,\n        "pre_speech_bursts": artifact["bursts"],\n        "pre_rms": round(float(artifact["pre_rms"]), 6),\n        "pre_zcr": round(float(artifact["pre_zcr"]), 6),\n',
              1,
          )
          guard = guard.replace("VoxCPM2 Quality v4.1", "VoxCPM2 Quality v4.2")
          guard = guard.replace("Quality v4.1 guard installed", "Quality v4.2 guard installed")
          guard_path.write_text(guard, encoding="utf-8")

          quality_path = Path("tools/voxcpm2/dub_quality_v4.py")
          quality = quality_path.read_text(encoding="utf-8")
          quality = quality.replace(
              "import soundfile as sf\n",
              "import soundfile as sf\n\nfrom tools.voxcpm2.activity_quality import sustained_activity_index\n",
              1,
          )
          old_quality = '''def _sustained_index(active: np.ndarray, *, reverse: bool = False) -> int | None:\n    indices = range(len(active) - 1, -1, -1) if reverse else range(len(active))\n    for index in indices:\n        left = max(0, index - 2)\n        right = min(len(active), index + 3)\n        if active[index] and int(np.count_nonzero(active[left:right])) >= 3:\n            return int(index)\n    return None\n'''
          if old_quality not in quality:
              raise SystemExit("reference sustained block missing")
          quality = quality.replace(
              old_quality,
              '''def _sustained_index(active: np.ndarray, *, reverse: bool = False) -> int | None:\n    return sustained_activity_index(active, reverse=reverse)\n''',
              1,
          )
          quality_path.write_text(quality, encoding="utf-8")

          tests_path = Path("tests/test_dub_quality_v4.py")
          tests = tests_path.read_text(encoding="utf-8")
          marker = "def test_timing_qa_accepts_stable_onset_and_rejects_late_onset() -> None:\n"
          additions = '''def test_edge_trim_rejects_thirty_ms_chirp_before_real_speech() -> None:\n    sample_rate = 16000\n    audio = np.zeros(sample_rate * 2, dtype=np.float32)\n    chirp_start = int(sample_rate * 0.10)\n    chirp_time = np.arange(int(sample_rate * 0.03), dtype=np.float32) / sample_rate\n    audio[chirp_start : chirp_start + len(chirp_time)] = 0.25 * np.sin(2 * np.pi * 3500 * chirp_time)\n    speech_start = int(sample_rate * 0.55)\n    speech_time = np.arange(int(sample_rate * 0.70), dtype=np.float32) / sample_rate\n    audio[speech_start : speech_start + len(speech_time)] = 0.12 * np.sin(2 * np.pi * 180 * speech_time)\n\n    trimmed, report = trim_candidate_edges(audio, sample_rate)\n\n    assert report["trimmed_leading"] > 0.40\n    assert len(trimmed) / sample_rate < 1.05\n\n\ndef test_timing_qa_rejects_thirty_ms_chirp_before_real_speech() -> None:\n    sample_rate = 16000\n    audio = np.zeros(sample_rate, dtype=np.float32)\n    chirp_start = int(sample_rate * 0.02)\n    chirp_time = np.arange(int(sample_rate * 0.03), dtype=np.float32) / sample_rate\n    audio[chirp_start : chirp_start + len(chirp_time)] = 0.30 * np.sin(2 * np.pi * 3500 * chirp_time)\n    speech_start = int(sample_rate * 0.12)\n    speech_time = np.arange(int(sample_rate * 0.70), dtype=np.float32) / sample_rate\n    audio[speech_start : speech_start + len(speech_time)] = 0.12 * np.sin(2 * np.pi * 180 * speech_time)\n\n    result = measure_timing_quality(audio, sample_rate)\n\n    assert result["passed"] is False\n    assert result["isolated_start_artifact"] is True\n    assert any(item["suspicious"] for item in result["pre_speech_bursts"])\n\n\n'''
          if "test_edge_trim_rejects_thirty_ms_chirp_before_real_speech" not in tests:
              if marker not in tests:
                  raise SystemExit("test marker missing")
              tests = tests.replace(marker, additions + marker, 1)
          tests_path.write_text(tests, encoding="utf-8")
          '@ | python -
      - name: Focused Windows gate
        id: gate
        continue-on-error: true
        shell: pwsh
        run: |
          python -m py_compile tools/voxcpm2/activity_quality.py tools/voxcpm2/dub_quality_v4.py tools/voxcpm2/semantic_tts_guard_v4.py tools/voxcpm2/voxcpm2_quality_v4_renderer.py tests/test_dub_quality_v4.py 2>&1 | Tee-Object dub-quality-v42-final.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_dub_quality_v4.py tests/test_semantic_tts_guard.py 2>&1 | Tee-Object -Append dub-quality-v42-final.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check tools/voxcpm2/activity_quality.py tools/voxcpm2/dub_quality_v4.py tools/voxcpm2/semantic_tts_guard_v4.py tools/voxcpm2/voxcpm2_quality_v4_renderer.py tests/test_dub_quality_v4.py 2>&1 | Tee-Object -Append dub-quality-v42-final.log
          exit $LASTEXITCODE
      - name: Publish result and remove workflow
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Status = if ('${{ steps.gate.outcome }}' -eq 'success') { 'PASS' } else { 'FAIL' }
          if ($Status -eq 'FAIL') { git reset --hard HEAD }
          Remove-Item .github/workflows/finalize-dub-quality-v42-once.yml -Force
          $Lines = @('# Dub Studio Quality v4.2 final validation','',"- Result: **$Status**",'- Connected sustained onset plus separated click/chirp detection.',"- Compile/tests/Ruff: ${{ steps.gate.outcome }}")
          if ($Status -eq 'FAIL' -and (Test-Path dub-quality-v42-final.log)) { $Lines += ''; $Lines += (Get-Content dub-quality-v42-final.log -Tail 220) }
          $Lines | Set-Content docs/dub_studio_quality_v42_final_validation.md -Encoding utf8
          git add -A
          git commit -m "Record Dub Studio Quality v4.2 final validation: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
