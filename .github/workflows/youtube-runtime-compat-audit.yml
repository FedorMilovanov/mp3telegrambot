name: YouTube Runtime Compatibility Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/youtube-runtime-compat-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: released-bgutil__stable-ytdlp
            provider_commit: "7608dd51ee813b48cf9a6d68c6e42cb197ce10e0"
            provider_source: released
            ytdlp_source: stable
          - name: candidate-bgutil__stable-ytdlp
            provider_commit: "a0be2352807e3bd6991f09d2cab685a0ab825b26"
            provider_source: candidate
            ytdlp_source: stable
          - name: released-bgutil__fixed-ytdlp
            provider_commit: "7608dd51ee813b48cf9a6d68c6e42cb197ce10e0"
            provider_source: released
            ytdlp_source: fixed
          - name: candidate-bgutil__fixed-ytdlp
            provider_commit: "a0be2352807e3bd6991f09d2cab685a0ab825b26"
            provider_source: candidate
            ytdlp_source: fixed

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install exact yt-dlp and bgutil pair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [[ "${{ matrix.ytdlp_source }}" == "stable" ]]; then
            python -m pip install "yt-dlp[default]==2026.7.4" "yt-dlp-ejs==0.8.0"
            echo "YTDLP_SOURCE=stable-2026.7.4" >> "$GITHUB_ENV"
          else
            python -m pip install "yt-dlp[default] @ git+https://github.com/yt-dlp/yt-dlp.git@5d5b634d8e6b41dc2891847a5ea7a5a3f569a28c"
            echo "YTDLP_SOURCE=5d5b634d8e6b41dc2891847a5ea7a5a3f569a28c" >> "$GITHUB_ENV"
          fi

          git clone https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git provider
          git -C provider checkout --detach "${{ matrix.provider_commit }}"
          actual_provider="$(git -C provider rev-parse HEAD)"
          [[ "$actual_provider" == "${{ matrix.provider_commit }}" ]]

          if [[ "${{ matrix.provider_source }}" == "released" ]]; then
            python -m pip install "bgutil-ytdlp-pot-provider==1.3.1"
          else
            site_dir="$(python -c 'import site; print(site.getsitepackages()[0])')"
            cp -R provider/plugin/yt_dlp_plugins "$site_dir/"
          fi

          pushd provider/server
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc
          test -f build/generate_once.js
          popd

          echo "=== exact source identity ==="
          echo "YTDLP_SOURCE=${YTDLP_SOURCE:-unknown}"
          echo "BGUTIL_SOURCE=${{ matrix.provider_commit }}"
          python -m yt_dlp --version
          python -c 'from yt_dlp_plugins.extractor.getpot_bgutil import __version__; print(f"BGUTIL_PLUGIN_IMPORT_OK version={__version__}")'
          node --version
          npm --version
          node provider/server/build/generate_once.js --version
          echo "=== selected production dependency paths ==="
          npm --prefix provider/server ls axios body-parser express path-to-regexp ws --omit=dev || true

      - name: Generate a video-bound PO token directly
        shell: bash
        run: |
          set -euo pipefail
          stdout="$RUNNER_TEMP/pot.stdout"
          stderr="$RUNNER_TEMP/pot.stderr"
          set +e
          XDG_CACHE_HOME="$RUNNER_TEMP/pot-cache" node provider/server/build/generate_once.js --content-binding=-vq7fH7ANUs --bypass-cache >"$stdout" 2>"$stderr"
          rc=$?
          set -e
          echo "POT_EXIT=$rc"
          if [[ -s "$stderr" ]]; then
            sed -n '1,80p' "$stderr"
          fi
          if [[ $rc -ne 0 ]]; then
            exit "$rc"
          fi
          python -c 'import json,sys; from pathlib import Path; lines=[x.strip() for x in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if x.strip()]; data=json.loads(lines[-1]) if lines else {}; token=str(data.get("poToken") or ""); binding=str(data.get("contentBinding") or ""); assert token, "provider returned no poToken"; assert binding == "-vq7fH7ANUs", f"unexpected contentBinding={binding!r}"; print(f"POT_OK content_binding={binding} token_length={len(token)} expires_at={data.get('"'"'expiresAt'"'"')}")' "$stdout"

      - name: Verify yt-dlp discovers the provider on production mweb route
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ytdlp-discovery.log"
          set +e
          python -m yt_dlp \
            --verbose \
            --no-config \
            --simulate \
            --no-playlist \
            --js-runtimes node \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=mweb" \
            --extractor-args "youtubepot-bgutilscript:server_home=$PWD/provider/server" \
            "https://www.youtube.com/watch?v=-vq7fH7ANUs" \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e

          grep -E "PO Token Providers:.*bgutil:script-node" "$log"
          echo "YTDLP_DISCOVERY_EXIT=$rc"
          if grep -q "HTTP Error 403" "$log"; then
            echo "GVS_403_REACHED=1"
          elif grep -Eq "Sign in to confirm you.?re not a bot" "$log"; then
            echo "GVS_403_REACHED=0 runner_blocked_at_player_api=1"
          else
            echo "GVS_403_REACHED=0 runner_blocked_at_player_api=0"
          fi
