name: Secret scan

# Единственный класс риска, который до этого PR не проверялся вообще: в проекте
# 174 переменные окружения и токены пяти внешних сервисов (Telegram, Gemini,
# VK, Yandex, YouTube cookies). Аудит 2026-10-23 показал, что в коде утечек нет,
# но «нет сейчас» — не то же самое, что «не появится».
#
# gitleaks выбран, а не trufflehog/detect-secrets: один бинарь, полная история
# и защита от новых коммитов без настройки энтропийных правил.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Раз в неделю по всей истории: путь «секрет был добавлен и удалён»
    # не виден ни на push, ни на pull_request.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история: сканируется не только дифф, но и все прошлые коммиты.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
          # Публичный репозиторий: лицензия для gitleaks-action не нужна.
