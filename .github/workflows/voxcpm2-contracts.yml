name: VoxCPM2 contract checks

on:
  pull_request:
    paths:
      - "tools/voxcpm2/**"
      - "tests/test_direct_*.py"
      - ".github/workflows/voxcpm2-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "tools/voxcpm2/**"
      - "tests/test_direct_*.py"
      - ".github/workflows/voxcpm2-contracts.yml"

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependency from the lock
        run: python tools/install_from_lock.py pytest

      - name: Compile active direct layers
        run: >-
          python -m py_compile
          tools/voxcpm2/direct_final_audit_v3.py
          tools/voxcpm2/direct_surgical_polish_v2.py
          tools/voxcpm2/direct_max_quality_cli.py
          tools/voxcpm2/generic_direct_runtime.py
          tools/voxcpm2/clean_runtime_contract.py

      - name: Run isolated audit contracts
        run: >-
          python -m pytest -q
          tests/test_direct_surgical_polish_v2.py
          tests/test_direct_final_audit_v3.py
