name: Fix Final Health Marker

on:
  push:
    branches: [agent/zero-runtime-surgery-marathon]
    paths: [.fix-final-health-trigger]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - name: Align preflight health marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('services/dub_release_health_v64.py')
          t=p.read_text(encoding='utf-8')
          old='''        "worker-preflight": _has(\n            text["preflight"],\n            "def main(",\n'''
          new='''        "worker-preflight": _has(\n            text["preflight"],\n            "def run(",\n'''
          if old not in t:
              raise SystemExit('worker-preflight health anchor missing')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify health
        run: |
          python -m compileall -q services tools/voxcpm2 handlers core pipelines main.py bot_new.py
          python - <<'PY'
          from pathlib import Path
          from services.dub_release_health_v64 import _v68_quality_contract
          ok, detail=_v68_quality_contract(Path.cwd())
          print(detail)
          assert ok, detail
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/dub_release_health_v64.py
          git commit -m "Align canonical Dub worker health"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
