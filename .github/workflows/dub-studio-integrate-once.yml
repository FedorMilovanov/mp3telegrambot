name: Integrate Dub Studio Once

on:
  push:
    paths:
      - .github/workflows/dub-studio-integrate-once.yml

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install repository verification dependencies
        id: deps
        continue-on-error: true
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Connect Dub Studio runtime to bot_new
        id: patch
        continue-on-error: true
        shell: python
        run: |
          from pathlib import Path

          path = Path('bot_new.py')
          text = path.read_text(encoding='utf-8')
          marker = 'from services.dub_studio_runtime import install_dub_studio_runtime'
          if marker not in text:
              anchor = 'try:\n    from services.restart_state_runtime import install_restart_state_runtime\n'
              if anchor not in text:
                  raise SystemExit('bot_new.py integration anchor not found')
              block = (
                  'try:\n'
                  '    from services.dub_studio_runtime import install_dub_studio_runtime\n\n'
                  '    install_dub_studio_runtime()\n'
                  'except Exception as _dub_studio_error:\n'
                  '    print(f"⚠️ VoxCPM2 Dub Studio не установлена: {_dub_studio_error}")\n\n'
              )
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding='utf-8')

          history = Path('docs/quality_audit_history.md')
          heading = '## 2026-07-27 — VoxCPM2 Dub Studio control plane'
          entry = (
              '\n\n' + heading + '\n\n'
              '- Added an admin-only Telegram control surface for durable VoxCPM2 projects.\n'
              '- Heavy CPU rendering now runs in a separate single-worker queue with SQLite WAL,\n'
              '  heartbeat, cancellation, recovery and terminal notifications.\n'
              '- Registered John Piper as the first migration recipe, including segment-only\n'
              '  Psalm 15 repair; arbitrary Telegram-provided shell commands are not accepted.\n'
              '- Added regression tests for state transitions, queue exclusivity, command\n'
              '  allow-listing and progress parsing.\n'
          )
          current = history.read_text(encoding='utf-8') if history.exists() else '# Quality audit history\n'
          if heading not in current:
              history.write_text(current.rstrip() + entry, encoding='utf-8')

      - name: Validate registered recipe and PowerShell runners
        id: powershell
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Recipe = Get-Content tools/voxcpm2/recipes/john_piper_z20py4yqhyq.json -Raw | ConvertFrom-Json
          if ($Recipe.schema_version -ne 1) { throw 'recipe schema mismatch' }
          if ($Recipe.actions.render.runner -ne 'powershell') { throw 'render runner mismatch' }
          if ($Recipe.actions.repair_psalm15.kind -ne 'repair') { throw 'repair action mismatch' }

          $Scripts = @(
            'tools/voxcpm2/examples/john_piper_z20py4yqhyq/Run-John-Piper-FINAL-CPU.ps1',
            'tools/voxcpm2/examples/john_piper_z20py4yqhyq/Run-John-Piper-Repair-Psalm15-CPU.ps1'
          )
          foreach ($Script in $Scripts) {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $Script), [ref]$Tokens, [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Errors | Format-List | Out-String | Write-Host
              throw "PowerShell parser failed: $Script"
            }
          }

      - name: Import integration modules without starting worker
        id: imports
        continue-on-error: true
        shell: pwsh
        run: |
          $env:DUB_STUDIO_ENABLED = '0'
          python -c "import services.dub_studio, tools.voxcpm2.dub_worker, handlers.dub_commands, services.dub_studio_runtime; print('Dub Studio imports: OK')"

      - name: Run full repository verifier
        id: verifier
        continue-on-error: true
        shell: pwsh
        run: python tools/verify_repo.py

      - name: Commit verified integration and remove one-time workflow
        if: steps.deps.outcome == 'success' && steps.patch.outcome == 'success' && steps.powershell.outcome == 'success' && steps.imports.outcome == 'success' && steps.verifier.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Remove-Item docs/dub_studio_ci_failure.txt -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/dub-studio-integrate-once.yml -Force
          git add bot_new.py docs/quality_audit_history.md docs/dub_studio_ci_failure.txt .github/workflows/dub-studio-integrate-once.yml
          git commit -m 'Integrate verified VoxCPM2 Dub Studio runtime'
          git push origin HEAD:main

      - name: Record exact failed stage without integrating runtime
        if: always() && !(steps.deps.outcome == 'success' && steps.patch.outcome == 'success' && steps.powershell.outcome == 'success' && steps.imports.outcome == 'success' && steps.verifier.outcome == 'success')
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          @"
          Dub Studio Windows integration failed.
          deps=${{ steps.deps.outcome }}
          patch=${{ steps.patch.outcome }}
          powershell=${{ steps.powershell.outcome }}
          imports=${{ steps.imports.outcome }}
          verifier=${{ steps.verifier.outcome }}
          source_commit=${{ github.sha }}
          "@ | Set-Content docs/dub_studio_ci_failure.txt -Encoding utf8
          git add docs/dub_studio_ci_failure.txt
          git commit -m 'Record Dub Studio Windows integration failure'
          git push origin HEAD:main
