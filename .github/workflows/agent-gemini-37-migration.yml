name: Agent Gemini 3.7 migration
on:
  push:
    branches: [agent/gemini-37-quality-routing]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-37-quality-routing
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/agent_gemini37_migrate.py
      - name: Compile
        run: python -m compileall -q core services pipelines handlers
      - name: Commit
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-gemini-37-migration.yml scripts/agent_gemini37_migrate.py
          rm -f .agent-gemini-37-trigger
          git add -A
          git diff --cached --check
          git commit -m "Route complex Gemini workloads to 3.7 Flash"
          git push origin HEAD:agent/gemini-37-quality-routing
