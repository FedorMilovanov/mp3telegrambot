      - "yt-dlp.conf"
      - "Start Bot.bat"
      - ".github/workflows/cut-policy-ci.yml"

concurrency:
  group: cut-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_requirements_lock.py

      - name: Compile source-owned cut/factory surfaces
        run: >-
          python -m py_compile
          bot_new.py
          core/globals.py
          services/gemini_capacity_runtime.py
          services/youtube_po_token_runtime.py
          services/shorts_factory_execution_guard.py
          services/shorts_factory_quality_gate.py
          services/shorts_factory_source.py
          services/shorts_factory_capacity.py
          services/shorts_factory_capacity_runtime.py
          services/shorts_factory_retry_cache.py
          services/shorts_factory_disk_guard.py
          services/shorts_factory_long_fit.py
          services/shorts_factory_media.py
          services/shorts_factory_timing.py
          services/shorts_transcription.py
          services/shorts_video.py
          services/clip_renderer.py
          services/livedub_delivery_coordinator.py
          pipelines/shorts_factory.py
          pipelines/factory_short_delivery.py
          pipelines/video_dispatch.py
          pipelines/shorts.py
          pipelines/clips.py
          pipelines/montage.py
          tools/bootstrap_bgutil_provider.py
          tools/run_pytest_with_annotations.py

      - name: Run focused regressions
        run: >-
          python tools/run_pytest_with_annotations.py -q
          tests/test_gemini_capacity_runtime.py
          tests/test_youtube_po_token_runtime.py
          tests/test_factory_audio_duration_integrity.py
          tests/test_factory_capacity_fast_fail.py
          tests/test_factory_execution_and_cut_source_policy.py
          tests/test_shorts_factory_no_downgrade.py
          tests/test_shorts_factory_source.py
          tests/test_shorts_factory_source_failures.py
          tests/test_shorts_factory_disk_guard.py
          tests/test_shorts_factory_long_fit.py
          tests/test_shorts_factory_mode.py
          tests/test_shorts_factory_quality_gate.py
          tests/test_livedub_downstream_media.py
          tests/test_cut_runtime_installation.py
          tests/test_highlights_candidate_gate.py
          tests/test_segment_delivery_media.py

      - name: Ruff focused owners
        run: >-
          python -m ruff check
          bot_new.py
          core/globals.py
          services/gemini_capacity_runtime.py
          services/youtube_po_token_runtime.py
          services/shorts_factory_execution_guard.py
          services/shorts_factory_quality_gate.py
          services/shorts_factory_source.py
          services/shorts_factory_capacity.py
          services/shorts_factory_capacity_runtime.py
          services/shorts_factory_retry_cache.py
          services/shorts_factory_disk_guard.py
          services/shorts_factory_long_fit.py
          services/shorts_factory_media.py
          services/shorts_factory_timing.py
          services/shorts_transcription.py
          services/shorts_video.py
          services/clip_renderer.py
          services/livedub_delivery_coordinator.py
          pipelines/shorts_factory.py
          pipelines/factory_short_delivery.py
          pipelines/video_dispatch.py
          pipelines/shorts.py
          pipelines/clips.py
          pipelines/montage.py
          tools/bootstrap_bgutil_provider.py
          tools/run_pytest_with_annotations.py
          tests/test_gemini_capacity_runtime.py
          tests/test_youtube_po_token_runtime.py
          tests/test_factory_audio_duration_integrity.py
          tests/test_factory_capacity_fast_fail.py
          tests/test_factory_execution_and_cut_source_policy.py
          tests/test_shorts_factory_no_downgrade.py
          tests/test_shorts_factory_source.py
          tests/test_shorts_factory_source_failures.py
          tests/test_shorts_factory_disk_guard.py
          tests/test_shorts_factory_long_fit.py
          tests/test_shorts_factory_mode.py
          tests/test_shorts_factory_quality_gate.py
          tests/test_livedub_downstream_media.py
          tests/test_cut_runtime_installation.py
          tests/test_highlights_candidate_gate.py
          tests/test_segment_delivery_media.py