name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-audit-hardening:
    name: Apply audited hardening once
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/audit-hardening-no-quality-downgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/audit-hardening-no-quality-downgrade
          fetch-depth: 0
      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply exact audited transforms once
        shell: bash
        run: |
          if [[ -f .audit-hardening-applied ]]; then
            echo "Audit hardening already applied on this branch."
            exit 0
          fi
          python tools/apply_audit_hardening_once.py
          python -m compileall -q core services pipelines handlers tests tools bot_new.py
          touch .audit-hardening-applied
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply audited hardening without quality downgrade [audit-patched]"
          git push origin HEAD:agent/audit-hardening-no-quality-downgrade

  test:
    name: Python ${{ matrix.python-version }} safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_requirements_lock.py

      - name: Validate TTS model catalog
        run: python tools/check_tts_model_catalog.py

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python tools/run_pytest_with_annotations.py -q 2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: pytest-output.txt
          retention-days: 7

      - name: Ruff configured checks
        run: python -m ruff check .

      - name: Validate baseline update evidence
        if: ${{ matrix.python-version == '3.11' }}
        run: python tools/check_code_health_baseline_update.py

      - name: Code health advisory
        run: python tools/check_code_health.py

      - name: Code health regression gate
        run: python tools/check_code_health.py --fail-on-regression

      - name: Repository verifier contract
        if: ${{ matrix.python-version == '3.11' }}
        run: python tools/verify_repo.py

  windows-runtime:
    name: Windows runtime safety checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_requirements_lock.py

      - name: Validate TTS model catalog
        run: python tools/check_tts_model_catalog.py

      - name: Compile runtime surface dynamically
        shell: pwsh
        run: |
          python -m compileall -q bot_new.py services handlers tools/voxcpm2 tests
          python -m py_compile tools/check_tts_model_catalog.py tools/run_pytest_with_annotations.py
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime compile surface failed."
          }

      - name: Run Windows-sensitive regression tests
        run: >-
          python tools/run_pytest_with_annotations.py -q
          tests/test_runtime_manifest.py
          tests/test_cut_runtime_installation.py
          tests/test_shorts_factory_candidates.py
          tests/test_shorts_factory_mode.py
          tests/test_shorts_factory_quality_gate.py
          tests/test_livedub_downstream_media.py
          tests/test_segment_delivery_media.py
          tests/test_highlights_candidate_gate.py
          tests/test_bot_lifecycle.py
          tests/test_database_migrations.py
          tests/test_backend_generation_execution_plan.py
          tests/test_requirements_lock.py
          tests/test_speech_model_profile_manifests.py
          tests/test_services_import_diagnostics.py
          tests/test_operator_runtime_status.py
          tests/test_restart_state_runtime.py
          tests/test_livedub_audio_cache_recovery.py
          tests/test_livedub_ru_provenance.py
          tests/test_livedub_install_order.py
          tests/test_local_botapi_bootstrap.py
          tests/test_local_botapi_runtime.py
          tests/test_local_botapi_required.py
          tests/test_async_process.py
          tests/test_async_process_tree.py
          tests/test_ffmpeg_probe_ownership.py
          tests/test_shorts_static_runtime.py
          tests/test_render_process_ownership.py
          tests/test_async_encoder_selection.py
          tests/test_clips_transactional_outputs.py
          tests/test_shorts_transactional_outputs.py
          tests/test_audio_conversion_postcondition.py
          tests/test_livedub_quality_runtime.py
          tests/test_livedub_audio_companion.py
          tests/test_livedub_audio_quality_guard.py
          tests/test_livedub_audio_media_integration.py
          tests/test_livedub_long_qa.py
          tests/test_livedub_user_reported_fixes.py
          tests/test_livedub_publication.py
          tests/test_livedub_deep_audit.py
          tests/test_livedub_qa_reporting_hardening.py
          tests/test_livedub_publication_runtime_resilience.py
          tests/test_livedub_qa_focused_correction.py
          tests/test_livedub_audio_retry_claims.py
          tests/test_voxcpm2_tools.py
          tests/test_voxcpm2_quality_sweep.py

      - name: Ruff configured runtime checks
        run: >-
          python -m ruff check
          bot_new.py
          services
          handlers
          tools/voxcpm2
          tools/check_tts_model_catalog.py
          tools/run_pytest_with_annotations.py
          tests/test_runtime_manifest.py
          tests/test_cut_runtime_installation.py
          tests/test_shorts_factory_candidates.py
          tests/test_shorts_factory_mode.py
          tests/test_shorts_factory_quality_gate.py
          tests/test_livedub_downstream_media.py
          tests/test_segment_delivery_media.py
          tests/test_highlights_candidate_gate.py
          tests/test_bot_lifecycle.py
          tests/test_database_migrations.py
          tests/test_backend_generation_execution_plan.py
          tests/test_requirements_lock.py
          tests/test_speech_model_profile_manifests.py
          tests/test_services_import_diagnostics.py
          tests/test_operator_runtime_status.py
          tests/test_restart_state_runtime.py
          tests/test_livedub_audio_cache_recovery.py
          tests/test_livedub_ru_provenance.py
          tests/test_livedub_install_order.py
          tests/test_local_botapi_bootstrap.py
          tests/test_local_botapi_runtime.py
          tests/test_local_botapi_required.py
          tests/test_async_process.py
          tests/test_async_process_tree.py
          tests/test_ffmpeg_probe_ownership.py
          tests/test_shorts_static_runtime.py
          tests/test_render_process_ownership.py
          tests/test_async_encoder_selection.py
          tests/test_clips_transactional_outputs.py
          tests/test_shorts_transactional_outputs.py
          tests/test_audio_conversion_postcondition.py
          tests/test_livedub_quality_runtime.py
          tests/test_livedub_audio_companion.py
          tests/test_livedub_audio_quality_guard.py
          tests/test_livedub_audio_media_integration.py
          tests/test_livedub_long_qa.py
          tests/test_livedub_user_reported_fixes.py
          tests/test_livedub_publication.py
          tests/test_livedub_deep_audit.py
          tests/test_livedub_qa_reporting_hardening.py
          tests/test_livedub_publication_runtime_resilience.py
          tests/test_livedub_qa_focused_correction.py
