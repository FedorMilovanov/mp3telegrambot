name: Apply Transactional Shorts Outputs

on:
  push:
    branches:
      - agent/shorts-transactional-outputs-20260803
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Make active Shorts outputs transactional
    if: >-
      github.head_ref == 'agent/shorts-transactional-outputs-20260803' ||
      github.ref_name == 'agent/shorts-transactional-outputs-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/shorts-transactional-outputs-20260803

      - name: Patch outputs, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_shorts_transactional_outputs.py
          rm tools/apply_shorts_transactional_outputs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/shorts_video.py tests/test_shorts_transactional_outputs.py tools/apply_shorts_transactional_outputs.py
          git diff --cached --check
          git commit -m "Make active Shorts outputs transactional"
          git push origin HEAD:agent/shorts-transactional-outputs-20260803
