name: Preclean All Montage Outputs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Preclean deterministic Montage artifacts
    if: github.head_ref == 'agent/clips-transactional-outputs-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/clips-transactional-outputs-20260803

      - name: Patch preclean, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          python tools/preclean_all_montage_outputs.py
          rm tools/preclean_all_montage_outputs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/render_clips_montage.py tools/preclean_all_montage_outputs.py
          git diff --cached --check
          git commit -m "Preclean all Montage artifacts before rendering"
          git push origin HEAD:agent/clips-transactional-outputs-20260803
