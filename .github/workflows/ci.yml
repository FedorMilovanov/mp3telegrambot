name: CI

on:
  push:
    branches: ["main"]
    # Не гоняем полный CI на коммитах, где меняются только выгрузки страниц,
    # документация или .gitignore — это частые ручные пуши оператора
    # (dump_telegraph_pages → commit → push), от них CI-письма только шумят.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"

# Частые пуши подряд отменяют предыдущий незавершённый прогон — не копим
# очередь запусков и, соответственно, писем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q

      - name: Ruff fatal checks
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Code health advisory
        run: python tools/check_code_health.py
