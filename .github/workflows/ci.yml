name: Apply Active Static Probe Owner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Apply active static runtime ownership patch
    if: github.head_ref == 'agent/ffmpeg-probe-owner-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ffmpeg-probe-owner-20260803

      - name: Patch active runtime, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_active_static_probe_owner.py
          rm tools/apply_active_static_probe_owner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/shorts_static_runtime.py tests/test_shorts_static_runtime.py tests/test_ffmpeg_probe_ownership.py tools/apply_active_static_probe_owner.py
          git diff --cached --check
          git commit -m "Own installed static detector FFmpeg process"
          git push origin HEAD:agent/ffmpeg-probe-owner-20260803
