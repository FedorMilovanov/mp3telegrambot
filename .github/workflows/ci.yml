name: Apply Transactional Clips Outputs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Make Clips and Montage outputs transactional
    if: github.head_ref == 'agent/clips-transactional-outputs-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/clips-transactional-outputs-20260803

      - name: Patch outputs, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_clips_transactional_outputs.py
          rm tools/apply_clips_transactional_outputs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/render_clips_montage.py tests/test_clips_transactional_outputs.py tools/apply_clips_transactional_outputs.py
          git diff --cached --check
          git commit -m "Make Clips and Montage outputs transactional"
          git push origin HEAD:agent/clips-transactional-outputs-20260803
