name: Clean Render Loop Aliases

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    name: Remove unused nested event-loop aliases
    if: github.head_ref == 'agent/render-process-owner-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/render-process-owner-20260803

      - name: Clean aliases, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          python tools/remove_unused_render_loops.py
          rm tools/remove_unused_render_loops.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/shorts_video.py services/render_clips_montage.py tools/remove_unused_render_loops.py
          git diff --cached --check
          git commit -m "Remove unused render event-loop aliases"
          git push origin HEAD:agent/render-process-owner-20260803
