name: Apply Async Encoder Selection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Move encoder selection off event loop
    if: github.head_ref == 'agent/encoder-probe-off-event-loop-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/encoder-probe-off-event-loop-20260803

      - name: Patch encoder call sites, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_async_encoder_selection.py
          rm tools/apply_async_encoder_selection.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/shorts_video.py services/render_clips_montage.py services/eng_subtitles.py services/shorts_subtitle_burn.py tests/test_async_encoder_selection.py tools/apply_async_encoder_selection.py
          git diff --cached --check
          git commit -m "Move encoder capability selection off event loop"
          git push origin HEAD:agent/encoder-probe-off-event-loop-20260803
