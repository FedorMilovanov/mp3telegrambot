name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-final-audit-hardening:
    name: Apply final audited cleanup
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/audit-hardening-no-quality-downgrade' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/audit-hardening-no-quality-downgrade
          fetch-depth: 0
      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply remaining exact transforms
        shell: pwsh
        run: |
          python tools/apply_remaining_audit_hardening.py
          if ($LASTEXITCODE -ne 0) { throw "Remaining audited transform failed." }
          python tools/tighten_cache_failopen.py
          if ($LASTEXITCODE -ne 0) { throw "Cache fail-open boundary hardening failed." }
          git rm -f tools/extend_audit_patcher.py
          python -m compileall -q core services pipelines handlers converters tests tools bot_new.py
          if ($LASTEXITCODE -ne 0) { throw "Patched Python compile failed." }
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f tools/apply_remaining_audit_hardening.py tools/tighten_cache_failopen.py
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed." }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish audited hardening and remove ambient fallback state"
          if ($LASTEXITCODE -ne 0) { throw "Cleanup commit failed." }
          git push origin HEAD:agent/audit-hardening-no-quality-downgrade
          if ($LASTEXITCODE -ne 0) { throw "Cleanup push failed." }
