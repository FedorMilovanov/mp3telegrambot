name: Apply Render Process Owner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Apply Shorts and Clips render ownership patch
    if: github.head_ref == 'agent/render-process-owner-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/render-process-owner-20260803

      - name: Patch render workers, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_render_process_owner.py
          rm tools/apply_render_process_owner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/shorts_video.py services/render_clips_montage.py tests/test_render_process_ownership.py tools/apply_render_process_owner.py
          git diff --cached --check
          git commit -m "Own Shorts and Clips render processes"
          git push origin HEAD:agent/render-process-owner-20260803
