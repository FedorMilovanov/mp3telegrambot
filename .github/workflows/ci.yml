name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: pytest-output.txt
          retention-days: 7

      - name: Ruff fatal checks
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Code health advisory
        run: python tools/check_code_health.py

  windows-runtime:
    name: Windows runtime safety checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile runtime modules
        run: |
          python -m py_compile bot_new.py
          python -m py_compile services/local_botapi_bootstrap.py
          python -m py_compile services/local_botapi_runtime.py
          python -m py_compile services/local_botapi_required.py
          python -m py_compile services/cloud_media_fallback.py
          python -m py_compile services/project_runtime_hardening.py
          python -m py_compile services/livedub_audio_companion.py
          python -m py_compile services/livedub_audio_quality_guard.py
          python -m py_compile services/livedub_delivery_hardening.py
          python -m py_compile services/livedub_dual_audio_policy.py
          python -m py_compile services/livedub_long_qa.py
          python -m py_compile services/livedub_output_policy.py
          python -m py_compile services/livedub_publication.py
          python -m py_compile services/livedub_publication_core.py
          python -m py_compile services/livedub_qa_trust.py
          python -m py_compile services/livedub_qa_hardening.py
          python -m py_compile services/livedub_deep_audit.py
          python -m py_compile tools/voxcpm2/segmented_cpu_dub.py
          python -m py_compile tools/voxcpm2/validate_run.py

      - name: Run Windows-sensitive regression tests
        run: >-
          python -m pytest -q
          tests/test_local_botapi_bootstrap.py
          tests/test_local_botapi_runtime.py
          tests/test_local_botapi_required.py
          tests/test_cloud_media_fallback.py
          tests/test_project_runtime_hardening.py
          tests/test_livedub_audio_companion.py
          tests/test_livedub_audio_quality_guard.py
          tests/test_livedub_dual_audio.py
          tests/test_livedub_long_qa.py
          tests/test_livedub_user_reported_fixes.py
          tests/test_livedub_publication.py
          tests/test_livedub_deep_audit.py
          tests/test_livedub_qa_reporting_hardening.py
          tests/test_livedub_publication_runtime_resilience.py
          tests/test_livedub_qa_focused_correction.py
          tests/test_livedub_audio_retry_claims.py
          tests/test_voxcpm2_tools.py

      - name: Ruff fatal checks for runtime files
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          bot_new.py
          services/local_botapi_bootstrap.py
          services/local_botapi_runtime.py
          services/local_botapi_required.py
          services/cloud_media_fallback.py
          services/project_runtime_hardening.py
          services/livedub_audio_companion.py
          services/livedub_audio_quality_guard.py
          services/livedub_delivery_hardening.py
          services/livedub_dual_audio_policy.py
          services/livedub_long_qa.py
          services/livedub_output_policy.py
          services/livedub_publication.py
          services/livedub_publication_core.py
          services/livedub_qa_trust.py
          services/livedub_qa_hardening.py
          services/livedub_deep_audit.py
          tools/voxcpm2/segmented_cpu_dub.py
          tools/voxcpm2/validate_run.py
          tests/test_local_botapi_bootstrap.py
          tests/test_local_botapi_runtime.py
          tests/test_local_botapi_required.py
          tests/test_cloud_media_fallback.py
          tests/test_project_runtime_hardening.py
          tests/test_livedub_audio_companion.py
          tests/test_livedub_audio_quality_guard.py
          tests/test_livedub_dual_audio.py
          tests/test_livedub_long_qa.py
          tests/test_livedub_user_reported_fixes.py
          tests/test_livedub_publication.py
          tests/test_livedub_deep_audit.py
          tests/test_livedub_qa_reporting_hardening.py
          tests/test_livedub_publication_runtime_resilience.py
          tests/test_livedub_qa_focused_correction.py
          tests/test_livedub_audio_retry_claims.py
          tests/test_voxcpm2_tools.py
