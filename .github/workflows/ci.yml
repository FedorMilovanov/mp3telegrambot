name: Apply FFmpeg Probe Owner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Apply FFmpeg probe ownership patch
    if: github.head_ref == 'agent/ffmpeg-probe-owner-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ffmpeg-probe-owner-20260803

      - name: Restore CI, patch, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python tools/apply_ffmpeg_probe_owner.py
          rm tools/apply_ffmpeg_probe_owner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ffmpeg.py tests/test_ffmpeg_probe_ownership.py .github/workflows/ci.yml tools/apply_ffmpeg_probe_owner.py
          git diff --cached --check
          git commit -m "Own asynchronous FFmpeg and yt-dlp probes"
          git push origin HEAD:agent/ffmpeg-probe-owner-20260803
