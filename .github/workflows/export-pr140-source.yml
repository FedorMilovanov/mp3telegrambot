name: Export PR140 Source

on:
  workflow_dispatch:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .github/workflows/export-pr140-source.yml
      - .export-pr140-trigger

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - name: Pack exact checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          with zipfile.ZipFile('pr140-source.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in root.rglob('*'):
                  if not path.is_file() or '.git' in path.parts or path.name == 'pr140-source.zip':
                      continue
                  zf.write(path, path.as_posix())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pr140-source-${{ github.sha }}
          path: pr140-source.zip
          retention-days: 1
