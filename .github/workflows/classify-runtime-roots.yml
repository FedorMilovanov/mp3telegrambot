name: Classify Runtime Roots

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .classify-runtime-roots-trigger

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify remaining roots
        run: python tools/classify_remaining_runtime_roots.py > .runtime-root-refs.txt
      - name: Commit classifier output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .runtime-root-refs.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record remaining runtime root references"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
