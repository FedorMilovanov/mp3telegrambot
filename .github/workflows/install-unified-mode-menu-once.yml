name: Install Unified MODE Menu Once

on:
  push:
    paths:
      - '.github/workflows/install-unified-mode-menu-once.yml'

permissions:
  contents: write

jobs:
  install-and-validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Patch navigation surfaces
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              return value.replace(old, new, 1)

          commands_path = 'handlers/commands.py'
          commands = read(commands_path)
          commands = replace_once(
              commands,
              'logger = logging.getLogger(__name__)\n\nasync def start(update, context):',
              '''logger = logging.getLogger(__name__)\n\n\ndef _start_keyboard(is_admin: bool) -> InlineKeyboardMarkup:\n    rows = [[\n        InlineKeyboardButton("🎛 Все режимы", callback_data="mode_menu:home"),\n    ]]\n    if is_admin:\n        rows[0].append(\n            InlineKeyboardButton("🎙 Дубляж видео", callback_data="dubwiz|home|show")\n        )\n    return InlineKeyboardMarkup(rows)\n\n\nasync def start(update, context):''',
              'insert start keyboard',
          )
          commands = replace_once(
              commands,
              '"\\n\\n🔧 <b>Команды администратора:</b>\\n"\n                "/resetcache &lt;url или video_id&gt;\\n"',
              '"\\n\\n🔧 <b>Команды администратора:</b>\\n"\n                "/mode — все режимы обработки и дубляжа\\n"\n                "/dub — дубляж: Gemini MAX или готовый SRT\\n"\n                "/dubcheck — проверить готовность Dub Studio\\n"\n                "/resetcache &lt;url или video_id&gt;\\n"',
              'extend admin help',
          )
          commands = replace_once(
              commands,
              'f"/settings — настройки функций бота"\n            f"{admin_section}\\n\\n"',
              'f"/settings — настройки функций бота\\n"\n            f"/mode — все режимы обработки и дубляжа"\n            f"{admin_section}\\n\\n"',
              'extend start commands',
          )
          commands = replace_once(
              commands,
              'await update.message.reply_text(text, parse_mode="HTML")',
              'await update.message.reply_text(\n            text,\n            parse_mode="HTML",\n            reply_markup=_start_keyboard(is_admin),\n        )',
              'attach vip start keyboard',
          )
          commands = replace_once(
              commands,
              'f"🪪 Ваш Telegram ID: <code>{user_id}</code>",\n            parse_mode="HTML"\n        )',
              'f"🪪 Ваш Telegram ID: <code>{user_id}</code>",\n            parse_mode="HTML",\n            reply_markup=_start_keyboard(is_admin),\n        )',
              'attach default start keyboard',
          )
          commands = replace_once(
              commands,
              'f"/mode — 🌐 Режим: RUS / ENG Full / ENG Quick\\n"',
              'f"/mode — 🎛 Все режимы: анализ, LiveDub и дубляж\\n"',
              'update help mode label',
          )
          write(commands_path, commands)

          main_path = 'main.py'
          main = read(main_path)
          main = replace_once(
              main,
              'app.add_handler(CallbackQueryHandler(handle_mode_callback, pattern="^set_mode:"))',
              'app.add_handler(CallbackQueryHandler(\n        handle_mode_callback, pattern=r"^(?:set_mode:|mode_menu:)"\n    ))',
              'register unified mode callbacks',
          )
          main = replace_once(
              main,
              'BotCommand("mode",  "🌐 Режим: RUS / ENG + живой перевод"),',
              'BotCommand("mode",  "🎛 Все режимы обработки и дубляжа"),',
              'update default Telegram menu',
          )
          main = replace_once(
              main,
              'vip_commands = default_commands + [\n                    BotCommand("settings",   "⚙️ Настройки бота"),',
              'vip_commands = default_commands + [\n                    BotCommand("dub",        "🎙 Дубляж: Gemini MAX / готовый SRT"),\n                    BotCommand("dubcheck",   "🩺 Проверить Dub Studio"),\n                    BotCommand("settings",   "⚙️ Настройки бота"),',
              'add Dub Studio Telegram menu commands',
          )
          write(main_path, main)

          wizard_path = 'handlers/dub_wizard.py'
          wizard = read(wizard_path)
          wizard = replace_once(
              wizard,
              '''            [\n                InlineKeyboardButton("📂 Мои проекты", callback_data="dubwiz|projects|list"),\n                InlineKeyboardButton("⚙️ Worker", callback_data="dubwiz|worker|status"),\n            ],\n        ]\n    )''',
              '''            [\n                InlineKeyboardButton("📂 Мои проекты", callback_data="dubwiz|projects|list"),\n                InlineKeyboardButton("⚙️ Worker", callback_data="dubwiz|worker|status"),\n            ],\n            [\n                InlineKeyboardButton(\n                    "🎛 Все режимы бота",\n                    callback_data="mode_menu:home",\n                )\n            ],\n        ]\n    )''',
              'add all-modes link to Dub home',
          )
          wizard = replace_once(
              wizard,
              '''    return InlineKeyboardMarkup(\n        [[InlineKeyboardButton("↩️ Назад", callback_data="dubwiz|home|show")]]\n    )''',
              '''    return InlineKeyboardMarkup(\n        [[\n            InlineKeyboardButton("↩️ Dub Studio", callback_data="dubwiz|home|show"),\n            InlineKeyboardButton("🎛 Все режимы", callback_data="mode_menu:home"),\n        ]]\n    )''',
              'improve Dub back navigation',
          )
          wizard = replace_once(
              wizard,
              '[InlineKeyboardButton("↩️ В меню", callback_data="dubwiz|home|show")],',
              '[\n                InlineKeyboardButton("↩️ Dub Studio", callback_data="dubwiz|home|show"),\n                InlineKeyboardButton("🎛 Все режимы", callback_data="mode_menu:home"),\n            ],',
              'improve SRT back navigation',
          )
          write(wizard_path, wizard)

          test_path = Path('tests/test_mode_navigation.py')
          test_path.write_text(
              '''from __future__ import annotations\n\nfrom handlers.dub_wizard import _home_keyboard as dub_home_keyboard\nfrom handlers.mode_command import _analysis_keyboard, _mode_home_keyboard\n\n\ndef _callbacks(markup) -> list[str]:\n    return [\n        button.callback_data\n        for row in markup.inline_keyboard\n        for button in row\n        if button.callback_data\n    ]\n\n\ndef test_unified_mode_menu_exposes_both_dub_paths_for_admin() -> None:\n    callbacks = _callbacks(_mode_home_keyboard("rus", is_admin=True))\n    assert "mode_menu:analysis" in callbacks\n    assert "dubwiz|mode|gemini" in callbacks\n    assert "dubwiz|mode|direct" in callbacks\n    assert "dubwiz|home|show" in callbacks\n    assert "dubwiz|projects|list" in callbacks\n\n\ndef test_unified_mode_menu_hides_admin_dub_actions_from_regular_users() -> None:\n    callbacks = _callbacks(_mode_home_keyboard("rus", is_admin=False))\n    assert callbacks == ["mode_menu:analysis"]\n\n\ndef test_analysis_submenu_is_compact_and_keeps_back_navigation() -> None:\n    markup = _analysis_keyboard("eng_fast")\n    callbacks = _callbacks(markup)\n    assert len(markup.inline_keyboard) == 3\n    assert callbacks == [\n        "set_mode:rus",\n        "set_mode:eng",\n        "set_mode:eng_fast",\n        "set_mode:eng_fast_qa",\n        "mode_menu:home",\n    ]\n    assert markup.inline_keyboard[1][0].text.startswith("✓ ")\n\n\ndef test_dub_studio_home_can_return_to_all_modes() -> None:\n    assert "mode_menu:home" in _callbacks(dub_home_keyboard())\n''',
              encoding='utf-8',
          )

          ci_path = '.github/workflows/dub-studio-checks.yml'
          ci = read(ci_path)
          ci = replace_once(
              ci,
              "      - 'handlers/dub_*.py'\n      - 'services/dub_studio*.py'",
              "      - 'handlers/dub_*.py'\n      - 'handlers/mode_command.py'\n      - 'handlers/commands.py'\n      - 'main.py'\n      - 'services/dub_studio*.py'",
              'extend push paths',
          )
          ci = replace_once(
              ci,
              "      - 'handlers/dub_*.py'\n      - 'services/dub_studio*.py'",
              "      - 'handlers/dub_*.py'\n      - 'handlers/mode_command.py'\n      - 'handlers/commands.py'\n      - 'main.py'\n      - 'services/dub_studio*.py'",
              'extend pull request paths',
          )
          ci = replace_once(
              ci,
              '            handlers/dub_health.py `\n            services/dub_studio.py `',
              '            handlers/dub_health.py `\n            handlers/mode_command.py `\n            handlers/commands.py `\n            main.py `\n            services/dub_studio.py `',
              'compile menu surface',
          )
          ci = replace_once(
              ci,
              '          tests/test_dub_modes.py\n          tests/test_dub_wizard.py',
              '          tests/test_dub_modes.py\n          tests/test_mode_navigation.py\n          tests/test_dub_wizard.py',
              'run mode navigation tests',
          )
          ci = replace_once(
              ci,
              '          handlers/dub_health.py\n          services/dub_studio_runtime.py',
              '          handlers/dub_health.py\n          handlers/mode_command.py\n          services/dub_studio_runtime.py',
              'ruff mode menu',
          )
          ci = replace_once(
              ci,
              '          tests/test_dub_modes.py\n      - name: Whitespace integrity',
              '          tests/test_dub_modes.py\n          tests/test_mode_navigation.py\n      - name: Whitespace integrity',
              'ruff mode tests',
          )
          write(ci_path, ci)
          print('Unified navigation patches applied')
          '@ | python -

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile and test unified menu
        shell: pwsh
        run: |
          python -m py_compile handlers/mode_command.py handlers/commands.py handlers/dub_wizard.py main.py
          python -m pytest -q tests/test_mode_navigation.py tests/test_dub_modes.py tests/test_dub_wizard.py tests/test_dub_studio.py tests/test_dub_worker.py
          python -m ruff check handlers/mode_command.py handlers/dub_wizard.py tests/test_mode_navigation.py
          git diff --check

      - name: Publish and remove installer
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Remove-Item .github/workflows/install-unified-mode-menu-once.yml -Force
          git add handlers/mode_command.py handlers/commands.py handlers/dub_wizard.py main.py tests/test_mode_navigation.py .github/workflows/dub-studio-checks.yml .github/workflows/install-unified-mode-menu-once.yml
          git commit -m 'Integrate Dub Studio into MODE and Telegram menus'
          git pull --rebase origin main
          git push origin HEAD:main
