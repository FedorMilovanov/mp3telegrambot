name: Gemini 3.7 env cleanup

on:
  push:
    branches:
      - agent/gemini-37-quality-routing

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gemini-37-quality-routing
          fetch-depth: 0

      - name: Patch env example
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.env.example')
          text = path.read_text(encoding='utf-8')
          text = text.replace('gemini-3.6-flash', 'gemini-3.7-flash')
          text = text.replace('Gemini 3.6 Flash', 'Gemini 3.7 Flash')
          text = text.replace('3.6/HIGH', '3.7/HIGH')
          text = text.replace('semantic 3.6-квоту', 'semantic 3.7-квоту')
          text = text.replace(
              '# GEMINI_LIGHT_FALLBACK_MODELS=gemini-3.5-flash',
              '# GEMINI_LIGHT_FALLBACK_MODELS=',
          )
          text = text.replace(
              '# НЕ ставьте GEMINI_LIGHT_ALLOW_MAIN_FALLBACK=1: utility не должен расходовать\n# semantic 3.7-квоту и не должен становиться скрытым маршрутом публикации.',
              '# GEMINI_LIGHT_ALLOW_MAIN_FALLBACK=0 запрещает utility уходить на semantic 3.7;\n# при квоте Lite перебираются ключи, а не модель.',
          )
          path.write_text(text, encoding='utf-8')

          required = (
              'GEMINI_MODEL=gemini-3.7-flash',
              '# GEMINI_MAX_MODEL=gemini-3.7-flash',
              '# LIVEDUB_QUICK_QA_MODEL=gemini-3.7-flash',
              '# LIVEDUB_LONG_QA_MODEL=gemini-3.7-flash',
              '# LIVEDUB_QA_VERIFY_MODEL=gemini-3.7-flash',
              '# LIVEDUB_INFO_MODEL=gemini-3.7-flash',
              '# GEMINI_LIGHT_MODEL=gemini-3.5-flash-lite',
              '# GEMINI_LIGHT_FALLBACK_MODELS=',
              '# GEMINI_LIGHT_ALLOW_MAIN_FALLBACK=0',
              '# LOCAL_BOT_API_REQUIRED_TIMEOUT_SEC=300',
              '# LIVEDUB_TTS_FALLBACK=0',
          )
          updated = path.read_text(encoding='utf-8')
          missing = [item for item in required if item not in updated]
          if missing:
              raise SystemExit(f'missing required env contracts: {missing}')
          if 'gemini-3.6-flash' in updated:
              raise SystemExit('stale gemini-3.6-flash remains in .env.example')
          if 'GEMINI_LIGHT_FALLBACK_MODELS=gemini-3.5-flash' in updated:
              raise SystemExit('regular 3.5 fallback remains in .env.example')
          PY

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example
          git rm .github/workflows/gemini37-env-cleanup.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align env example with Gemini 3.7 policy"
          git push origin HEAD:agent/gemini-37-quality-routing