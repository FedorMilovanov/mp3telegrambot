name: Polish Universal Dub Wizard Once

on:
  push:
    paths:
      - .github/workflows/polish-universal-dub-wizard-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply UX safeguards
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          wizard = Path('handlers/dub_wizard.py')
          text = wizard.read_text(encoding='utf-8')
          old = '''    if action == "translation":
                  await _begin_translation_upload(update, context, value)
          '''
          new = '''    if action == "translation":
                  try:
                      await _begin_translation_upload(update, context, value)
                  except Exception as exc:
                      await query.message.reply_text(
                          "⚠️ " + html.escape(_short(str(exc), 900)),
                          parse_mode="HTML",
                      )
                  return
          '''
          if old not in text:
              raise RuntimeError('translation callback anchor not found')
          text = text.replace(old, new, 1)
          old = '''    if suffix not in {".txt", ".md", ".json"}:
                  await update.effective_message.reply_text("Нужен файл TXT, MD или JSON.")
                  return
          '''
          new = '''    if suffix not in {".txt", ".md", ".json"}:
                  await update.effective_message.reply_text("Нужен файл TXT, MD или JSON.")
                  raise ApplicationHandlerStop
          '''
          if old not in text:
              raise RuntimeError('document guard anchor not found')
          wizard.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('services/dub_studio_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          old = 'from typing import Any\n\nlogger'
          new = 'from typing import Any\n\nfrom telegram import InlineKeyboardButton, InlineKeyboardMarkup\n\nlogger'
          if old not in text:
              raise RuntimeError('runtime import anchor not found')
          text = text.replace(old, new, 1)
          old = '''        await application.bot.send_message(chat_id=chat_id, text=text, parse_mode="HTML")
                  sent, failures = await send_project_outputs(application.bot, chat_id, project)
          '''
          new = '''        await application.bot.send_message(
                      chat_id=chat_id,
                      text=text,
                      parse_mode="HTML",
                      reply_markup=InlineKeyboardMarkup([[
                          InlineKeyboardButton(
                              "✍️ Загрузить мой перевод",
                              callback_data=f"dubwiz|translation|{project_id}",
                          )
                      ]]),
                  )
                  sent, failures = await send_project_outputs(application.bot, chat_id, project)
          '''
          if old not in text:
              raise RuntimeError('prepare notification anchor not found')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Validate polished wizard
        shell: pwsh
        run: |
          python -m py_compile handlers/dub_wizard.py services/dub_studio_runtime.py
          python -m pytest -q tests/test_dub_wizard.py tests/test_generic_project_runtime.py tests/test_dub_delivery.py tests/test_dub_studio.py tests/test_dub_worker.py
          python -m ruff check handlers/dub_wizard.py services/dub_studio_runtime.py
          python -c "from pathlib import Path; w=Path('handlers/dub_wizard.py').read_text(encoding='utf-8'); r=Path('services/dub_studio_runtime.py').read_text(encoding='utf-8'); assert 'raise ApplicationHandlerStop' in w; assert 'Загрузить мой перевод' in r; assert 'InlineKeyboardMarkup' in r"
          git diff --check

      - name: Commit and clean workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Remove-Item .github/workflows/polish-universal-dub-wizard-once.yml -Force
          git add handlers/dub_wizard.py services/dub_studio_runtime.py .github/workflows/polish-universal-dub-wizard-once.yml
          git commit -m 'Polish custom translation flow in Dub Studio'
          git push origin HEAD:main
