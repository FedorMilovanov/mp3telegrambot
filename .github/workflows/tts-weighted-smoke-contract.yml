name: TTS Weighted Smoke Contract

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/tts-weighted-smoke.yml'
      - '.github/workflows/tts-weighted-smoke-contract.yml'
      - 'services/tts_weighted_smoke.py'
      - 'services/tts_weighted_smoke_runner.py'
      - 'services/tts_weighted_smoke_attestation.py'
      - 'services/tts_weighted_runner_provisioning.py'
      - 'tools/run_tts_weighted_smoke.py'
      - 'tools/check_tts_weighted_smoke_runner.py'
      - 'tools/build_tts_weighted_smoke_attestation.py'
      - 'tools/check_tts_weighted_runner_provisioning.py'
      - 'tools/voxcpm2/Prepare-TTSWeightsRunner.ps1'
      - 'tests/test_tts_weighted_smoke.py'
      - 'tests/test_tts_weighted_smoke_cli.py'
      - 'tests/test_tts_weighted_smoke_runner.py'
      - 'tests/test_tts_weighted_smoke_runner_cli.py'
      - 'tests/test_tts_weighted_smoke_attestation.py'
      - 'tests/test_tts_weighted_smoke_attestation_cli.py'
      - 'tests/test_tts_weighted_smoke_workflow.py'
      - 'tests/test_tts_weighted_runner_provisioning.py'
      - 'tests/test_tts_weighted_runner_provisioning_cli.py'
      - 'tests/test_tts_weighted_runner_provisioning_powershell.py'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/tts-weighted-smoke.yml'
      - '.github/workflows/tts-weighted-smoke-contract.yml'
      - 'services/tts_weighted_smoke.py'
      - 'services/tts_weighted_smoke_runner.py'
      - 'services/tts_weighted_smoke_attestation.py'
      - 'services/tts_weighted_runner_provisioning.py'
      - 'tools/run_tts_weighted_smoke.py'
      - 'tools/check_tts_weighted_smoke_runner.py'
      - 'tools/build_tts_weighted_smoke_attestation.py'
      - 'tools/check_tts_weighted_runner_provisioning.py'
      - 'tools/voxcpm2/Prepare-TTSWeightsRunner.ps1'
      - 'tests/test_tts_weighted_smoke.py'
      - 'tests/test_tts_weighted_smoke_cli.py'
      - 'tests/test_tts_weighted_smoke_runner.py'
      - 'tests/test_tts_weighted_smoke_runner_cli.py'
      - 'tests/test_tts_weighted_smoke_attestation.py'
      - 'tests/test_tts_weighted_smoke_attestation_cli.py'
      - 'tests/test_tts_weighted_smoke_workflow.py'
      - 'tests/test_tts_weighted_runner_provisioning.py'
      - 'tests/test_tts_weighted_runner_provisioning_cli.py'
      - 'tests/test_tts_weighted_runner_provisioning_powershell.py'

permissions:
  contents: read

concurrency:
  group: tts-weighted-smoke-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_requirements_lock.py
      - name: Compile weighted smoke surface
        run: >-
          python -m py_compile
          services/tts_weighted_smoke.py
          services/tts_weighted_smoke_runner.py
          services/tts_weighted_smoke_attestation.py
          services/tts_weighted_runner_provisioning.py
          tools/run_tts_weighted_smoke.py
          tools/check_tts_weighted_smoke_runner.py
          tools/build_tts_weighted_smoke_attestation.py
          tools/check_tts_weighted_runner_provisioning.py
          tests/test_tts_weighted_smoke.py
          tests/test_tts_weighted_smoke_cli.py
          tests/test_tts_weighted_smoke_runner.py
          tests/test_tts_weighted_smoke_runner_cli.py
          tests/test_tts_weighted_smoke_attestation.py
          tests/test_tts_weighted_smoke_attestation_cli.py
          tests/test_tts_weighted_smoke_workflow.py
          tests/test_tts_weighted_runner_provisioning.py
          tests/test_tts_weighted_runner_provisioning_cli.py
          tests/test_tts_weighted_runner_provisioning_powershell.py
      - name: Parse provisioning PowerShell
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/voxcpm2/Prepare-TTSWeightsRunner.ps1').Path,
            [ref]$Tokens,
            [ref]$ParseErrors
          )
          if ($ParseErrors.Count -gt 0) {
            foreach ($ErrorItem in $ParseErrors) {
              Write-Host (
                'Line {0}, column {1}: {2}' -f
                $ErrorItem.Extent.StartLineNumber,
                $ErrorItem.Extent.StartColumnNumber,
                $ErrorItem.Message
              )
            }
            throw 'Weighted runner provisioning PowerShell contains parse errors.'
          }
      - name: Run weighted smoke contract tests
        run: >-
          python -m pytest -q
          tests/test_tts_weighted_smoke.py
          tests/test_tts_weighted_smoke_cli.py
          tests/test_tts_weighted_smoke_runner.py
          tests/test_tts_weighted_smoke_runner_cli.py
          tests/test_tts_weighted_smoke_attestation.py
          tests/test_tts_weighted_smoke_attestation_cli.py
          tests/test_tts_weighted_smoke_workflow.py
          tests/test_tts_weighted_runner_provisioning.py
          tests/test_tts_weighted_runner_provisioning_cli.py
          tests/test_tts_weighted_runner_provisioning_powershell.py
      - name: Ruff weighted smoke surface
        run: >-
          python -m ruff check
          services/tts_weighted_smoke.py
          services/tts_weighted_smoke_runner.py
          services/tts_weighted_smoke_attestation.py
          services/tts_weighted_runner_provisioning.py
          tools/run_tts_weighted_smoke.py
          tools/check_tts_weighted_smoke_runner.py
          tools/build_tts_weighted_smoke_attestation.py
          tools/check_tts_weighted_runner_provisioning.py
          tests/test_tts_weighted_smoke.py
          tests/test_tts_weighted_smoke_cli.py
          tests/test_tts_weighted_smoke_runner.py
          tests/test_tts_weighted_smoke_runner_cli.py
          tests/test_tts_weighted_smoke_attestation.py
          tests/test_tts_weighted_smoke_attestation_cli.py
          tests/test_tts_weighted_smoke_workflow.py
          tests/test_tts_weighted_runner_provisioning.py
          tests/test_tts_weighted_runner_provisioning_cli.py
          tests/test_tts_weighted_runner_provisioning_powershell.py
      - name: Whitespace integrity
        run: git diff --check
