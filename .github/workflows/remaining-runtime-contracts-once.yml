name: Remaining source-owned runtime contracts staging

on:
  push:
    branches:
      - agent/no-monkey-patch-runtime-refactor-staging

permissions:
  contents: write

jobs:
  refactor-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_requirements_lock.py
      - name: Apply deterministic cleanup
        run: python tools/_stage_remaining_runtime_contracts.py
      - name: Compile changed surfaces
        run: |
          python -m py_compile \
            main.py \
            services/polling_reliability_runtime.py \
            services/runtime_manifest.py \
            services/conspect_quality_contract.py \
            tests/test_no_runtime_surgery_contract.py \
            tests/test_conspect_quality_contract.py \
            tests/test_gemini_max_quality.py \
            tests/test_polling_reliability_runtime.py \
            tests/test_teacherly_study_synthesis.py \
            tests/test_v3_audit_r10_eng.py \
            tests/livedub_qa_cases.py
      - name: Run remaining failures and architecture regressions
        run: |
          python -m pytest -q \
            tests/test_conspect_quality_contract.py \
            tests/test_gemini_max_quality.py \
            tests/test_livedub_qa.py \
            tests/test_polling_reliability_runtime.py \
            tests/test_teacherly_study_synthesis.py \
            tests/test_v3_audit_r10_eng.py \
            tests/test_runtime_manifest.py \
            tests/test_no_runtime_surgery_contract.py \
            tests/test_source_owned_conspect_architecture.py \
            tests/test_source_owned_livedub_qa_architecture.py \
            tests/test_explicit_livedub_delivery_architecture.py \
            tests/test_explicit_livedub_delivery_transactions.py \
            tests/test_restart_state_runtime.py
      - name: Ruff fatal checks
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          main.py
          services/polling_reliability_runtime.py
          services/runtime_manifest.py
          services/conspect_quality_contract.py
          tests/test_no_runtime_surgery_contract.py
          tests/test_conspect_quality_contract.py
          tests/test_gemini_max_quality.py
          tests/test_polling_reliability_runtime.py
          tests/test_teacherly_study_synthesis.py
          tests/test_v3_audit_r10_eng.py
          tests/livedub_qa_cases.py
      - name: Commit tested cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move polling reliability to Application ownership"
          git push origin HEAD:agent/no-monkey-patch-runtime-refactor-staging
