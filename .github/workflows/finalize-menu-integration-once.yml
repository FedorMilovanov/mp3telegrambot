name: Finalize Unified Menu Integration Once

on:
  push:
    paths:
      - '.github/workflows/finalize-menu-integration-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply final integration fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'handlers/dub_commands.py',
              '    application.add_handler(CommandHandler("dub", dub_command, filters=_MSG_ONLY))\n',
              '',
              'remove duplicate /dub registration',
          )
          replace_once(
              'handlers/commands.py',
              'async def start(update, context):\n    user_id   = update.effective_user.id\n',
              'async def start(update, context):\n    # /start is a hard navigation reset: the next ordinary link must not be\n    # consumed by a half-finished Dub Studio wizard.\n    context.user_data.pop("dub_universal_wizard", None)\n    user_id   = update.effective_user.id\n',
              'clear wizard state on /start',
          )
          replace_once(
              'handlers/dub_health.py',
              'from __future__ import annotations\n\nimport html\n',
              'from __future__ import annotations\n\nimport asyncio\nimport html\n',
              'import asyncio for nonblocking preflight',
          )
          replace_once(
              'handlers/dub_health.py',
              '    checks = collect_dub_health()\n',
              '    checks = await asyncio.to_thread(collect_dub_health)\n',
              'run local preflight outside event loop',
          )

          tests = Path('tests/test_mode_navigation.py')
          source = tests.read_text(encoding='utf-8')
          addition = '''\n\ndef test_dub_command_has_one_owner_and_start_cancels_wizard() -> None:\n    wizard = Path("handlers/dub_wizard.py").read_text(encoding="utf-8")\n    commands = Path("handlers/dub_commands.py").read_text(encoding="utf-8")\n    start_commands = Path("handlers/commands.py").read_text(encoding="utf-8")\n    assert wizard.count('CommandHandler("dub", dub_home_command') == 1\n    assert 'CommandHandler("dub", dub_command' not in commands\n    assert 'context.user_data.pop("dub_universal_wizard", None)' in start_commands\n\n\ndef test_dubcheck_does_not_block_telegram_event_loop() -> None:\n    source = Path("handlers/dub_health.py").read_text(encoding="utf-8")\n    assert "checks = await asyncio.to_thread(collect_dub_health)" in source\n'''
          if 'test_dub_command_has_one_owner_and_start_cancels_wizard' not in source:
              tests.write_text(source.rstrip() + addition + '\n', encoding='utf-8')
          '@ | python -

      - name: Install dependencies
        id: deps
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt 2>&1 | Tee-Object final-menu-deps.log
          exit $LASTEXITCODE

      - name: Compile current integrated surface
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          python -m py_compile handlers/mode_command.py handlers/commands.py handlers/dub_wizard.py handlers/dub_commands.py handlers/dub_health.py handlers/dub_delivery.py main.py services/dub_studio.py services/dub_studio_runtime.py tools/voxcpm2/dub_worker.py tools/voxcpm2/dub_worker_hardened.py tools/voxcpm2/generic_short_runtime.py tools/voxcpm2/generic_gemini_runtime.py tools/voxcpm2/generic_direct_checked_runtime.py tools/voxcpm2/semantic_tts_guard.py tools/voxcpm2/voxcpm2_cpu_semantic_wrapper.py 2>&1 | Tee-Object final-menu-compile.log
          exit $LASTEXITCODE

      - name: Run full menu and Dub Studio focused tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest -q tests/test_mode_navigation.py tests/test_dub_modes.py tests/test_dub_wizard.py tests/test_dub_delivery.py tests/test_dub_studio.py tests/test_dub_worker.py tests/test_generic_project_runtime.py tests/test_generic_direct_runtime.py tests/test_generic_gemini_runtime.py tests/test_semantic_tts_guard.py 2>&1 | Tee-Object final-menu-tests.log
          exit $LASTEXITCODE

      - name: Validate exact integrated contracts
        id: contracts
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from handlers.mode_command import _mode_home_keyboard
          from tools.voxcpm2.dub_worker import build_command

          callbacks = [b.callback_data for row in _mode_home_keyboard('rus', is_admin=True).inline_keyboard for b in row if b.callback_data]
          assert callbacks == ['mode_menu:analysis','dubwiz|mode|gemini','dubwiz|mode|direct','dubwiz|projects|list','mode_menu:dubcheck']

          wizard = Path('handlers/dub_wizard.py').read_text(encoding='utf-8')
          commands = Path('handlers/dub_commands.py').read_text(encoding='utf-8')
          assert wizard.count('CommandHandler("dub", dub_home_command') == 1
          assert 'CommandHandler("dub", dub_command' not in commands

          main = Path('main.py').read_text(encoding='utf-8')
          assert main.index('handle_mode_callback, pattern=r"^(?:set_mode:|mode_menu:)"') < main.index('CallbackQueryHandler(handle_callback)')
          assert 'BotCommand("dub",        "🎙 Дубляж: Gemini MAX / готовый SRT")' in main

          gemini, _ = build_command('generic_short_v1', 'render_gemini')
          direct, _ = build_command('generic_short_v1', 'render_direct')
          assert 'tools.voxcpm2.generic_gemini_runtime' in ' '.join(gemini)
          assert 'tools.voxcpm2.generic_direct_checked_runtime' in ' '.join(direct)

          runtime = Path('services/dub_studio_runtime.py').read_text(encoding='utf-8')
          worker = Path('tools/voxcpm2/dub_worker_hardened.py').read_text(encoding='utf-8')
          assert 'dub-worker-tree-cancel-v3' in runtime
          assert 'dub-worker-tree-cancel-v3' in worker
          print('Final menu/runtime contracts: OK')
          '@ | python - 2>&1 | Tee-Object final-menu-contracts.log
          exit $LASTEXITCODE

      - name: Ruff current changed surface
        id: ruff
        continue-on-error: true
        shell: pwsh
        run: |
          python -m ruff check handlers/mode_command.py handlers/dub_wizard.py handlers/dub_commands.py handlers/dub_health.py handlers/dub_delivery.py services/dub_studio_runtime.py tools/voxcpm2/dub_worker_hardened.py tests/test_mode_navigation.py tests/test_dub_modes.py tests/test_dub_worker.py 2>&1 | Tee-Object final-menu-ruff.log
          exit $LASTEXITCODE

      - name: Publish result and remove workflow
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Passed = ('${{ steps.deps.outcome }}' -eq 'success' -and '${{ steps.compile.outcome }}' -eq 'success' -and '${{ steps.tests.outcome }}' -eq 'success' -and '${{ steps.contracts.outcome }}' -eq 'success' -and '${{ steps.ruff.outcome }}' -eq 'success')
          $Status = if ($Passed) { 'PASS' } else { 'FAIL' }
          $Lines = @(
            '# Unified MODE menu final integration',
            '',
            "- Result: **$Status**",
            '- Source: ${{ github.sha }}',
            '- Dependencies: ${{ steps.deps.outcome }}',
            '- Compile: ${{ steps.compile.outcome }}',
            '- Focused tests: ${{ steps.tests.outcome }}',
            '- Exact menu/runtime contracts: ${{ steps.contracts.outcome }}',
            '- Ruff: ${{ steps.ruff.outcome }}',
            '- Open conflicting PR #49: closed as superseded.'
          )
          if (-not $Passed) {
            foreach ($Name in @('final-menu-compile.log','final-menu-tests.log','final-menu-contracts.log','final-menu-ruff.log')) {
              if (Test-Path $Name) {
                $Lines += ''
                $Lines += "## $Name"
                $Lines += ''
                $Lines += (Get-Content $Name -Tail 140)
              }
            }
          }
          $Lines | Set-Content docs/unified_mode_menu_validation_latest.md -Encoding utf8
          Remove-Item .github/workflows/finalize-menu-integration-once.yml -Force
          git add handlers/dub_commands.py handlers/commands.py handlers/dub_health.py tests/test_mode_navigation.py docs/unified_mode_menu_validation_latest.md .github/workflows/finalize-menu-integration-once.yml
          git commit -m "Finalize unified MODE menu integration: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
