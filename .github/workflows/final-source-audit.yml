name: Final Source Audit

on:
  push:
    branches: [agent/zero-runtime-surgery-marathon]
    paths: [.final-source-audit-trigger]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines main.py bot_new.py
      - name: Zero root calls and collisions
        shell: bash
        run: |
          set -euo pipefail
          python tools/remaining_runtime_call_graph.py | tee /tmp/root.txt
          grep -q '^ROOT_CALLS=0$' /tmp/root.txt
          python tools/voxcpm_collision_audit.py | tee /tmp/collisions.txt
      - name: AST zero-runtime-surgery audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          roots = [Path('tools/voxcpm2'), Path('services'), Path('handlers'), Path('core'), Path('pipelines')]
          files=[]
          for root in roots:
              files.extend(root.rglob('*.py'))
          files += [Path('main.py'), Path('bot_new.py')]
          issues=[]

          def attr_root(node):
              while isinstance(node, ast.Attribute):
                  node=node.value
              return node.id if isinstance(node, ast.Name) else None

          for path in files:
              if not path.is_file() or 'tests' in path.parts or '__pycache__' in path.parts:
                  continue
              tree=ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              imported=set()
              imported_modules=set()
              for node in tree.body:
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          name=alias.asname or alias.name.split('.')[0]
                          imported.add(name); imported_modules.add(name)
                  elif isinstance(node, ast.ImportFrom):
                      for alias in node.names:
                          if alias.name != '*': imported.add(alias.asname or alias.name)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      for target in targets:
                          if isinstance(target, ast.Attribute):
                              root=attr_root(target)
                              if target.attr == '__class__' or root in imported_modules:
                                  issues.append(f'{path}:{node.lineno}: imported/module attr write {root}.{target.attr}')
                  if isinstance(node, ast.Call):
                      f=node.func
                      if isinstance(f, ast.Name) and f.id == 'exec':
                          issues.append(f'{path}:{node.lineno}: exec')
                      if isinstance(f, ast.Name) and f.id == 'ContextVar':
                          issues.append(f'{path}:{node.lineno}: ContextVar')
                      if isinstance(f, ast.Attribute) and f.attr in {'spec_from_file_location','module_from_spec'}:
                          issues.append(f'{path}:{node.lineno}: dynamic module loader')
                      if isinstance(f, ast.Name) and f.id == 'setattr' and node.args:
                          root=attr_root(node.args[0])
                          if root in imported:
                              issues.append(f'{path}:{node.lineno}: setattr imported {root}')
                  if isinstance(node, ast.Subscript) and isinstance(node.value, ast.Attribute):
                      v=node.value
                      if isinstance(v.value, ast.Name) and v.value.id == 'sys' and v.attr == 'modules':
                          issues.append(f'{path}:{node.lineno}: sys.modules')
          if issues:
              print('\n'.join(issues))
              raise SystemExit(f'AST_RUNTIME_SURGERY={len(issues)}')
          print('AST_RUNTIME_SURGERY=0')
          PY
      - name: Canonical source health
        run: |
          python - <<'PY'
          from pathlib import Path
          from services.dub_release_health_v64 import _v68_quality_contract
          ok, detail = _v68_quality_contract(Path.cwd())
          print(detail)
          assert ok, detail
          PY
