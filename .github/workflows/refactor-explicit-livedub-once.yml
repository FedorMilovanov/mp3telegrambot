name: One-shot explicit LiveDub refactor

on:
  push:
    branches:
      - agent/no-monkey-patch-runtime-refactor

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply deterministic codemod
        run: python tools/_one_shot_explicit_livedub_wrapper.py
      - name: Compile changed Python surfaces
        run: |
          python -m py_compile \
            services/__init__.py \
            services/pre_main_policy.py \
            services/conspect_bootstrap.py \
            services/livedub_delivery_coordinator.py \
            services/livedub_audio_companion.py \
            services/livedub_audio_cache_recovery.py \
            services/livedub_audio_quality_guard.py \
            services/livedub_mix.py \
            services/runtime_manifest.py \
            services/yandex_live_dub.py \
            services/eng_subtitles.py \
            services/ffmpeg.py \
            core/globals.py \
            pipelines/main_pipeline.py \
            tests/test_explicit_livedub_delivery_architecture.py
      - name: Commit branch refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refactor LiveDub delivery to explicit source ownership"
          git push origin HEAD:agent/no-monkey-patch-runtime-refactor
