name: One-shot source-owned Conspect refactor

on:
  push:
    branches:
      - agent/no-monkey-patch-runtime-refactor

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Apply deterministic Conspect codemod
        run: python tools/_stage_source_owned_conspect.py
      - name: Compile source-owned surfaces
        run: |
          python -m py_compile \
            core/study_quality.py \
            core/candidate_schema.py \
            core/structured_blocks.py \
            core/text_utils.py \
            core/content_audit.py \
            services/study_synthesis_policy.py \
            services/study_synthesis_runtime.py \
            services/telegraph_pages.py \
            services/conspect_quality_contract.py \
            services/conspect_audit_runtime.py \
            services/runtime_manifest.py \
            tests/test_source_owned_conspect_architecture.py
      - name: Run focused architecture and transaction tests
        run: |
          python -m pytest -q \
            tests/test_source_owned_conspect_architecture.py \
            tests/test_explicit_livedub_delivery_architecture.py \
            tests/test_explicit_livedub_delivery_transactions.py
      - name: Commit source-owned Conspect refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move Conspect quality rules to source owners"
          git push origin HEAD:agent/no-monkey-patch-runtime-refactor
