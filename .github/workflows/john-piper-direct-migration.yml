name: John Piper Direct Runner Cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/john-piper-direct-migration.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete package layers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $exampleRelative = "tools\voxcpm2\examples\john_piper_z20py4yqhyq"
          $example = Join-Path $PWD $exampleRelative
          $required = @(
              "Run-John-Piper-FINAL-CPU.ps1",
              "voxcpm2_cpu_shorts_production.py",
              "master_constant_mix.py",
              "segments_ru_final.json",
              "translation_ru.txt",
              "subtitles_ru_final.srt",
              "source_subtitles_en.srt",
              "README_RU.md"
          )

          foreach ($name in $required) {
              if (-not (Test-Path -LiteralPath (Join-Path $example $name) -PathType Leaf)) {
                  throw "Direct runner file is missing: $name"
              }
          }

          $legacyParts = @(Get-ChildItem -LiteralPath $example -Filter "package.part*.b64" -File)
          foreach ($part in $legacyParts) {
              $relative = $part.FullName.Substring($PWD.Path.Length + 1)
              git rm -- $relative
          }

          $legacyInner = Join-Path $exampleRelative "Run-John-Piper-FINAL-CPU-Inner.ps1"
          if (Test-Path -LiteralPath $legacyInner) {
              git rm -- $legacyInner
          }

          git rm -- ".github/workflows/john-piper-direct-migration.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove obsolete John Piper package launchers"
          git push origin HEAD:main
