name: John Piper Direct Runner Migration

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/john-piper-direct-migration.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract production files into the repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $example = Join-Path $PWD "tools\voxcpm2\examples\john_piper_z20py4yqhyq"
          $parts = @(Get-ChildItem -LiteralPath $example -Filter "package.part*.b64" -File | Sort-Object Name)
          if ($parts.Count -ne 7) {
              throw "Expected 7 package parts, found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName).Trim() }) -join ""
          $zip = Join-Path $env:RUNNER_TEMP "john-piper-production.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($encoded))

          $extract = Join-Path $env:RUNNER_TEMP "john-piper-production"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $required = @(
              "README_RU.md",
              "segments_ru_final.json",
              "translation_ru.txt",
              "subtitles_ru_final.srt",
              "master_constant_mix.py",
              "source_subtitles_en.srt",
              "voxcpm2_cpu_shorts_production.py",
              "Run-John-Piper-FINAL-CPU-Inner.ps1"
          )

          foreach ($name in $required) {
              $source = Join-Path $extract $name
              if (-not (Test-Path -LiteralPath $source)) {
                  throw "Required extracted file is missing: $name"
              }
              Copy-Item -LiteralPath $source -Destination (Join-Path $example $name) -Force
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "tools/voxcpm2/examples/john_piper_z20py4yqhyq"

          if (git diff --cached --quiet) {
              Write-Host "Direct files are already extracted."
              exit 0
          }

          git commit -m "Extract John Piper direct production files"
          git push origin HEAD:main
