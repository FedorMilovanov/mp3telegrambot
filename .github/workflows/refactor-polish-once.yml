name: One-shot explicit LiveDub polish

on:
  push:
    branches:
      - agent/no-monkey-patch-runtime-refactor

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Apply deterministic polish
        run: python tools/_stage_explicit_livedub_polish.py
      - name: Refine architecture assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_explicit_livedub_delivery_architecture.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "sys.meta_path" not in src\n'
          new = (
              '    assert "sys.meta_path.insert" not in src\n'
              '    assert "sys.meta_path.remove" not in src\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"architecture assertion anchor count={count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Compile and run focused behavior tests
        run: |
          python -m py_compile pipelines/main_pipeline.py services/livedub_delivery_coordinator.py
          python -m pytest -q \
            tests/test_explicit_livedub_delivery_architecture.py \
            tests/test_explicit_livedub_delivery_transactions.py
      - name: Commit branch polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish explicit LiveDub delivery transactions"
          git push origin HEAD:agent/no-monkey-patch-runtime-refactor
