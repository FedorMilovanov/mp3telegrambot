name: Direct Migration Diagnostic 2

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .direct-migration-diagnostic-trigger2

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run migration and capture diagnostic
        shell: bash
        run: |
          set +e
          python tools/source_own_generic_direct_route.py > /tmp/direct-migration-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> /tmp/direct-migration-diagnostic.txt
          git reset --hard HEAD
          git clean -fd
          cp /tmp/direct-migration-diagnostic.txt .direct-migration-diagnostic.txt
      - name: Commit diagnostic only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .direct-migration-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record direct route migration diagnostic"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
