name: Temporary Build Clean Shorts Caption PR

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/shorts-caption-separator-contract-v2-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shorts-caption-separator-contract-v2-20260802
          fetch-depth: 0

      - name: Apply surgical Shorts caption contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          video_path = Path("services/shorts_video.py")
          text = video_path.read_text(encoding="utf-8")

          marker = "\n\ndef build_short_caption(\n"
          helper = r'''

_SHORT_TITLE_SPACED_DASH_RE = re.compile(r"(?<=\S)\s+(?:-|–|—)\s+(?=\S)")


def _prepare_short_hook(hook: str, author_label: str = "") -> str:
    """Normalize one Shorts headline without touching hyphens inside words.

    Channel contract:
    - an internal semantic pause uses `` — ``;
    - the outer headline/author boundary is added later as `` - ``.

    Strip only an exact trailing author suffix before normalizing internal
    spaced dash variants. This prevents duplicate authors without removing a
    name that is legitimately part of the headline itself.
    """
    title = re.sub(r"\s+", " ", str(hook or "")).strip()
    author = re.sub(r"\s+", " ", str(author_label or "")).strip()
    if title and author:
        trailing_author = re.compile(
            rf"\s+(?:-|–|—)\s+{re.escape(author)}(?:[.!?])?$",
            re.IGNORECASE,
        )
        title = trailing_author.sub("", title).rstrip()
    return _SHORT_TITLE_SPACED_DASH_RE.sub(" — ", title)
'''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit("build_short_caption marker not found")
              text = text.replace(marker, helper + marker, 1)

          old = '''    kind         = (candidate.get("kind") or "").strip()
    hook         = (candidate.get("hook") or candidate.get("title") or "").strip()
    tags         = candidate.get("hashtags") or []
    author_label = real_author or performer or ""

    hook_tc = html_mod.escape(title_case_fragment(hook)) if hook else ""
    if kind == "quote":
        hook_tc = f"«{hook_tc}»" if hook_tc and not hook_tc.startswith("«") else hook_tc

    author_safe = html_mod.escape(author_label) if author_label else ""

    if hook_tc and author_safe:
        # Если заголовок уже заканчивается на вопросительный/восклицательный знак — разделитель не нужен
        if hook_tc[-1] in ("?", "!"):
            first_line = f"{hook_tc} {author_safe}"
        else:
            first_line = f"{hook_tc} — {author_safe}"
    else:
        first_line = hook_tc or author_safe
'''
          new = '''    kind         = (candidate.get("kind") or "").strip()
    hook         = (candidate.get("hook") or candidate.get("title") or "").strip()
    tags         = candidate.get("hashtags") or []
    author_label = real_author or performer or ""

    prepared_hook = _prepare_short_hook(hook, author_label)
    titled_hook = title_case_fragment(prepared_hook) if prepared_hook else ""
    # Общий Title Case может унифицировать пробельные тире. Повторно применяем
    # локальный контракт Shorts уже к финальному публичному заголовку.
    hook_tc = html_mod.escape(_prepare_short_hook(titled_hook)) if titled_hook else ""
    if kind == "quote":
        hook_tc = f"«{hook_tc}»" if hook_tc and not hook_tc.startswith("«") else hook_tc

    author_safe = html_mod.escape(author_label) if author_label else ""

    if hook_tc and author_safe:
        # Канальный контракт: внутренний смысловой разрыв = « — »,
        # граница «заголовок - автор» = обычный дефис с пробелами.
        first_line = f"{hook_tc} - {author_safe}"
    else:
        first_line = hook_tc or author_safe
'''
          if new not in text:
              if old not in text:
                  raise SystemExit("build_short_caption target block not found")
              text = text.replace(old, new, 1)
          video_path.write_text(text, encoding="utf-8")

          prompts_path = Path("core/prompts.py")
          prompts = prompts_path.read_text(encoding="utf-8")
          old_prompt = '''Требования к hook:
- короткий
- цепляющий
- человеческий
- без пошлого кликбейта
'''
          new_prompt = '''Требования к hook:
- короткий
- цепляющий
- человеческий
- без пошлого кликбейта
- внутри одной смысловой фразы используй длинное тире «—» с пробелами
- не используй дефис « - » как внутренний смысловой разделитель
- не добавляй имя автора в title или hook: внешний формат «Заголовок - Автор» формирует бот
'''
          if new_prompt not in prompts:
              if old_prompt not in prompts:
                  raise SystemExit("SHORTS_PROMPT hook rules not found")
              prompts = prompts.replace(old_prompt, new_prompt, 1)
          prompts_path.write_text(prompts, encoding="utf-8")

          Path("tests/test_shorts_caption_separator_contract.py").write_text(r'''from services.shorts_video import (
    _prepare_short_hook,
    build_short_caption,
)


def _caption(hook: str, *, kind: str = "") -> str:
    return build_short_caption(
        candidate={"hook": hook, "kind": kind, "hashtags": []},
        performer="",
        real_author="Пол Вошер",
        real_event="",
        format_name="sermon",
    )


def test_internal_pause_uses_em_dash_and_author_boundary_uses_hyphen() -> None:
    assert _caption(
        "Сомнение - Это не Просто Слабость, Это Прямое Оскорбление Характера Бога"
    ) == (
        "Сомнение — Это не Просто Слабость, Это Прямое Оскорбление "
        "Характера Бога - Пол Вошер"
    )


def test_question_keeps_punctuation_and_still_has_author_separator() -> None:
    assert _caption("Кто такой настоящий мужчина в браке?") == (
        "Кто Такой Настоящий Мужчина в Браке? - Пол Вошер"
    )


def test_hyphens_inside_words_are_not_changed() -> None:
    prepared = _prepare_short_hook("Действовать по-мужски - Прямой призыв", "Пол Вошер")
    assert prepared == "Действовать по-мужски — Прямой призыв"


def test_exact_trailing_author_suffix_is_removed_before_outer_formatting() -> None:
    assert _caption("Сомнение — Это Оскорбление Бога - Пол Вошер") == (
        "Сомнение — Это Оскорбление Бога - Пол Вошер"
    )


def test_quote_format_preserves_separator_contract() -> None:
    assert _caption("Сомнение - Это оскорбление Бога", kind="quote") == (
        "«Сомнение — Это Оскорбление Бога» - Пол Вошер"
    )
''', encoding="utf-8")

          for temporary in (
              Path(".github/workflows/temporary_finalize_pr75.yml"),
              Path(".github/trigger_clean_shorts_caption_pr"),
          ):
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Validate focused behavior
        shell: bash
        run: |
          git diff --check
          python -m py_compile services/shorts_video.py core/prompts.py tests/test_shorts_caption_separator_contract.py
          python -m pytest -q tests/test_shorts_caption_separator_contract.py

      - name: Commit clean focused patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce Shorts title and author separator contract"
          git push origin HEAD:agent/shorts-caption-separator-contract-v2-20260802
