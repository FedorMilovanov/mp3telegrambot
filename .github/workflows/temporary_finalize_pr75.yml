name: Temporary Finalize PR75

on:
  pull_request_target:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/shorts-caption-separator-contract-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shorts-caption-separator-contract-20260802
          fetch-depth: 0

      - name: Apply direct surgical fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          video = Path("services/shorts_video.py")
          text = video.read_text(encoding="utf-8")
          old = '''    prepared_hook = _prepare_short_hook(hook, author_label)
    hook_tc = html_mod.escape(title_case_fragment(prepared_hook)) if prepared_hook else ""
'''
          new = '''    prepared_hook = _prepare_short_hook(hook, author_label)
    titled_hook = title_case_fragment(prepared_hook) if prepared_hook else ""
    # Общий Title Case может унифицировать пробельные тире. Повторно применяем
    # локальный контракт Shorts уже к финальному публичному заголовку.
    hook_tc = html_mod.escape(_prepare_short_hook(titled_hook)) if titled_hook else ""
'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Shorts title-case block not found")
              text = text.replace(old, new, 1)
          video.write_text(text, encoding="utf-8")

          Path("pipelines/__init__.py").write_text(
              '"""Processing pipelines — video, shorts, clips, montage, playlist."""\n',
              encoding="utf-8",
          )

          runtime = Path("services/shorts_caption_contract_runtime.py")
          if runtime.exists():
              runtime.unlink()

          tests = Path("tests/test_shorts_caption_separator_contract.py")
          test_text = tests.read_text(encoding="utf-8")
          prefix = '''from services.shorts_caption_contract_runtime import (
    install_short_caption_contract_runtime,
)

install_short_caption_contract_runtime()

from services.shorts_video import (  # noqa: E402
'''
          if prefix in test_text:
              test_text = test_text.replace(prefix, 'from services.shorts_video import (\n', 1)
          tests.write_text(test_text, encoding="utf-8")

          for temporary in (
              Path(".github/workflows/oneoff_finalize_shorts_caption_contract.yml"),
              Path(".github/trigger_pr75_finalize"),
          ):
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Validate focused behavior
        shell: bash
        run: |
          git diff --check
          python -m py_compile services/shorts_video.py pipelines/__init__.py tests/test_shorts_caption_separator_contract.py
          python -m pytest -q tests/test_shorts_caption_separator_contract.py

      - name: Commit finalized patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize surgical Shorts separator contract"
          git push origin HEAD:agent/shorts-caption-separator-contract-20260802
