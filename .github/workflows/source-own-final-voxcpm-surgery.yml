name: Source-own Final VoxCPM Surgery

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .source-own-final-voxcpm-surgery-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make semantic-wrapper proof follow guard cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/source_own_final_voxcpm_surgery.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace(
              'DEAD = (\n    VOX / "examples/john_piper_z20py4yqhyq/voxcpm2_cpu_semantic_wrapper.py",',
              'DEAD = (\n    VOX / "examples/john_piper_z20py4yqhyq/voxcpm2_cpu_semantic_wrapper.py",\n    VOX / "voxcpm2_cpu_semantic_wrapper.py",',
              1,
          )
          old='''    # Prove compatibility-only files have no production consumers.\n    for path in DEAD:\n        if not path.is_file():\n            raise RuntimeError(f"dead compatibility input missing: {path}")\n        refs = _production_refs(path.stem, set(DEAD))\n        if refs:\n            raise RuntimeError(f"{path.name} still referenced: {refs}")\n\n'''
          if old in t:
              t=t.replace(old,'',1)
          anchor='''    text = remove_function(text, guard, "install")\n'''
          extra='''    text = remove_function(text, guard, "_run_guarded_synth")\n    text = remove_function(text, guard, "_is_voxcpm_synth")\n    text = text.replace('_WRAPPER_NAME = "voxcpm2_cpu_semantic_wrapper.py"\\n', '')\n'''
          if extra not in t:
              if anchor not in t:
                  raise SystemExit('guard cleanup anchor not found')
              t=t.replace(anchor, anchor+extra,1)
          delete_anchor='''    # Delete proven-dead compatibility modules and remove them from fingerprints if present.\n    contract=CONTRACT.read_text(encoding="utf-8")\n'''
          proof='''    # Prove compatibility-only files have no consumers after old guard routing is removed.\n    for path in DEAD:\n        if not path.is_file():\n            raise RuntimeError(f"dead compatibility input missing: {path}")\n        refs = _production_refs(path.stem, set(DEAD))\n        if refs:\n            raise RuntimeError(f"{path.name} still referenced after guard cleanup: {refs}")\n\n'''
          if proof not in t:
              if delete_anchor not in t:
                  raise SystemExit('delete anchor not found')
              t=t.replace(delete_anchor, proof+delete_anchor,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Source-own final VoxCPM surgery
        run: python tools/source_own_final_voxcpm_surgery.py
      - name: Compile production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines main.py bot_new.py
      - name: Verify zero active installer roots and AST surgery
        shell: bash
        run: |
          set -euo pipefail
          python tools/remaining_runtime_call_graph.py | tee /tmp/root-graph.txt
          grep -q '^ROOT_CALLS=0$' /tmp/root-graph.txt
          python tools/voxcpm_collision_audit.py
          python - <<'PY'
          import ast
          from pathlib import Path

          roots = [Path('tools/voxcpm2'), Path('services'), Path('handlers'), Path('core'), Path('pipelines')]
          files = []
          for root in roots:
              files.extend(root.rglob('*.py'))
          files.extend([Path('main.py'), Path('bot_new.py')])
          issues = []

          def attr_root(node):
              while isinstance(node, ast.Attribute):
                  node = node.value
              return node.id if isinstance(node, ast.Name) else None

          for path in files:
              if not path.is_file() or 'tests' in path.parts or '__pycache__' in path.parts:
                  continue
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              imported = set()
              for node in tree.body:
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          imported.add(alias.asname or alias.name.split('.')[0])
                  elif isinstance(node, ast.ImportFrom):
                      for alias in node.names:
                          if alias.name != '*': imported.add(alias.asname or alias.name)
              for node in ast.walk(tree):
                  targets = []
                  if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign)):
                      if isinstance(node, ast.Assign): targets = list(node.targets)
                      else: targets = [node.target]
                  for target in targets:
                      if isinstance(target, ast.Attribute):
                          root = attr_root(target)
                          if target.attr == '__class__' or root in imported:
                              issues.append(f'{path}:{getattr(node,"lineno",0)} imported-attr-write {root}.{target.attr}')
                  if isinstance(node, ast.Subscript) and isinstance(node.value, ast.Attribute):
                      if isinstance(node.value.value, ast.Name) and node.value.value.id == 'sys' and node.value.attr == 'modules':
                          issues.append(f'{path}:{node.lineno} sys.modules')
                  if isinstance(node, ast.Call):
                      func = node.func
                      if isinstance(func, ast.Name) and func.id == 'exec':
                          issues.append(f'{path}:{node.lineno} exec')
                      if isinstance(func, ast.Name) and func.id == 'ContextVar':
                          issues.append(f'{path}:{node.lineno} ContextVar')
                      if isinstance(func, ast.Attribute) and func.attr in {'spec_from_file_location','module_from_spec'}:
                          issues.append(f'{path}:{node.lineno} dynamic-module-loader')
                      if isinstance(func, ast.Name) and func.id == 'setattr' and node.args:
                          root = attr_root(node.args[0])
                          if root in imported:
                              issues.append(f'{path}:{node.lineno} setattr-imported {root}')
          if issues:
              print('\n'.join(issues))
              raise SystemExit(f'AST runtime surgery findings={len(issues)}')
          print('AST_RUNTIME_SURGERY=0')
          PY
      - name: Commit final source ownership
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove final VoxCPM runtime surgery"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
