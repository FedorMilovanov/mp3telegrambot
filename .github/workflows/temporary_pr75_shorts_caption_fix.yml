name: Temporary PR75 Shorts Caption Fix

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/shorts-caption-separator-contract-20260802' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shorts-caption-separator-contract-20260802
          fetch-depth: 0
      - name: Apply narrow post-titlecase normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/shorts_video.py')
          text = path.read_text(encoding='utf-8')
          old = '''    prepared_hook = _prepare_short_hook(hook, author_label)
    hook_tc = html_mod.escape(title_case_fragment(prepared_hook)) if prepared_hook else ""
'''
          new = '''    prepared_hook = _prepare_short_hook(hook, author_label)
    if prepared_hook:
        # The project-wide title-case layer normalises spaced dashes. Re-apply
        # the channel-specific punctuation contract to the final public hook.
        titled_hook = _prepare_short_hook(title_case_fragment(prepared_hook))
        hook_tc = html_mod.escape(titled_hook)
    else:
        hook_tc = ""
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('caption title-case block not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate focused contract
        shell: bash
        run: |
          git diff --check
          python -m py_compile services/shorts_video.py tests/test_shorts_caption_separator_contract.py
          python -m pytest -q tests/test_shorts_caption_separator_contract.py
      - name: Commit focused fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/shorts_video.py
          git commit -m "Preserve internal em dash after title casing"
          git push origin HEAD:agent/shorts-caption-separator-contract-20260802
