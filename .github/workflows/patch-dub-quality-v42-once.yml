name: Patch Dub Quality V42 Once
on:
  push:
    paths:
      - '.github/workflows/patch-dub-quality-v42-once.yml'
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Patch shared sustained activity detector
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def patch(path_raw: str, old: str, new: str) -> None:
              path = Path(path_raw)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block missing in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          import_line = "from tools.voxcpm2.activity_quality import sustained_activity_index\n"

          guard = Path("tools/voxcpm2/semantic_tts_guard_v4.py")
          guard_text = guard.read_text(encoding="utf-8")
          if import_line not in guard_text:
              guard_text = guard_text.replace(
                  "import numpy as np\n\nfrom tools.voxcpm2 import semantic_tts_guard as legacy\n",
                  "import numpy as np\n\nfrom tools.voxcpm2.activity_quality import sustained_activity_index\nfrom tools.voxcpm2 import semantic_tts_guard as legacy\n",
                  1,
              )
          old_guard = '''def _sustained_index(active: np.ndarray, *, reverse: bool = False) -> int | None:\n    indices = range(len(active) - 1, -1, -1) if reverse else range(len(active))\n    for index in indices:\n        left = max(0, index - 2)\n        right = min(len(active), index + 3)\n        if active[index] and int(np.count_nonzero(active[left:right])) >= 3:\n            return int(index)\n    return None\n'''
          new_guard = '''def _sustained_index(active: np.ndarray, *, reverse: bool = False) -> int | None:\n    return sustained_activity_index(active, reverse=reverse)\n'''
          if old_guard not in guard_text:
              raise SystemExit("semantic guard sustained block missing")
          guard_text = guard_text.replace(old_guard, new_guard, 1).replace("v4.1", "v4.2")
          guard.write_text(guard_text, encoding="utf-8")

          quality = Path("tools/voxcpm2/dub_quality_v4.py")
          quality_text = quality.read_text(encoding="utf-8")
          if import_line not in quality_text:
              quality_text = quality_text.replace(
                  "import soundfile as sf\n",
                  "import soundfile as sf\n\nfrom tools.voxcpm2.activity_quality import sustained_activity_index\n",
                  1,
              )
          old_quality = '''def _sustained_index(active: np.ndarray, *, reverse: bool = False) -> int | None:\n    indices = range(len(active) - 1, -1, -1) if reverse else range(len(active))\n    for index in indices:\n        left = max(0, index - 2)\n        right = min(len(active), index + 3)\n        if active[index] and int(np.count_nonzero(active[left:right])) >= 3:\n            return int(index)\n    return None\n'''
          new_quality = '''def _sustained_index(active: np.ndarray, *, reverse: bool = False) -> int | None:\n    return sustained_activity_index(active, reverse=reverse)\n'''
          if old_quality not in quality_text:
              raise SystemExit("reference quality sustained block missing")
          quality.write_text(quality_text.replace(old_quality, new_quality, 1), encoding="utf-8")

          tests = Path("tests/test_dub_quality_v4.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_timing_qa_accepts_stable_onset_and_rejects_late_onset() -> None:\n"
          addition = '''def test_edge_trim_rejects_thirty_ms_chirp_before_real_speech() -> None:\n    sample_rate = 16000\n    audio = np.zeros(sample_rate * 2, dtype=np.float32)\n    chirp_start = int(sample_rate * 0.10)\n    chirp_time = np.arange(int(sample_rate * 0.03), dtype=np.float32) / sample_rate\n    audio[chirp_start : chirp_start + len(chirp_time)] = 0.25 * np.sin(2 * np.pi * 3500 * chirp_time)\n    speech_start = int(sample_rate * 0.55)\n    speech_time = np.arange(int(sample_rate * 0.70), dtype=np.float32) / sample_rate\n    audio[speech_start : speech_start + len(speech_time)] = 0.12 * np.sin(2 * np.pi * 180 * speech_time)\n\n    trimmed, report = trim_candidate_edges(audio, sample_rate)\n\n    assert report["trimmed_leading"] > 0.40\n    assert len(trimmed) / sample_rate < 1.05\n\n\ndef test_timing_qa_rejects_thirty_ms_chirp_before_real_speech() -> None:\n    sample_rate = 16000\n    audio = np.zeros(sample_rate, dtype=np.float32)\n    chirp_start = int(sample_rate * 0.02)\n    chirp_time = np.arange(int(sample_rate * 0.03), dtype=np.float32) / sample_rate\n    audio[chirp_start : chirp_start + len(chirp_time)] = 0.30 * np.sin(2 * np.pi * 3500 * chirp_time)\n    speech_start = int(sample_rate * 0.12)\n    speech_time = np.arange(int(sample_rate * 0.70), dtype=np.float32) / sample_rate\n    audio[speech_start : speech_start + len(speech_time)] = 0.12 * np.sin(2 * np.pi * 180 * speech_time)\n\n    result = measure_timing_quality(audio, sample_rate)\n\n    assert result["passed"] is False\n    assert result["isolated_start_artifact"] is True\n\n\n'''
          if "test_edge_trim_rejects_thirty_ms_chirp_before_real_speech" not in test_text:
              if marker not in test_text:
                  raise SystemExit("test insertion marker missing")
              tests.write_text(test_text.replace(marker, addition + marker, 1), encoding="utf-8")
          '@ | python -
      - name: Focused Windows gate
        id: gate
        continue-on-error: true
        shell: pwsh
        run: |
          python -m py_compile tools/voxcpm2/activity_quality.py tools/voxcpm2/dub_quality_v4.py tools/voxcpm2/semantic_tts_guard_v4.py tools/voxcpm2/voxcpm2_quality_v4_renderer.py tests/test_dub_quality_v4.py 2>&1 | Tee-Object dub-quality-v42.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_dub_quality_v4.py tests/test_semantic_tts_guard.py 2>&1 | Tee-Object -Append dub-quality-v42.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check tools/voxcpm2/activity_quality.py tools/voxcpm2/dub_quality_v4.py tools/voxcpm2/semantic_tts_guard_v4.py tools/voxcpm2/voxcpm2_quality_v4_renderer.py tests/test_dub_quality_v4.py 2>&1 | Tee-Object -Append dub-quality-v42.log
          exit $LASTEXITCODE
      - name: Publish result and remove workflow
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Status = if ('${{ steps.gate.outcome }}' -eq 'success') { 'PASS' } else { 'FAIL' }
          if ($Status -eq 'FAIL') {
            git reset --hard HEAD
          }
          Remove-Item .github/workflows/patch-dub-quality-v42-once.yml -Force
          $Lines = @('# Dub Studio Quality v4.2 validation','',"- Result: **$Status**",'- Density-based sustained speech onset; 30 ms chirp regression.',"- Compile/tests/Ruff: ${{ steps.gate.outcome }}")
          if ($Status -eq 'FAIL' -and (Test-Path dub-quality-v42.log)) { $Lines += ''; $Lines += (Get-Content dub-quality-v42.log -Tail 200) }
          $Lines | Set-Content docs/dub_studio_quality_v42_validation_latest.md -Encoding utf8
          git add -A
          git commit -m "Record Dub Studio Quality v4.2 validation: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
