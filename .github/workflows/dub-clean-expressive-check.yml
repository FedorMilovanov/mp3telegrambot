name: Clean Expressive Dub

on:
  push:
    branches: [main]
    paths:
      - "bot_new.py"
      - "services/dub_title_policy.py"
      - "services/dub_studio_runtime.py"
      - "tools/voxcpm2/dub_worker_hardened.py"
      - "tools/voxcpm2/generic_short_runtime.py"
      - "tools/voxcpm2/direct_max_quality_*.py"
      - "tools/voxcpm2/direct_timbre_analysis.py"
      - "tools/voxcpm2/final_media_qa.py"
      - "tools/voxcpm2/continuous_reference_policy.py"
      - "tools/voxcpm2/controlled_reference_gate.py"
      - "tools/voxcpm2/russian_spoken_numbers.py"
      - "tools/voxcpm2/professional_audio_v45.py"
      - "tools/voxcpm2/professional_audio_qa_v45.py"
      - "tools/voxcpm2/examples/john_piper_z20py4yqhyq/voxcpm2_cpu_shorts_production.py"
      - "tools/voxcpm2/examples/john_piper_z20py4yqhyq/master_constant_mix.py"
      - "tools/voxcpm2/expressive_*.py"
      - "tools/voxcpm2/generic_clean_*.py"
      - "tools/voxcpm2/clean_*.py"
      - "tools/voxcpm2/recipes/generic_short_v1.json"
      - "handlers/dub_health.py"
      - "handlers/dub_wizard.py"
      - "tests/test_clean_reference_transport.py"
      - "tests/test_continuous_reference_policy.py"
      - "tests/test_continuous_reference_release_contract.py"
      - "tests/test_controlled_reference_gate.py"
      - "tests/test_calm_reference_identity_gate.py"
      - "tests/test_direct_max_quality_renderer.py"
      - "tests/test_direct_retry_checkpoint.py"
      - "tests/test_direct_segment_input_contract.py"
      - "tests/test_direct_timbre_analysis.py"
      - "tests/test_dual_whisper_semantic_qa.py"
      - "tests/test_forced_russian_script_gate.py"
      - "tests/test_numeric_semantic_targets.py"
      - "tests/test_expression_aware_voice_qa.py"
      - "tests/test_final_media_qa.py"
      - "tests/test_master_loudnorm_contract.py"
      - "tests/test_gemini_translation_quality.py"
      - "tests/test_dub_title_policy.py"
      - "tests/test_dub_runtime_progress.py"
      - "tests/test_expressive_dub_policy.py"
      - "tests/test_clean_dub_production.py"
      - "tests/test_clean_dub_health_contract.py"
      - ".github/workflows/dub-clean-expressive-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contract dependencies
        run: python -m pip install --upgrade pytest numpy soundfile
      - name: Compile expressive production modules
        run: |
          python -m py_compile \
            bot_new.py \
            services/dub_title_policy.py \
            services/dub_studio_runtime.py \
            tools/voxcpm2/dub_worker_hardened.py \
            tools/voxcpm2/generic_short_runtime.py \
            tools/voxcpm2/direct_max_quality_io.py \
            tools/voxcpm2/direct_timbre_analysis.py \
            tools/voxcpm2/direct_max_quality_analysis.py \
            tools/voxcpm2/direct_max_quality_render.py \
            tools/voxcpm2/direct_max_quality_cli.py \
            tools/voxcpm2/final_media_qa.py \
            tools/voxcpm2/continuous_reference_policy.py \
            tools/voxcpm2/controlled_reference_gate.py \
            tools/voxcpm2/russian_spoken_numbers.py \
            tools/voxcpm2/professional_audio_v45.py \
            tools/voxcpm2/professional_audio_qa_v45.py \
            tools/voxcpm2/examples/john_piper_z20py4yqhyq/voxcpm2_cpu_shorts_production.py \
            tools/voxcpm2/examples/john_piper_z20py4yqhyq/master_constant_mix.py \
            tools/voxcpm2/expressive_continuity.py \
            tools/voxcpm2/expressive_translation.py \
            tools/voxcpm2/generic_clean_gemini_runtime.py \
            tools/voxcpm2/generic_clean_direct_runtime.py \
            tools/voxcpm2/generic_clean_custom_runtime.py \
            tools/voxcpm2/generic_clean_audio_repair_runtime.py \
            handlers/dub_health.py \
            handlers/dub_wizard.py
      - name: Run focused contracts
        run: |
          pytest -q \
            tests/test_clean_reference_transport.py \
            tests/test_continuous_reference_policy.py \
            tests/test_continuous_reference_release_contract.py \
            tests/test_controlled_reference_gate.py \
            tests/test_calm_reference_identity_gate.py \
            tests/test_direct_max_quality_renderer.py \
            tests/test_direct_retry_checkpoint.py \
            tests/test_direct_segment_input_contract.py \
            tests/test_direct_timbre_analysis.py \
            tests/test_dual_whisper_semantic_qa.py \
            tests/test_forced_russian_script_gate.py \
            tests/test_numeric_semantic_targets.py \
            tests/test_expression_aware_voice_qa.py \
            tests/test_final_media_qa.py \
            tests/test_master_loudnorm_contract.py \
            tests/test_gemini_translation_quality.py \
            tests/test_dub_title_policy.py \
            tests/test_dub_runtime_progress.py \
            tests/test_expressive_dub_policy.py \
            tests/test_clean_dub_production.py \
            tests/test_clean_dub_health_contract.py
