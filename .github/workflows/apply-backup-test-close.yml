name: Apply backup test close fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/close_backup_test_connection.py"
      - ".github/workflows/apply-backup-test-close.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/windows-full-suite-fixes-20260803
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact test patch
        run: python .github/scripts/close_backup_test_connection.py

      - name: Remove one-time patch machinery
        run: |
          rm .github/scripts/close_backup_test_connection.py
          rm .github/workflows/apply-backup-test-close.yml

      - name: Commit patched test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Close backup verification connection explicitly"
          git push origin HEAD:agent/windows-full-suite-fixes-20260803
