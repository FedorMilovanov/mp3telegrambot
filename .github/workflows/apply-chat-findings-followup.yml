name: Apply chat findings follow-up

on:
  push:
    branches:
      - agent/chat-findings-final-closure-20260803
    paths:
      - tools/apply_chat_findings_followup.py
      - .github/workflows/apply-chat-findings-followup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply final artifact QA follow-up'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-findings-final-closure-20260803
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/apply_chat_findings_followup.py
      - run: >-
          python -m py_compile
          services/media_delivery_probe.py
          tests/test_media_delivery_probe.py
          tests/test_highlights_quality.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chat-findings-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply final artifact QA follow-up'
          git push origin HEAD:agent/chat-findings-final-closure-20260803
