name: TTS Weighted Smoke

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: Production TTS profile ID
        required: true
        default: voxcpm2-production-v1
        type: string
      duration_budget:
        description: Short synthesis duration budget in seconds
        required: true
        default: '4.0'
        type: string

permissions:
  contents: read

concurrency:
  group: tts-weighted-smoke
  cancel-in-progress: false

jobs:
  weighted-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, tts-weights]
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      TTS_SMOKE_PROFILE_ID_INPUT: ${{ inputs.profile_id }}
      TTS_SMOKE_DURATION_INPUT: ${{ inputs.duration_budget }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Validate trusted runner configuration
        shell: pwsh
        run: |
          $Required = @(
            'TTS_SMOKE_PYTHON',
            'TTS_SMOKE_MODEL_ROOT',
            'TTS_SMOKE_REFERENCE_WAV',
            'TTS_SMOKE_PROFILE_ID_INPUT',
            'TTS_SMOKE_DURATION_INPUT'
          )
          foreach ($Name in $Required) {
            $Value = [Environment]::GetEnvironmentVariable($Name)
            if ([string]::IsNullOrWhiteSpace($Value)) {
              throw "Trusted runner environment variable is missing: $Name"
            }
          }
          if (-not (Test-Path -LiteralPath $env:TTS_SMOKE_PYTHON -PathType Leaf)) {
            throw 'Configured TTS smoke Python is not a file.'
          }
          if (-not (Test-Path -LiteralPath $env:TTS_SMOKE_MODEL_ROOT)) {
            throw 'Configured TTS smoke model root does not exist.'
          }
          if (-not (Test-Path -LiteralPath $env:TTS_SMOKE_REFERENCE_WAV -PathType Leaf)) {
            throw 'Configured TTS smoke reference WAV is not a file.'
          }
          if ($env:TTS_SMOKE_PROFILE_ID_INPUT -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]{1,94}[A-Za-z0-9]$') {
            throw 'TTS smoke profile input has invalid syntax.'
          }
          $Duration = 0.0
          if (-not [double]::TryParse(
            $env:TTS_SMOKE_DURATION_INPUT,
            [Globalization.NumberStyles]::Float,
            [Globalization.CultureInfo]::InvariantCulture,
            [ref]$Duration
          )) {
            throw 'TTS smoke duration input is not a finite invariant number.'
          }
          if ([double]::IsNaN($Duration) -or [double]::IsInfinity($Duration) -or $Duration -lt 0.2 -or $Duration -gt 30.0) {
            throw 'TTS smoke duration input must be within 0.2..30.0 seconds.'
          }
          $Version = & $env:TTS_SMOKE_PYTHON -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')"
          if ($LASTEXITCODE -ne 0) {
            throw 'Configured TTS smoke Python could not start.'
          }
          Write-Host "Trusted TTS runtime Python version: $Version"

      - name: Validate repository contracts with trusted Python
        shell: pwsh
        run: |
          & $env:TTS_SMOKE_PYTHON tools/check_tts_model_catalog.py
          if ($LASTEXITCODE -ne 0) {
            throw 'TTS model catalog validation failed.'
          }
          & $env:TTS_SMOKE_PYTHON -m py_compile `
            services/tts_weighted_smoke.py `
            services/tts_weighted_smoke_runner.py `
            services/tts_weighted_smoke_attestation.py `
            tools/run_tts_weighted_smoke.py `
            tools/check_tts_weighted_smoke_runner.py `
            tools/build_tts_weighted_smoke_attestation.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Weighted smoke surface compile failed.'
          }

      - name: Run trusted runner doctor
        shell: pwsh
        run: |
          $RootWork = Join-Path $env:RUNNER_TEMP "tts-weighted-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -LiteralPath $RootWork) {
            Remove-Item -LiteralPath $RootWork -Recurse -Force
          }
          $DoctorWork = Join-Path $RootWork 'doctor'
          & $env:TTS_SMOKE_PYTHON tools/check_tts_weighted_smoke_runner.py `
            --profile-id $env:TTS_SMOKE_PROFILE_ID_INPUT `
            --model-root $env:TTS_SMOKE_MODEL_ROOT `
            --reference-wav $env:TTS_SMOKE_REFERENCE_WAV `
            --work-dir $DoctorWork `
            --expected-python $env:TTS_SMOKE_PYTHON
          if ($LASTEXITCODE -ne 0) {
            throw 'Trusted weighted TTS runner doctor failed.'
          }
          "TTS_SMOKE_ROOT_WORK=$RootWork" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TTS_SMOKE_DOCTOR_WORK=$DoctorWork" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real weighted synthesis
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TTS_SMOKE_ROOT_WORK)) {
            throw 'Runner doctor did not publish its work root.'
          }
          $Work = Join-Path $env:TTS_SMOKE_ROOT_WORK 'smoke'
          & $env:TTS_SMOKE_PYTHON tools/run_tts_weighted_smoke.py `
            --profile-id $env:TTS_SMOKE_PROFILE_ID_INPUT `
            --model-root $env:TTS_SMOKE_MODEL_ROOT `
            --reference-wav $env:TTS_SMOKE_REFERENCE_WAV `
            --work-dir $Work `
            --expected-python $env:TTS_SMOKE_PYTHON `
            --duration-budget $env:TTS_SMOKE_DURATION_INPUT
          if ($LASTEXITCODE -ne 0) {
            throw 'Real weighted TTS smoke failed.'
          }
          "TTS_SMOKE_WORK=$Work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build privacy-safe attestation
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TTS_SMOKE_DOCTOR_WORK) -or [string]::IsNullOrWhiteSpace($env:TTS_SMOKE_WORK)) {
            throw 'Doctor or synthesis work root is missing before attestation.'
          }
          $DoctorPath = Join-Path $env:TTS_SMOKE_DOCTOR_WORK 'report.json'
          $ReportPath = Join-Path $env:TTS_SMOKE_WORK 'report.json'
          $AttestationDir = Join-Path $env:GITHUB_WORKSPACE 'tts-weighted-smoke-attestation'
          if (Test-Path -LiteralPath $AttestationDir) {
            Remove-Item -LiteralPath $AttestationDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $AttestationDir | Out-Null
          $AttestationPath = Join-Path $AttestationDir 'attestation.json'
          & $env:TTS_SMOKE_PYTHON tools/build_tts_weighted_smoke_attestation.py `
            --doctor-report $DoctorPath `
            --smoke-report $ReportPath `
            --output $AttestationPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Weighted TTS attestation build failed.'
          }
          if (-not (Test-Path -LiteralPath $AttestationPath -PathType Leaf)) {
            throw 'Weighted TTS attestation was not created.'
          }
          "TTS_SMOKE_ATTESTATION=$AttestationPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload weighted smoke attestation
        uses: actions/upload-artifact@v4
        with:
          name: tts-weighted-smoke-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: tts-weighted-smoke-attestation/attestation.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Publish sanitized summary
        shell: pwsh
        run: |
          $DoctorPath = Join-Path $env:TTS_SMOKE_DOCTOR_WORK 'report.json'
          $ReportPath = Join-Path $env:TTS_SMOKE_WORK 'report.json'
          if (-not (Test-Path -LiteralPath $DoctorPath -PathType Leaf)) {
            throw 'Sanitized runner doctor report is missing.'
          }
          if (-not (Test-Path -LiteralPath $ReportPath -PathType Leaf)) {
            throw 'Sanitized weighted smoke report is missing.'
          }
          if (-not (Test-Path -LiteralPath $env:TTS_SMOKE_ATTESTATION -PathType Leaf)) {
            throw 'Sanitized weighted smoke attestation is missing.'
          }
          $Doctor = Get-Content -LiteralPath $DoctorPath -Raw -Encoding utf8 | ConvertFrom-Json
          $Report = Get-Content -LiteralPath $ReportPath -Raw -Encoding utf8 | ConvertFrom-Json
          $Attestation = Get-Content -LiteralPath $env:TTS_SMOKE_ATTESTATION -Raw -Encoding utf8 | ConvertFrom-Json
          if ($Doctor.passed -ne $true -or $Report.passed -ne $true -or $Attestation.result.passed -ne $true) {
            throw 'Runner doctor, weighted smoke or attestation did not pass.'
          }
          if ($Attestation.subject.commit_sha -ne $env:GITHUB_SHA) {
            throw 'Weighted smoke attestation is bound to a different commit.'
          }
          @"
          ## TTS Weighted Smoke

          - Commit: ``$($Attestation.subject.commit_sha)``
          - Run: ``$($Attestation.subject.run_id).$($Attestation.subject.run_attempt)``
          - Profile: ``$($Report.profile.profile_id)``
          - Revision: ``$($Report.profile.model_revision)``
          - Backend: ``$($Report.backend.backend_id)``
          - Runner doctor: passed; weights loaded: $($Doctor.runtime.weights_loaded)
          - Runtime modules: $($Doctor.imports.modules.Count)
          - ffprobe: ``$($Doctor.ffprobe.version)``
          - Atomic storage probe: $($Doctor.storage.replace)
          - Model config SHA-256: ``$($Report.model.config_sha256)``
          - Output: $($Report.output.pcm.duration_seconds) s, $($Report.output.pcm.sample_rate) Hz, mono PCM-24
          - Execution evidence: $($Report.execution_plan.present)
          - Audio retained: $($Report.output.audio_retained)
          - Attestation SHA-256: ``$($Attestation.digest_sha256)``
          - Attestation retention: 90 days
          - Policy: ``$($Attestation.policy)``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Remove smoke data
        if: always()
        shell: pwsh
        run: |
          $RootWork = $env:TTS_SMOKE_ROOT_WORK
          if ([string]::IsNullOrWhiteSpace($RootWork)) {
            $RootWork = Join-Path $env:RUNNER_TEMP "tts-weighted-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          }
          if (Test-Path -LiteralPath $RootWork) {
            Remove-Item -LiteralPath $RootWork -Recurse -Force
          }
          $AttestationDir = Join-Path $env:GITHUB_WORKSPACE 'tts-weighted-smoke-attestation'
          if (Test-Path -LiteralPath $AttestationDir) {
            Remove-Item -LiteralPath $AttestationDir -Recurse -Force
          }
