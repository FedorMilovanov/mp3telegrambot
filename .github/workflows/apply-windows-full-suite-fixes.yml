name: Apply Windows full-suite fixes

on:
  push:
    branches:
      - agent/windows-full-suite-fixes-20260803
    paths:
      - ".github/scripts/apply_windows_full_suite_fixes.py"
      - ".github/workflows/apply-windows-full-suite-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/windows-full-suite-fixes-20260803
          fetch-depth: 0

      - name: Apply exact source patches
        run: python .github/scripts/apply_windows_full_suite_fixes.py

      - name: Remove one-time patch machinery
        run: |
          rm .github/scripts/apply_windows_full_suite_fixes.py
          rm .github/workflows/apply-windows-full-suite-fixes.yml

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Fix Windows full-suite regressions"
          git push origin HEAD:agent/windows-full-suite-fixes-20260803
