name: Dub Studio Checks

on:
  push:
    paths:
      - 'config/tts_models/*.json'
      - 'handlers/dub_*.py'
      - 'handlers/dub_*/**/*.py'
      - 'handlers/mode_command.py'
      - 'handlers/commands.py'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-lock.txt'
      - 'services/dub_*.py'
      - 'services/dub_*/**/*.py'
      - 'services/speech_backends/**/*.py'
      - 'services/tts_profile_selection.py'
      - 'services/operator_runtime_status.py'
      - 'services/restart_state_runtime.py'
      - 'tools/check_tts_model_catalog.py'
      - 'tools/voxcpm2/*.py'
      - 'tools/voxcpm2/recipes/*.json'
      - 'tests/test_clean_*.py'
      - 'tests/test_dub*.py'
      - 'tests/test_generic_*.py'
      - 'tests/test_semantic_*.py'
      - 'tests/test_speech_backend_*.py'
      - 'tests/test_speech_model_*.py'
      - 'tests/test_tts_*.py'
      - 'tests/test_voxcpm2_*.py'
      - 'tests/test_operator_runtime_status.py'
      - 'tests/test_restart_state_runtime.py'
      - '.github/workflows/dub-studio-checks.yml'
  pull_request:
    paths:
      - 'config/tts_models/*.json'
      - 'handlers/dub_*.py'
      - 'handlers/dub_*/**/*.py'
      - 'handlers/mode_command.py'
      - 'handlers/commands.py'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-lock.txt'
      - 'services/dub_*.py'
      - 'services/dub_*/**/*.py'
      - 'services/speech_backends/**/*.py'
      - 'services/tts_profile_selection.py'
      - 'services/operator_runtime_status.py'
      - 'services/restart_state_runtime.py'
      - 'tools/check_tts_model_catalog.py'
      - 'tools/voxcpm2/*.py'
      - 'tools/voxcpm2/recipes/*.json'
      - 'tests/test_clean_*.py'
      - 'tests/test_dub*.py'
      - 'tests/test_generic_*.py'
      - 'tests/test_semantic_*.py'
      - 'tests/test_speech_backend_*.py'
      - 'tests/test_speech_model_*.py'
      - 'tests/test_tts_*.py'
      - 'tests/test_voxcpm2_*.py'
      - 'tests/test_operator_runtime_status.py'
      - 'tests/test_restart_state_runtime.py'
      - '.github/workflows/dub-studio-checks.yml'

concurrency:
  group: dub-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-dub-studio:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_requirements_lock.py
      - name: Validate TTS model catalog
        run: python tools/check_tts_model_catalog.py
      - name: Compile production surface dynamically
        shell: pwsh
        run: |
          python -m compileall -q services/speech_backends services/tts_profile_selection.py services/operator_runtime_status.py services/restart_state_runtime.py services/dub_execution.py services/dub_worker.py services/dub_studio.py services/dub_studio_runtime.py handlers/dub_health handlers/dub_wizard.py handlers/dub_wizard handlers/dub_commands.py handlers/dub_delivery.py tools/voxcpm2
          python -m py_compile tools/check_tts_model_catalog.py
          if ($LASTEXITCODE -ne 0) {
            throw "Dub Studio production compile failed."
          }
          python -m json.tool tools/voxcpm2/recipes/generic_short_v1.json | Out-Null
      - name: Validate recipe actions
        shell: pwsh
        run: |
          @'
          from services.dub_worker import build_command

          expected = {
              'render': 'tools.voxcpm2.generic_gemini_runtime',
              'render_gemini': 'tools.voxcpm2.generic_gemini_runtime',
              'render_direct': 'tools.voxcpm2.generic_direct_runtime',
              'repair_audio': 'tools.voxcpm2.generic_clean_audio_repair_runtime',
              'prepare_custom': 'tools.voxcpm2.generic_custom_runtime',
              'render_custom': 'tools.voxcpm2.generic_custom_runtime',
          }
          for action, module in expected.items():
              command, spec = build_command('generic_short_v1', action)
              assert spec['runner'] == 'python_module'
              assert spec['module'] == module
              assert command[1:3] == ['-m', module]
          gemini, _ = build_command('generic_short_v1', 'render_gemini')
          direct, _ = build_command('generic_short_v1', 'render_direct')
          repair, _ = build_command('generic_short_v1', 'repair_audio')
          assert '-Mode gemini' in ' '.join(gemini)
          assert '-Mode direct' in ' '.join(direct)
          assert '-Mode' not in repair
          print('Source-owned recipe action routing: OK')
          '@ | python -
      - name: Focused regression tests
        run: >-
          python -m pytest -q
          tests/test_operator_runtime_status.py
          tests/test_restart_state_runtime.py
          tests/test_dub_execution.py
          tests/test_dub_worker.py
          tests/test_dub_architecture_boundaries.py
          tests/test_clean_dub_production.py
          tests/test_clean_dub_health_contract.py
          tests/test_clean_request_settings.py
          tests/test_clean_runtime_contract.py
          tests/test_clean_runtime_setting_types.py
          tests/test_clean_repair_request_contract.py
          tests/test_dub_health_supplemental_contract.py
          tests/test_dub_quality_v42_runtime_contracts.py
          tests/test_generic_project_runtime_contract.py
          tests/test_speech_backend_command_contract.py
          tests/test_speech_backend_control_plane.py
          tests/test_speech_backend_generation_length_plan.py
          tests/test_speech_backend_generation_profile_plan.py
          tests/test_speech_backend_model_profile_contract.py
          tests/test_speech_backend_registry.py
          tests/test_speech_backend_request_boundary.py
          tests/test_speech_backend_runtime_paths.py
          tests/test_speech_model_profile_manifests.py
          tests/test_speech_model_profiles.py
          tests/test_tts_profile_selection.py
          tests/test_voxcpm2_typed_generation_contract.py
          tests/test_voxcpm2_typed_session_contract.py
          tests/test_semantic_block_runtime.py
          tests/test_final_media_qa.py
          tests/test_dub_wizard.py
          tests/test_dub_wizard_request_writer.py
      - name: Ruff configured Dub Studio checks
        run: >-
          python -m ruff check
          services/operator_runtime_status.py
          services/restart_state_runtime.py
          services/speech_backends
          services/tts_profile_selection.py
          services/dub_execution.py
          services/dub_worker.py
          services/dub_studio.py
          services/dub_studio_runtime.py
          handlers/dub_health
          handlers/dub_wizard.py
          handlers/dub_wizard
          handlers/dub_commands.py
          handlers/dub_delivery.py
          tools/check_tts_model_catalog.py
          tools/voxcpm2
          tests/test_operator_runtime_status.py
          tests/test_restart_state_runtime.py
          tests/test_dub_execution.py
          tests/test_dub_worker.py
          tests/test_dub_architecture_boundaries.py
          tests/test_clean_dub_production.py
          tests/test_clean_dub_health_contract.py
          tests/test_clean_request_settings.py
          tests/test_clean_runtime_contract.py
          tests/test_clean_runtime_setting_types.py
          tests/test_clean_repair_request_contract.py
          tests/test_dub_health_supplemental_contract.py
          tests/test_dub_quality_v42_runtime_contracts.py
          tests/test_generic_project_runtime_contract.py
          tests/test_speech_backend_command_contract.py
          tests/test_speech_backend_control_plane.py
          tests/test_speech_backend_generation_length_plan.py
          tests/test_speech_backend_generation_profile_plan.py
          tests/test_speech_backend_model_profile_contract.py
          tests/test_speech_backend_registry.py
          tests/test_speech_backend_request_boundary.py
          tests/test_speech_backend_runtime_paths.py
          tests/test_speech_model_profile_manifests.py
          tests/test_speech_model_profiles.py
          tests/test_tts_profile_selection.py
          tests/test_voxcpm2_typed_generation_contract.py
          tests/test_voxcpm2_typed_session_contract.py
          tests/test_dub_wizard.py
          tests/test_dub_wizard_request_writer.py
      - name: Whitespace integrity
        run: git diff --check
