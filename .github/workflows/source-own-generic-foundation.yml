name: Source-own Generic Foundation

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .source-own-generic-foundation-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-own generic short/project foundation
        run: python tools/source_own_generic_foundation.py
      - name: Compile production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines main.py bot_new.py
      - name: Import smoke canonical generic owners
        run: |
          python - <<'PY'
          from tools.voxcpm2 import generic_short_production as short
          from tools.voxcpm2 import generic_project_runtime as project
          from tools.voxcpm2 import clean_source_download
          assert callable(short.gemini_json)
          assert callable(short.download_source)
          assert callable(short.download_captions)
          assert callable(short.standardize_russian_title)
          assert callable(project.main)
          assert callable(clean_source_download.download_source)
          PY
      - name: Verify no adapter-layer refs
        shell: bash
        run: |
          set -euo pipefail
          test ! -f tools/voxcpm2/generic_short_runtime.py
          ! grep -RIn --include='*.py' --exclude-dir=tests --exclude='source_own_generic_foundation.py' 'generic_short_runtime\|install_runtime_adapters' tools/voxcpm2 services handlers core pipelines
          python tools/remaining_runtime_call_graph.py
      - name: Commit foundation migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Source-own generic Dub foundation"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
