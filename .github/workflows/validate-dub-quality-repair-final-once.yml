name: Validate Dub Quality Repair Final Once
on:
  push:
    paths:
      - '.github/workflows/validate-dub-quality-repair-final-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Final combined Windows gate
        id: gate
        continue-on-error: true
        shell: pwsh
        run: |
          python -m json.tool tools/voxcpm2/recipes/generic_short_v1.json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile tools/voxcpm2/activity_quality.py tools/voxcpm2/dub_quality_v4.py tools/voxcpm2/semantic_tts_guard_v4.py tools/voxcpm2/voxcpm2_quality_v4_renderer.py tools/voxcpm2/master_quality_v4.py tools/voxcpm2/generic_gemini_runtime.py tools/voxcpm2/generic_direct_checked_runtime.py tools/voxcpm2/generic_audio_repair_runtime.py tools/voxcpm2/dub_worker_hardened.py handlers/dub_audio_repair.py handlers/dub_commands.py handlers/dub_health.py handlers/dub_wizard.py services/dub_studio_runtime.py 2>&1 | Tee-Object dub-quality-repair-final.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_dub_quality_v4.py tests/test_dub_audio_repair.py tests/test_dub_audio_repair_integration.py tests/test_generic_project_runtime.py tests/test_generic_direct_runtime.py tests/test_generic_gemini_runtime.py tests/test_semantic_tts_guard.py tests/test_dub_worker.py tests/test_dub_modes.py tests/test_dub_wizard.py tests/test_dub_delivery.py tests/test_dub_studio.py 2>&1 | Tee-Object -Append dub-quality-repair-final.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          from services.dub_studio import load_recipe
          from tools.voxcpm2.semantic_tts_guard_v4 import _GUARD_VERSION

          recipe = load_recipe("generic_short_v1")
          repair = recipe.action("repair_audio")
          assert repair["module"] == "tools.voxcpm2.generic_audio_repair_runtime"
          assert repair["kind"] == "utility"
          assert _GUARD_VERSION == "semantic-tts-guard-v4.2"
          runtime = Path("services/dub_studio_runtime.py").read_text(encoding="utf-8")
          assert "register_dub_audio_repair_handlers(application)" in runtime
          assert 'action == "repair_audio"' in runtime
          renderer = Path("tools/voxcpm2/voxcpm2_quality_v4_renderer.py").read_text(encoding="utf-8")
          assert 'voxcpm2-quality-v4.2' in renderer
          assert "sustained_activity_index" in renderer
          repair_source = Path("tools/voxcpm2/generic_audio_repair_runtime.py").read_text(encoding="utf-8")
          assert "translate_groups_max" not in repair_source
          assert '"gemini_called": False' in repair_source
          '@ | python - 2>&1 | Tee-Object -Append dub-quality-repair-final.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check tools/voxcpm2/activity_quality.py tools/voxcpm2/dub_quality_v4.py tools/voxcpm2/semantic_tts_guard_v4.py tools/voxcpm2/voxcpm2_quality_v4_renderer.py tools/voxcpm2/master_quality_v4.py tools/voxcpm2/generic_gemini_runtime.py tools/voxcpm2/generic_direct_checked_runtime.py tools/voxcpm2/generic_audio_repair_runtime.py handlers/dub_audio_repair.py handlers/dub_commands.py handlers/dub_health.py services/dub_studio_runtime.py tests/test_dub_quality_v4.py tests/test_dub_audio_repair.py tests/test_dub_audio_repair_integration.py 2>&1 | Tee-Object -Append dub-quality-repair-final.log
          exit $LASTEXITCODE
      - name: Publish result and remove workflow
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Status = if ('${{ steps.gate.outcome }}' -eq 'success') { 'PASS' } else { 'FAIL' }
          Remove-Item .github/workflows/validate-dub-quality-repair-final-once.yml -Force
          $Lines = @('# Dub Studio Quality v4.2 + audio repair final gate','',"- Result: **$Status**",'- Quality timing/noise QA, Gemini MAX, ready SRT, worker and audio-only repair.',"- Compile/tests/contracts/Ruff: ${{ steps.gate.outcome }}",'- Physical VoxCPM2 model render remains local-only.')
          if ($Status -eq 'FAIL' -and (Test-Path dub-quality-repair-final.log)) { $Lines += ''; $Lines += (Get-Content dub-quality-repair-final.log -Tail 240) }
          $Lines | Set-Content docs/dub_studio_quality_repair_final_gate.md -Encoding utf8
          git add -A
          git commit -m "Record final Dub Studio Quality v4.2 repair gate: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
