name: Prune Dead VoxCPM Runtime

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .prune-dead-voxcpm-runtime-trigger

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prune proven-dead runtime cluster
        run: python tools/prune_dead_voxcpm_runtime_cluster.py
      - name: Compile production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines main.py bot_new.py
      - name: Verify removed roots are gone
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            tools/voxcpm2/generic_audio_repair_runtime_v45.py \
            tools/voxcpm2/generic_direct_checked_runtime_v45.py \
            tools/voxcpm2/generic_gemini_runtime_v45.py \
            tools/voxcpm2/generic_audio_repair_runtime_bootstrap.py \
            tools/voxcpm2/semantic_tts_guard_v47.py \
            tools/voxcpm2/voxcpm2_semantic_rescue_v47.py \
            tools/voxcpm2/monolithic_runtime_install.py; do
            test ! -e "$f"
          done
          python tools/remaining_runtime_call_graph.py
      - name: Commit prune
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove dead VoxCPM runtime installer cluster"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
