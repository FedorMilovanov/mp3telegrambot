name: Final Surgery Commit

on:
  push:
    branches: [agent/zero-runtime-surgery-marathon]
    paths: [.final-surgery-commit-trigger]

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch migration proof ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/source_own_final_voxcpm_surgery.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('DEAD = (\n    VOX / "examples/john_piper_z20py4yqhyq/voxcpm2_cpu_semantic_wrapper.py",','DEAD = (\n    VOX / "examples/john_piper_z20py4yqhyq/voxcpm2_cpu_semantic_wrapper.py",\n    VOX / "voxcpm2_cpu_semantic_wrapper.py",',1)
          old='''    # Prove compatibility-only files have no production consumers.\n    for path in DEAD:\n        if not path.is_file():\n            raise RuntimeError(f"dead compatibility input missing: {path}")\n        refs = _production_refs(path.stem, set(DEAD))\n        if refs:\n            raise RuntimeError(f"{path.name} still referenced: {refs}")\n\n'''
          t=t.replace(old,'',1)
          anchor='    text = remove_function(text, guard, "install")\n'
          extra='    text = remove_function(text, guard, "_run_guarded_synth")\n    text = remove_function(text, guard, "_is_voxcpm_synth")\n    text = text.replace(\'_WRAPPER_NAME = "voxcpm2_cpu_semantic_wrapper.py"\\n\', \'\')\n'
          if extra not in t: t=t.replace(anchor,anchor+extra,1)
          needle='''            rel = path.relative_to(ROOT).as_posix()\n            if rel.startswith(("tools/source_own_", "tools/refactor_", "tools/prune_", "tools/runtime_", "tools/classify_", "tools/flatten_", "tools/rewrite_")):\n'''
          repl='''            rel = path.relative_to(ROOT).as_posix()\n            if rel == "services/dub_release_health_v64.py":\n                continue\n            if rel.startswith(("tools/source_own_", "tools/refactor_", "tools/prune_", "tools/runtime_", "tools/classify_", "tools/flatten_", "tools/rewrite_")):\n'''
          if needle not in t: raise SystemExit('reference scan anchor missing')
          t=t.replace(needle,repl,1)
          delete_anchor='''    # Delete proven-dead compatibility modules and remove them from fingerprints if present.\n    contract=CONTRACT.read_text(encoding="utf-8")\n'''
          proof='''    for path in DEAD:\n        if not path.is_file():\n            raise RuntimeError(f"dead compatibility input missing: {path}")\n        refs = _production_refs(path.stem, set(DEAD))\n        if refs:\n            raise RuntimeError(f"{path.name} still referenced after guard cleanup: {refs}")\n\n'''
          if proof not in t: t=t.replace(delete_anchor,proof+delete_anchor,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Apply source ownership
        run: python tools/source_own_final_voxcpm_surgery.py
      - name: Compile and root gate
        run: |
          python -m compileall -q tools/voxcpm2 services handlers core pipelines main.py bot_new.py
          python tools/remaining_runtime_call_graph.py | tee /tmp/root.txt
          grep -q '^ROOT_CALLS=0$' /tmp/root.txt
          python tools/voxcpm_collision_audit.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove final VoxCPM runtime surgery"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
