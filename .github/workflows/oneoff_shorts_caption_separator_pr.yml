name: One-off Shorts Caption Separator PR Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/shorts-caption-separator-contract-20260802' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shorts-caption-separator-contract-20260802
          fetch-depth: 0
      - name: Apply focused patch
        run: python tools/oneoff_patch_shorts_caption.py
      - name: Validate source shape
        run: |
          git diff --check
          python -m py_compile services/shorts_video.py core/prompts.py tests/test_shorts_caption_separator_contract.py
      - name: Commit focused changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/shorts_video.py core/prompts.py tests/test_shorts_caption_separator_contract.py
          git commit -m "Enforce Shorts title and author separator contract"
          git push origin HEAD:agent/shorts-caption-separator-contract-20260802
