name: Diagnose Unified Menu Once

on:
  push:
    paths:
      - '.github/workflows/diagnose-unified-menu-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        id: deps
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt 2>&1 | Tee-Object menu-deps.log
          exit $LASTEXITCODE

      - name: Compile
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          python -m py_compile handlers/mode_command.py handlers/commands.py handlers/dub_wizard.py handlers/dub_commands.py handlers/dub_health.py handlers/dub_delivery.py main.py services/dub_studio.py services/dub_studio_runtime.py tools/voxcpm2/dub_worker.py tools/voxcpm2/dub_worker_hardened.py tools/voxcpm2/generic_short_runtime.py tools/voxcpm2/generic_gemini_runtime.py tools/voxcpm2/generic_direct_checked_runtime.py tools/voxcpm2/semantic_tts_guard.py tools/voxcpm2/voxcpm2_cpu_semantic_wrapper.py 2>&1 | Tee-Object menu-compile.log
          exit $LASTEXITCODE

      - name: Navigation tests
        id: navtests
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest -q tests/test_mode_navigation.py 2>&1 | Tee-Object menu-navtests.log
          exit $LASTEXITCODE

      - name: Full focused tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest -q tests/test_mode_navigation.py tests/test_dub_modes.py tests/test_dub_wizard.py tests/test_dub_delivery.py tests/test_dub_studio.py tests/test_dub_worker.py tests/test_generic_project_runtime.py tests/test_generic_direct_runtime.py tests/test_generic_gemini_runtime.py tests/test_semantic_tts_guard.py 2>&1 | Tee-Object menu-tests.log
          exit $LASTEXITCODE

      - name: Exact contracts
        id: contracts
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from types import SimpleNamespace
          from handlers.mode_command import _clear_dub_wizard_state, _mode_home_keyboard

          callbacks = [b.callback_data for row in _mode_home_keyboard('rus', is_admin=True).inline_keyboard for b in row if b.callback_data]
          assert callbacks == ['mode_menu:analysis','dubwiz|mode|gemini','dubwiz|mode|direct','dubwiz|projects|list','mode_menu:dubcheck']
          state = SimpleNamespace(user_data={'dub_universal_wizard': {'awaiting':'url'}})
          assert _clear_dub_wizard_state(state) and not state.user_data
          main = Path('main.py').read_text(encoding='utf-8')
          mode_route = 'handle_mode_callback, pattern=r"^(?:set_mode:|mode_menu:)"'
          global_route = 'CallbackQueryHandler(handle_callback)'
          assert main.index(mode_route) < main.index(global_route)
          commands = Path('handlers/commands.py').read_text(encoding='utf-8')
          assert commands.count('/mode — все режимы обработки и дубляжа') == 1
          assert '/dub — дубляж: Gemini MAX или готовый SRT' not in commands
          print('Exact navigation contracts: OK')
          '@ | python - 2>&1 | Tee-Object menu-contracts.log
          exit $LASTEXITCODE

      - name: Ruff
        id: ruff
        continue-on-error: true
        shell: pwsh
        run: |
          python -m ruff check handlers/mode_command.py handlers/dub_wizard.py handlers/dub_commands.py handlers/dub_health.py handlers/dub_delivery.py services/dub_studio_runtime.py tools/voxcpm2/dub_worker_hardened.py tests/test_mode_navigation.py tests/test_dub_modes.py tests/test_dub_worker.py 2>&1 | Tee-Object menu-ruff.log
          exit $LASTEXITCODE

      - name: Publish diagnosis and cleanup
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Passed = ('${{ steps.deps.outcome }}' -eq 'success' -and '${{ steps.compile.outcome }}' -eq 'success' -and '${{ steps.navtests.outcome }}' -eq 'success' -and '${{ steps.tests.outcome }}' -eq 'success' -and '${{ steps.contracts.outcome }}' -eq 'success' -and '${{ steps.ruff.outcome }}' -eq 'success')
          $Status = if ($Passed) { 'PASS' } else { 'FAIL' }
          $Lines = @(
            '# Unified MODE menu diagnostic',
            '',
            "- Result: **$Status**",
            '- Source: ${{ github.sha }}',
            '- Dependencies: ${{ steps.deps.outcome }}',
            '- Compile: ${{ steps.compile.outcome }}',
            '- Navigation tests: ${{ steps.navtests.outcome }}',
            '- Full focused tests: ${{ steps.tests.outcome }}',
            '- Exact contracts: ${{ steps.contracts.outcome }}',
            '- Ruff: ${{ steps.ruff.outcome }}'
          )
          if (-not $Passed) {
            foreach ($Name in @('menu-compile.log','menu-navtests.log','menu-tests.log','menu-contracts.log','menu-ruff.log')) {
              if (Test-Path $Name) {
                $Lines += ''
                $Lines += "## $Name"
                $Lines += ''
                $Lines += (Get-Content $Name -Tail 120)
              }
            }
          }
          $Lines | Set-Content docs/unified_mode_menu_validation_latest.md -Encoding utf8
          Remove-Item .github/workflows/diagnose-unified-menu-once.yml -Force
          git add docs/unified_mode_menu_validation_latest.md .github/workflows/diagnose-unified-menu-once.yml
          git commit -m "Record unified MODE menu diagnostic: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
