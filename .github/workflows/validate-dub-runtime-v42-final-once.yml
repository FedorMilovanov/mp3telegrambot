name: Validate Dub Runtime V42 Final Once
on:
  push:
    paths:
      - '.github/workflows/validate-dub-runtime-v42-final-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DUB_STUDIO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile, test and lint
        id: gate
        continue-on-error: true
        shell: pwsh
        run: |
          python -m py_compile handlers/dub_health.py handlers/dub_audio_repair.py services/dub_studio_runtime.py tools/voxcpm2/dub_worker_hardened.py tools/voxcpm2/generic_audio_repair_runtime.py tests/test_dub_quality_v42_runtime_contracts.py 2>&1 | Tee-Object dub-runtime-v42-final.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_dub_quality_v42_runtime_contracts.py tests/test_dub_quality_v4.py tests/test_dub_audio_repair.py tests/test_dub_audio_repair_integration.py tests/test_dub_modes.py tests/test_dub_worker.py 2>&1 | Tee-Object -Append dub-runtime-v42-final.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check handlers/dub_health.py handlers/dub_audio_repair.py services/dub_studio_runtime.py tools/voxcpm2/dub_worker_hardened.py tools/voxcpm2/generic_audio_repair_runtime.py tests/test_dub_quality_v42_runtime_contracts.py 2>&1 | Tee-Object -Append dub-runtime-v42-final.log
          exit $LASTEXITCODE
      - name: Record result and remove one-shot workflow
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Status = if ('${{ steps.gate.outcome }}' -eq 'success') { 'PASS' } else { 'FAIL' }
          Remove-Item .github/workflows/validate-dub-runtime-v42-final-once.yml -Force
          $Lines = @('# Dub Studio runtime v4.2 final validation','',"- Result: **$Status**",'- Worker replacement, dubcheck 14/14 contracts and audio-only repair.',"- Compile/tests/Ruff: ${{ steps.gate.outcome }}")
          if ($Status -eq 'FAIL' -and (Test-Path dub-runtime-v42-final.log)) { $Lines += ''; $Lines += (Get-Content dub-runtime-v42-final.log -Tail 220) }
          $Lines | Set-Content docs/dub_studio_runtime_v42_final_validation.md -Encoding utf8
          git add -A
          git commit -m "Record Dub Studio runtime v4.2 final validation: $Status"
          git pull --rebase origin main
          git push origin HEAD:main
