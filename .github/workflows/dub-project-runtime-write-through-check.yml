name: Dub Project Runtime Write-Through

on:
  push:
    branches: [main]
    paths:
      - "tools/voxcpm2/generic_project_runtime.py"
      - "tools/voxcpm2/generic_gemini_runtime.py"
      - "tools/voxcpm2/generic_custom_runtime.py"
      - "handlers/dub_wizard.py"
      - "tests/test_generic_project_runtime_contract.py"
      - "tests/test_dub_wizard_request_writer.py"
      - ".github/workflows/dub-project-runtime-write-through-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/voxcpm2/generic_project_runtime.py"
      - "tools/voxcpm2/generic_gemini_runtime.py"
      - "tools/voxcpm2/generic_custom_runtime.py"
      - "handlers/dub_wizard.py"
      - "tests/test_generic_project_runtime_contract.py"
      - "tests/test_dub_wizard_request_writer.py"
      - ".github/workflows/dub-project-runtime-write-through-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_requirements_lock.py

      - name: Validate installed runtime dependency closure
        run: >-
          python -c "from pathlib import Path; from services.runtime_dependency_lock import validate_runtime_dependency_lock; print(validate_runtime_dependency_lock(Path('.')))"

      - name: Compile source-owned project runtime and wizard
        run: |
          python -m py_compile \
            tools/voxcpm2/generic_project_runtime.py \
            tools/voxcpm2/generic_gemini_runtime.py \
            tools/voxcpm2/generic_custom_runtime.py \
            handlers/dub_wizard.py

      - name: Run project runtime and request barrier contracts
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python tools/run_pytest_with_annotations.py -q \
            tests/test_generic_project_runtime_contract.py \
            tests/test_dub_wizard_request_writer.py
