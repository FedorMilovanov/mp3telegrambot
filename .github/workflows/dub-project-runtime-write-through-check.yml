name: Dub Project Runtime Write-Through

on:
  push:
    branches: [main]
    paths:
      - "tools/voxcpm2/generic_project_runtime.py"
      - "tools/voxcpm2/generic_project_runtime/**"
      - "tools/voxcpm2/generic_clean_gemini_runtime.py"
      - "tools/voxcpm2/generic_clean_custom_runtime.py"
      - "handlers/dub_wizard.py"
      - "handlers/dub_wizard/**"
      - "tests/test_generic_project_runtime_contract.py"
      - "tests/test_generic_project_runtime_write_through.py"
      - "tests/test_dub_wizard_request_writer.py"
      - ".github/workflows/dub-project-runtime-write-through-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: >-
          python -m pip install --upgrade pytest numpy soundfile
          "python-telegram-bot>=22.5,<23.0"
          "flask>=3.0,<4.0"
          "python-dotenv>=1.0,<2.0"
      - name: Compile project runtime and wizard facades
        run: |
          python -m py_compile \
            tools/voxcpm2/generic_project_runtime.py \
            tools/voxcpm2/generic_project_runtime/__init__.py \
            tools/voxcpm2/generic_clean_gemini_runtime.py \
            tools/voxcpm2/generic_clean_custom_runtime.py \
            handlers/dub_wizard.py \
            handlers/dub_wizard/__init__.py
      - name: Run write-through and request barrier contracts
        run: |
          pytest -q \
            tests/test_generic_project_runtime_contract.py \
            tests/test_generic_project_runtime_write_through.py \
            tests/test_dub_wizard_request_writer.py
