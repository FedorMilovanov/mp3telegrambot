name: Final Gemini policy documentation cleanup

on:
  push:
    branches:
      - agent/gemini-37-quality-routing
    paths:
      - .github/workflows/final-gemini-policy-doc-cleanup.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gemini-37-quality-routing
      - name: Clean final Gemini policy docs and naming
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          db = Path('core/database.py')
          text = db.read_text(encoding='utf-8')
          old = "# ─── Gemini модели (актуализировано 2026-08-03) ─────────────────────────\n# История: до v7 — 2.5-pro/1.5-pro (платные); v7-v8 — 3.1-pro (ПЛАТНАЯ, убрана)\n# Сейчас: gemini-3.7-flash — GA 21.07.2026, основной production-маршрут\n# Сильный fallback: gemini-3.5-flash; механические задачи: gemini-3.5-flash-lite.\n# gemini-3.1-flash-lite не используется проектом и имеет запланированную миграцию.\n# Preview/legacy-модели не используются как production fallback.\n# ВАЖНО: смена GEMINI_MODEL автоматически инвалидирует кэш (model_mismatch в database.py)\n"
          new = "# ─── Gemini deployment policy (2026-08-17) ──────────────────────────────\n# Heavy/semantic production route: gemini-3.7-flash + HIGH.\n# Utility/mechanical route: gemini-3.5-flash-lite only.\n# Semantic downgrade to 3.6/3.5/Lite is intentionally disabled; temporary\n# capacity failures are handled by bounded retries and configured API-key/client rotation.\n# ВАЖНО: смена GEMINI_MODEL автоматически инвалидирует кэш (model_mismatch в database.py)\n"
          if text.count(old) != 1:
              raise SystemExit('database Gemini comment block not found exactly once')
          db.write_text(text.replace(old, new, 1), encoding='utf-8')

          qa = Path('services/gemini_qa_policy.py')
          text = qa.read_text(encoding='utf-8')
          old_name = '_STRONG_FALLBACK_MODEL = "gemini-3.5-flash"'
          new_name = '_DISALLOWED_LEGACY_QA_MODEL = "gemini-3.5-flash"'
          if text.count(old_name) != 1:
              raise SystemExit('QA stale model symbol not found exactly once')
          text = text.replace(old_name, new_name, 1)
          old_comment = "    # These are valid fallback/mechanical models, but not the approved primary\n    # for semantic translation QA where false positives can trigger auto-muting.\n    _STRONG_FALLBACK_MODEL,\n"
          new_comment = "    # Lower-tier/stale models are migration inputs only, never QA fallbacks.\n    # False positives here can trigger auto-muting, so they are upgraded to 3.7.\n    _DISALLOWED_LEGACY_QA_MODEL,\n"
          if text.count(old_comment) != 1:
              raise SystemExit('QA stale fallback comment not found exactly once')
          qa.write_text(text.replace(old_comment, new_comment, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = "## Gemini policy\n\nRuntime выбирает модели до импорта AI-клиентов:\n\n- основной quality-маршрут: `gemini-3.6-flash`;\n- сильный fallback: `gemini-3.5-flash`;\n- лёгкие механические задачи: `gemini-3.5-flash-lite`.\n\nРекомендуемая явная настройка:\n\n```dotenv\nGEMINI_LIGHT_MODEL=gemini-3.5-flash-lite\nGEMINI_LIGHT_FALLBACK_MODELS=gemini-3.5-flash\nGEMINI_LIGHT_ALLOW_MAIN_FALLBACK=1\n```\n\nСтарое значение `GEMINI_LIGHT_MODEL=gemini-3.1-flash-lite` поддерживается только как миграционный вход: startup-policy автоматически заменяет его на актуальную модель. Не используйте 3.1 Lite в новой конфигурации.\n"
          new = "## Gemini policy\n\nRuntime фиксирует quality-policy до импорта AI-клиентов:\n\n- все heavy/semantic задачи: `gemini-3.7-flash` + `HIGH` thinking;\n- Shorts Factory MAX, LiveDub QA, публикационный смысловой текст и editorial review не понижаются до 3.6/3.5/Lite;\n- дешёвые механические/utility-задачи: только `gemini-3.5-flash-lite` + minimal;\n- при временной перегрузке используются bounded retry и следующие настроенные API-ключи/клиенты, а не более слабая модель.\n\nРекомендуемая явная настройка:\n\n```dotenv\nGEMINI_MODEL=gemini-3.7-flash\nGEMINI_MAX_MODEL=gemini-3.7-flash\nGEMINI_FORCE_THINKING_LEVEL=high\nGEMINI_LIGHT_MODEL=gemini-3.5-flash-lite\nGEMINI_LIGHT_FALLBACK_MODELS=\nGEMINI_LIGHT_ALLOW_MAIN_FALLBACK=0\nSHORTS_FACTORY_MODEL=gemini-3.7-flash\n```\n\nСтарые/слабые значения в QA-контурах поддерживаются только как миграционный вход: startup-policy заменяет их на текущий quality route. Для локального `.env` используйте `scripts/migrate-gemini-37.ps1`.\n"
          if text.count(old) != 1:
              raise SystemExit('README Gemini policy block not found exactly once')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/final-gemini-policy-doc-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md core/database.py services/gemini_qa_policy.py
          git commit -m "Align Gemini documentation with 3.7 quality policy"
          git push origin HEAD:agent/gemini-37-quality-routing
