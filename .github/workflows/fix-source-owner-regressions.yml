name: Fix Source Owner Regressions

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .fix-source-owner-regressions-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Apply safe Ruff consolidation fixes
        run: python -m ruff check . --fix --exit-zero
      - name: Compile repository
        run: python -m compileall -q .
      - name: Verify no-runtime-surgery contract
        run: python -m pytest -q tests/test_no_runtime_surgery_contract.py
      - name: Run full pytest after safe fixes
        run: python tools/run_pytest_with_annotations.py -q
      - name: Show remaining Ruff findings
        run: python -m ruff check . || true
      - name: Commit safe Ruff consolidation fixes
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply v12 safe Ruff consolidation fixes"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
