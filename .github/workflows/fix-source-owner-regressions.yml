name: Fix Source Owner Regressions

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .fix-source-owner-regressions-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Apply v13 canonical workflow manifests
        run: python tools/finalize_workflow_manifests_v13.py
      - name: Compile repository
        run: python -m compileall -q .
      - name: Ruff strict gate
        run: python -m ruff check .
      - name: Verify no-runtime-surgery contract
        run: python -m pytest -q tests/test_no_runtime_surgery_contract.py
      - name: Verify repository health
        run: python tools/verify_repo.py
      - name: Commit v13 workflow manifest cleanup
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply v13 canonical workflow manifest cleanup"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
