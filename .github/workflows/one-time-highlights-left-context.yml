name: One-time Highlights left-context repair

on:
  push:
    branches:
      - agent/highlights-left-context-20260803

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/highlights-left-context-20260803
          fetch-depth: 0
      - name: Apply surgical left-boundary hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          quality_path = Path("services/highlights_quality.py")
          quality = quality_path.read_text(encoding="utf-8")

          old_marker = "r'(?i)^(?:и|а|но|или|потому|поэтому|однако|ведь|тогда|так что|'\n"
          new_marker = "r'(?i)^(?:и|а|но|или|потому|поэтому|однако|ведь|тогда|так что|в смысле|'\n"
          if quality.count(old_marker) != 1:
              raise SystemExit(f"left-context marker contract drifted: {quality.count(old_marker)}")
          quality = quality.replace(old_marker, new_marker, 1)

          old_condition = '        and _needs_left_context(items[first_index]["text"])\n'
          new_condition = (
              '        and (\n'
              '            _needs_left_context(items[first_index]["text"])\n'
              '            or not _ends_cleanly(items[first_index - 1]["text"])\n'
              '        )\n'
          )
          if quality.count(old_condition) != 1:
              raise SystemExit(f"left-boundary condition contract drifted: {quality.count(old_condition)}")
          quality = quality.replace(old_condition, new_condition, 1)
          quality_path.write_text(quality, encoding="utf-8")

          tests_path = Path("tests/test_highlights_quality.py")
          tests = tests_path.read_text(encoding="utf-8")
          sentinel = "def test_refine_recovers_washer_mid_thought_start() -> None:"
          if sentinel in tests:
              raise SystemExit("regression tests already present")
          addition = r'''


def test_refine_recovers_washer_mid_thought_start() -> None:
    fragment = {"start_seconds": 12.0, "end_seconds": 15.5}
    segments = [
        _segment(9.2, 11.4, "Он объясняет напряжение христианской жизни."),
        _segment(11.55, 16.2, "В смысле, вы живёте между двумя мирами."),
    ]

    refined, evidence = refine_fragment_from_transcript(
        fragment,
        segments,
        window_start=8.0,
        window_end=18.0,
    )

    assert refined is not None
    assert refined["transcript"].startswith("Он объясняет")
    assert evidence["reason"] == "accepted"


def test_refine_rejects_washer_mid_thought_start_without_context() -> None:
    fragment = {"start_seconds": 12.0, "end_seconds": 15.5}
    segments = [
        _segment(
            11.5,
            16.2,
            "В смысле, вы живёте между двумя мирами и должны бодрствовать.",
        ),
    ]

    refined, evidence = refine_fragment_from_transcript(
        fragment,
        segments,
        window_start=11.5,
        window_end=18.0,
    )

    assert refined is None
    assert evidence["reason"] == "unresolved_left_context"
'''
          tests_path.write_text(tests.rstrip() + addition + "\n", encoding="utf-8")
          PY
      - name: Parse changed Python
        run: python -m py_compile services/highlights_quality.py tests/test_highlights_quality.py
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git rm -- .github/workflows/one-time-highlights-left-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/highlights_quality.py tests/test_highlights_quality.py
          git commit -m "Harden Highlights left sentence boundary"
          git push origin HEAD:agent/highlights-left-context-20260803
