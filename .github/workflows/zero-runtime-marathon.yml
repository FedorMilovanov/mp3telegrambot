name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  flatten-direct-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Flatten direct CLI snapshot
        run: python tools/flatten_direct_cli_snapshot.py
      - name: Compile direct production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines
      - name: Verify canonical direct CLI
        run: |
          test ! -f tools/voxcpm2/_direct_max_quality_cli_base.py
          ! grep -nE '_direct_max_quality_cli_base|exec\(compile|globals\(\)\["__name__"\]|_ORIGINAL_NAME' tools/voxcpm2/direct_max_quality_cli.py
          grep -q 'def main(' tools/voxcpm2/direct_max_quality_cli.py
          grep -q 'backend.open_session(' tools/voxcpm2/direct_max_quality_cli.py
          grep -q 'session.generate(' tools/voxcpm2/direct_max_quality_cli.py
          ! grep -n '_direct_max_quality_cli_base.py' tools/voxcpm2/direct_surgical_polish_v2.py
      - name: Commit canonical direct CLI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Flatten direct CLI source snapshot"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
