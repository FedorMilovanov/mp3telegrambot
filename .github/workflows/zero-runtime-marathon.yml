name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply wave
        run: |
          set -euo pipefail
          wave="$(cat .zero-runtime-trigger | tr -d '\r\n')"
          python tools/zero_runtime_marathon.py "$wave"

      - name: Compile changed owners
        run: |
          python -m compileall -q \
            services/dub_studio_runtime.py \
            main.py

      - name: Commit wave
        run: |
          set -euo pipefail
          wave="$(cat .zero-runtime-trigger | tr -d '\r\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Zero-runtime marathon: ${wave}"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
