name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  rate-limit-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-own rate-limit async reset
        run: python tools/source_own_rate_limit_reset.py
      - name: Compile affected owners
        run: python -m compileall -q core/database.py main.py
      - name: Verify main does not mutate database internals
        run: |
          grep -q 'def reset_rate_limit_async_state' core/database.py
          grep -q 'reset_rate_limit_async_state()' main.py
          ! grep -nE '_core_db\._rate_limit_async_locks|_core_db\._rate_limit_locks_guard|import core\.database as _core_db' main.py
      - name: Commit source-owned rate reset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Source-own rate-limit async reset"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
