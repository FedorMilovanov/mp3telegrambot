name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  clean-runtime-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-own clean runtime contract
        run: python tools/source_own_clean_runtime_contract.py
      - name: Compile VoxCPM production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines
      - name: Verify canonical runtime contract
        run: |
          test ! -f tools/voxcpm2/_clean_runtime_contract_base.py
          ! grep -nE 'exec\(compile|install_runtime_fingerprint|globals\(\)\[|spec_from_file_location|module_from_spec|/__init__\.py|/__main__\.py' tools/voxcpm2/clean_runtime_contract.py
          grep -q 'def build_fingerprints' tools/voxcpm2/clean_runtime_contract.py
          grep -q 'backend.discover_model' tools/voxcpm2/clean_runtime_contract.py
          grep -q 'BACKEND_SELECTION_POLICY' tools/voxcpm2/clean_runtime_contract.py
      - name: Commit source-owned runtime contract
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Source-own VoxCPM runtime contract"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
