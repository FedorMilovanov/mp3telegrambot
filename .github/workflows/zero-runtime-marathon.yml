name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  dead-release-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove and delete dead release wrappers
        run: python tools/remove_dead_release_wrappers.py
      - name: Compile production tree
        run: python -m compileall -q services tools/voxcpm2 handlers core pipelines main.py bot_new.py
      - name: Verify dead wrappers are gone
        run: |
          test ! -f tools/voxcpm2/master_monolithic_mix.py
          test ! -f tools/voxcpm2/preflight_json_protocol.py
          ! grep -nE 'master_monolithic_mix\.py|preflight_json_protocol\.py' tools/voxcpm2/clean_runtime_contract.py
      - name: Commit dead release cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove dead Dub release wrappers"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
