name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  flatten-direct-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Flatten direct retry snapshot
        run: python tools/flatten_direct_retry_epoch.py
      - name: Compile direct production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines
      - name: Verify canonical retry owner
        run: |
          test ! -f tools/voxcpm2/_direct_retry_epoch_base.py
          ! grep -nE '_direct_retry_epoch_base|exec\(compile|globals\(\)\["__name__"\]|_ORIGINAL_NAME|_required_export|_required_callable' tools/voxcpm2/direct_retry_epoch.py
          grep -q 'BASE_POLICY = POLICY' tools/voxcpm2/direct_retry_epoch.py
          grep -q 'MAX_SCOPE_EPOCH = 3' tools/voxcpm2/direct_retry_epoch.py
      - name: Commit canonical retry owner
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Flatten direct retry epoch source snapshot"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
