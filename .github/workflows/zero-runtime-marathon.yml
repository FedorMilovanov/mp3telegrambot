name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  p0-source-owners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-own P0 service boundaries
        run: python tools/source_own_p0_service_boundaries.py
      - name: Compile affected production tree
        run: python -m compileall -q services/shorts_factory_timing.py pipelines/shorts_factory.py handlers/dub_commands.py handlers/dub_multicommand.py
      - name: Verify no ambient Factory timing or Dub rebind
        run: |
          ! grep -nE 'ContextVar|_CURRENT_TIMELINE|factory_ru_boundary_context' services/shorts_factory_timing.py pipelines/shorts_factory.py
          grep -q 'evidence=ru_boundary_evidence' pipelines/shorts_factory.py
          ! grep -nE 'dub_commands\._safe_edit\s*=|install_stale_card_fallback|_dub_stale_card_fallback' handlers/dub_multicommand.py
          grep -q '_PERMANENT_EDIT_ERRORS' handlers/dub_commands.py
      - name: Commit P0 source owners
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Source-own Factory timing and Dub stale-card fallback"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
