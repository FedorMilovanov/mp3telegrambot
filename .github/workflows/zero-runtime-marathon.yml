name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  local-botapi-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-own Local Bot API process policy
        run: python tools/source_own_local_botapi.py
      - name: Compile Local Bot API owners
        run: python -m compileall -q services/local_botapi_runtime.py services/local_botapi_required.py services/local_botapi_bootstrap.py services/runtime_manifest.py
      - name: Verify explicit process configuration
        run: |
          ! grep -nE '_ACTIVE_PROXY_URL|legacy\._terminate_stale_server\s*=|legacy\._start_local_server\s*=|legacy\._read_log_tail\s*=|global _ACTIVE_PROXY_URL' services/local_botapi_runtime.py services/local_botapi_required.py
          ! grep -n 'def prepare_local_bot_api' services/local_botapi_runtime.py
          grep -q 'def _start_server(host: str, port: int, \*, proxy_url: str = "")' services/local_botapi_runtime.py
          grep -q 'proxy_url=proxy_url' services/local_botapi_required.py
          grep -q '"local-bot-api"' services/runtime_manifest.py
      - name: Commit source-owned Local Bot API
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Source-own Local Bot API process policy"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
