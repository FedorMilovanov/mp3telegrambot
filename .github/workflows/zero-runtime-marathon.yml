name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  preflight-protocol-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-own backend-aware preflight protocol
        run: python tools/source_own_preflight_protocol.py
      - name: Compile production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines main.py
      - name: Verify source-owned protocol
        run: |
          test ! -f tools/voxcpm2/dub_job_preflight/__init__.py
          ! grep -nE 'sys\.modules|spec_from_file_location|module_from_spec|_legacy' tools/voxcpm2/dub_job_preflight.py
          grep -q 'marked-preflight-json-transport-v2' tools/voxcpm2/dub_job_preflight.py
          grep -q 'backend-owned-preflight-runtime-paths-v1' tools/voxcpm2/dub_job_preflight.py
          grep -q 'get_backend' tools/voxcpm2/dub_job_preflight.py
          grep -q '_decode_probe_payload' tools/voxcpm2/dub_job_preflight.py
      - name: Commit source-owned preflight protocol
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Source-own Dub preflight protocol"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
