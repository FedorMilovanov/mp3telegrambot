name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Flatten simple wrappers
        run: python tools/flatten_simple_voxcpm.py
      - name: Compile VoxCPM tree
        run: python -m compileall -q tools/voxcpm2
      - name: Verify no loader survived in flattened owners
        run: |
          for stem in clean_production_core direct_max_quality_render direct_russian_cadence direct_timeline_delivery_qa expressive_continuity final_media_qa generic_clean_audio_repair_runtime; do
            test ! -f "tools/voxcpm2/$stem/__init__.py"
            ! grep -nE 'spec_from_file_location|module_from_spec|sys\.modules|_legacy\.' "tools/voxcpm2/$stem.py"
          done
      - name: Commit flatten
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Flatten VoxCPM source wrapper batch"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
