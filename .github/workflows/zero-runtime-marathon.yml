name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  service-marker-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove mutable function markers
        run: python tools/remove_function_attribute_markers.py
      - name: Compile service owners
        run: python -m compileall -q services/livedub_info.py services/shorts_factory_publication.py
      - name: Verify marker-free services
        run: |
          ! grep -nE '_mp3bot_all_clients|_factory_publication_polish' services/livedub_info.py services/shorts_factory_publication.py
          grep -q '_WRAPPED_CAPTION_BUILDERS' services/shorts_factory_publication.py
      - name: Commit service marker cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove mutable service function markers"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
