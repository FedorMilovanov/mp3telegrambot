name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply wave
        run: |
          set -euo pipefail
          python tools/zero_runtime_marathon.py

      - name: Compile source-owned title surfaces
        run: |
          python -m compileall -q \
            core/media_title_policy.py \
            core/text_utils.py \
            services/dub_studio.py \
            services/dub_studio_runtime.py \
            handlers/dub_delivery.py \
            handlers/dub_health.py \
            services/livedub_output_policy.py \
            services/dub_release_health_v64.py \
            tools/voxcpm2/generic_short_runtime.py \
            tools/voxcpm2/generic_project_runtime.py \
            tools/voxcpm2/_generic_clean_direct_runtime_base.py \
            tools/voxcpm2/generic_clean_custom_runtime.py \
            tools/voxcpm2/generic_clean_direct_runtime.py \
            tools/voxcpm2/generic_clean_gemini_runtime.py \
            tests/test_dub_title_policy.py

      - name: Smoke canonical title policy
        run: |
          python - <<'PY'
          from core.media_title_policy import canonical_media_title, canonical_delivery_filename
          assert canonical_media_title('Сила И Достоинство Благочестивой Женщины - Джон Пайпер') == 'Сила и Достоинство Благочестивой Женщины - Джон Пайпер'
          assert canonical_delivery_filename('Сила И Достоинство - Джон Пайпер — русский дубляж.mp4') == 'Сила и Достоинство - Джон Пайпер — русский дубляж.mp4'
          PY

      - name: Commit wave
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Zero-runtime marathon: source-owned title policy"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
