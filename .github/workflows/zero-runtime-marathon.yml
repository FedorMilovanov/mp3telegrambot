name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  worker-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Move Dub worker hardening into source owners
        run: python tools/refactor_dub_worker_owner.py
      - name: Compile production tree
        run: python -m compileall -q services tools/voxcpm2 handlers core pipelines main.py
      - name: Verify worker has no runtime surgery
        run: |
          test ! -f tools/voxcpm2/dub_worker_hardened/__init__.py
          test ! -f tools/voxcpm2/dub_worker_hardened/__main__.py
          test ! -f tools/voxcpm2/_dub_worker_hardened_base.py
          grep -q 'class WorkerDubStore(DubStore)' services/dub_worker.py
          grep -q 'studio=store.root' services/dub_worker.py
          grep -q 'studio: Path | None = None' tools/voxcpm2/dub_job_preflight.py
          ! grep -nE 'sys\.modules|__class__\s*=|exec\(compile|install_hardening|install_worker_progress' services/dub_worker.py tools/voxcpm2/dub_worker.py tools/voxcpm2/dub_worker_hardened.py
          ! grep -nE 'preflight_json_protocol.*install|install_preflight_json' tools/voxcpm2/dub_worker.py tools/voxcpm2/dub_worker_hardened.py services/dub_worker.py
      - name: Check production worker import path
        run: |
          ! grep -RInE 'from tools\.voxcpm2 import dub_worker as|from tools\.voxcpm2\.dub_worker import' services handlers pipelines core --include='*.py'
      - name: Commit source-owned worker
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Make Dub worker source-owned"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
