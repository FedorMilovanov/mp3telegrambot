name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  direct-timing-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correct additive timing-marker migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/source_own_direct_timing_guard.py')
          text = path.read_text(encoding='utf-8')
          old = '    guard = replace_top_function(guard, GUARD, "load_matching_timing_block", LOAD)\n'
          if old not in text:
              raise SystemExit('expected load_matching replacement line is missing')
          text = text.replace(old, '', 1)
          old_insert = '    guard = guard[:all_index] + "\\n\\n" + EXTRA.strip() + "\\n" + guard[all_index:]\n'
          new_insert = '    guard = guard[:all_index] + "\\n\\n" + EXTRA.strip() + "\\n\\n" + LOAD.strip() + "\\n" + guard[all_index:]\n'
          if old_insert not in text:
              raise SystemExit('expected owner insertion line is missing')
          text = text.replace(old_insert, new_insert, 1)
          old_export = '    guard = guard.replace(\'"POLICY",\', \'"POLICY",\\n    "SURGICAL_GUARD_POLICY",\\n    "RetryableSynthesisFailure",\', 1)\n'
          new_export = '    guard = guard.replace(\'"POLICY",\', \'"POLICY",\\n    "SURGICAL_GUARD_POLICY",\\n    "RetryableSynthesisFailure",\\n    "load_matching_timing_block",\', 1)\n'
          if old_export not in text:
              raise SystemExit('expected export insertion line is missing')
          text = text.replace(old_export, new_export, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Source-own direct timing guard
        run: python tools/source_own_direct_timing_guard.py
      - name: Compile affected production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines
      - name: Verify deleted timing patch layer
        run: |
          test ! -f tools/voxcpm2/direct_surgical_guard.py
          grep -q 'class RetryableSynthesisFailure' tools/voxcpm2/direct_timing_guard.py
          grep -q 'def load_matching_timing_block' tools/voxcpm2/direct_timing_guard.py
          grep -q 'SURGICAL_GUARD_POLICY' tools/voxcpm2/direct_timing_guard.py
          ! grep -RInE 'direct_surgical_guard|install_guard_contract' tools/voxcpm2/direct_max_quality_cli.py tools/voxcpm2/direct_surgical_runtime.py tools/voxcpm2/generic_clean_direct_runtime.py
          ! grep -n 'direct_surgical_guard.py' tools/voxcpm2/clean_runtime_contract.py
      - name: Commit source-owned timing guard
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Source-own direct timing guard"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
