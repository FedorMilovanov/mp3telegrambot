name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: read

jobs:
  refreshed-runtime-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile current production tree
        run: python -m compileall -q services tools/voxcpm2 handlers core pipelines main.py bot_new.py
      - name: Current runtime root calls
        run: python tools/remaining_runtime_call_graph.py
      - name: Current runtime surgery AST audit
        run: python tools/runtime_surgery_audit.py
