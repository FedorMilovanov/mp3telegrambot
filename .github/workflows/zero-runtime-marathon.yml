name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  current-zero-surgery-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile current production tree
        run: python -m compileall -q services tools/voxcpm2 handlers core pipelines main.py bot_new.py
      - name: Persist current zero-surgery status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '===== ROOT CALL GRAPH ====='
            python tools/remaining_runtime_call_graph.py
            echo
            echo '===== AST SURGERY AUDIT ====='
            python tools/runtime_surgery_audit.py
          } > .zero-runtime-status.txt
      - name: Commit audit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .zero-runtime-status.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record current zero-runtime audit status"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
