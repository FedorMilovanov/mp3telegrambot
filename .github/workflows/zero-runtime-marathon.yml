name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply pure-policy cleanup
        run: python tools/pure_policy_cleanup.py
      - name: Compile affected source owners
        run: |
          python -m compileall -q \
            services/shorts_static_policy.py \
            services/ffmpeg.py \
            services/shorts_factory_publication.py \
            services/shorts_factory_video_quality.py
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove unreachable policy installers"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
