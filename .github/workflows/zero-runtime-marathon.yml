name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  final-audit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-own final-audit dependencies
        run: python tools/source_own_final_audit_dependencies.py
      - name: Compile direct production tree
        run: python -m compileall -q tools/voxcpm2 services handlers core pipelines
      - name: Verify dependency ownership
        run: |
          grep -q 'from numbers import Integral' tools/voxcpm2/direct_retry_epoch.py
          grep -q 'not isinstance(value, Integral)' tools/voxcpm2/direct_retry_epoch.py
          grep -q 'def _prune_marker_archives' tools/voxcpm2/direct_timing_guard.py
          grep -q '_prune_marker_archives(path.parent, path.name, limit=8)' tools/voxcpm2/direct_timing_guard.py
          grep -q 'def set_model_discovery_callback' tools/voxcpm2/direct_surgical_io.py
          grep -q 'def discover_model(self, archive_root: Path)' tools/voxcpm2/direct_surgical_io.py
      - name: Commit final-audit dependencies
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Source-own direct final audit dependencies"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
