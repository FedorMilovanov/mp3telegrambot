name: Zero Runtime Marathon

on:
  push:
    branches:
      - agent/zero-runtime-surgery-marathon
    paths:
      - .zero-runtime-trigger

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-runtime-surgery-marathon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Flatten Dub handler shadow packages
        run: python tools/flatten_dub_handlers.py
      - name: Compile handler owners
        run: python -m compileall -q handlers services tools/voxcpm2 main.py
      - name: Verify shadow packages are gone
        run: |
          test ! -f handlers/dub_audio_repair/__init__.py
          test ! -f handlers/dub_wizard/__init__.py
          test ! -f handlers/dub_health/__init__.py
          grep -q 'async def dubfix_command' handlers/dub_audio_repair.py
          grep -q 'rebind_inactive_project_tts_profile' handlers/dub_wizard.py
          grep -q 'WORKER_RUNTIME' handlers/dub_health.py
      - name: Commit flatten
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Flatten Dub handler shadow packages"
          git push origin HEAD:agent/zero-runtime-surgery-marathon
