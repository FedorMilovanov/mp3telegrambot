name: Bgutil Open Fix Matrix Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/bgutil-open-fixes-matrix-audit.yml"
      - ".github/audit/forward_bgutil_pr243.py"
      - ".github/audit/forward_bgutil_pr247.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bgutil-open-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: ["baseline", "forward243", "forward247", "forward243+forward247"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install yt-dlp audit runtime
        run: python -m pip install "yt-dlp[default]==2026.7.4" "yt-dlp-ejs==0.8.0"
      - name: Compose exact provider variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          BASE=a0be2352807e3bd6991f09d2cab685a0ab825b26
          git init provider
          git -C provider config user.email audit@example.invalid
          git -C provider config user.name audit
          git -C provider remote add origin https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          git -C provider fetch --depth 1 origin "$BASE"
          git -C provider checkout --detach FETCH_HEAD
          case "$VARIANT" in
            baseline)
              ;;
            forward243)
              python .github/audit/forward_bgutil_pr243.py
              ;;
            forward247)
              python .github/audit/forward_bgutil_pr247.py
              ;;
            forward243+forward247)
              python .github/audit/forward_bgutil_pr243.py
              python .github/audit/forward_bgutil_pr247.py
              ;;
            *)
              echo "unknown variant: $VARIANT" >&2
              exit 2
              ;;
          esac
          echo "VARIANT=$VARIANT"
          git -C provider diff --check
          git -C provider log --oneline --decorate -4
          test -f provider/plugin/yt_dlp_plugins/extractor/getpot_bgutil.py
      - name: Install, audit, compile and lint provider
        shell: bash
        run: |
          set -euo pipefail
          cd provider/server
          npm ci --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const t=(a.metadata&&a.metadata.vulnerabilities&&a.metadata.vulnerabilities.total)||0; console.log("NPM_AUDIT_TOTAL="+t); if(t!==0) process.exit(41)' "$RUNNER_TEMP/npm-audit.json"
          ./node_modules/.bin/tsc
          ./node_modules/.bin/eslint --max-warnings=0 src/
          ./node_modules/.bin/prettier --check 'src/**/*.{js,ts}'
          test -f build/generate_once.js
      - name: Mint video-bound token without exposing it
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pot.json"
          XDG_CACHE_HOME="$RUNNER_TEMP/cache" node provider/server/build/generate_once.js --content-binding=-vq7fH7ANUs --bypass-cache > "$out"
          if [[ "$VARIANT" == "forward243" || "$VARIANT" == "forward243+forward247" ]]; then
            grep -F "Using challenge from the homepage (forward243)" "$out"
          fi
          python -c 'import json,sys; from pathlib import Path; d=json.loads([x for x in Path(sys.argv[1]).read_text().splitlines() if x.strip()][-1]); assert d.get("poToken"); assert d.get("contentBinding")=="-vq7fH7ANUs"; print("VIDEO_BOUND_POT_OK=1 token_length="+str(len(d["poToken"])))' "$out"
      - name: Verify exact-source yt-dlp provider discovery
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ytdlp.log"
          set +e
          python -m yt_dlp \
            --verbose \
            --no-config \
            --no-plugin-dirs \
            --plugin-dirs "$PWD/provider" \
            --simulate \
            --js-runtimes node \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=mweb" \
            --extractor-args "youtubepot-bgutilscript:server_home=$PWD/provider/server" \
            "https://www.youtube.com/watch?v=-vq7fH7ANUs" \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -F "$PWD/provider/plugin/yt_dlp_plugins" "$log"
          grep -E "PO Token Providers:.*bgutil:script-node-1\.3\.1" "$log"
          if grep -q "HTTP Error 403" "$log"; then
            echo "RUNNER_REACHED_GVS_403=1"
          elif grep -Eq "Sign in to confirm you.?re not a bot" "$log"; then
            echo "RUNNER_BLOCKED_AT_PLAYER_API=1"
          else
            echo "YTDLP_EXIT=$rc"
          fi
