name: VoxCPM2 Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/tts_models/*.json"
      - "requirements-lock.txt"
      - "tools/check_tts_model_catalog.py"
      - "tools/voxcpm2/**"
      - "services/speech_backends/**"
      - "services/dub_preflight.py"
      - "services/dub_rendering.py"
      - "services/dub_worker_release.py"
      - "services/dub_studio_runtime.py"
      - "handlers/dub_health/**"
      - "handlers/dub_wizard/**"
      - "tests/test_speech_backend_*.py"
      - "tests/test_speech_model_*.py"
      - "tests/test_voxcpm2_*.py"
      - "tests/test_john_piper_voxcpm2_package.py"
      - ".github/workflows/voxcpm2-windows.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "config/tts_models/*.json"
      - "requirements-lock.txt"
      - "tools/check_tts_model_catalog.py"
      - "tools/voxcpm2/**"
      - "services/speech_backends/**"
      - "services/dub_preflight.py"
      - "services/dub_rendering.py"
      - "services/dub_worker_release.py"
      - "services/dub_studio_runtime.py"
      - "handlers/dub_health/**"
      - "handlers/dub_wizard/**"
      - "tests/test_speech_backend_*.py"
      - "tests/test_speech_model_*.py"
      - "tests/test_voxcpm2_*.py"
      - "tests/test_john_piper_voxcpm2_package.py"
      - ".github/workflows/voxcpm2-windows.yml"

concurrency:
  group: voxcpm2-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python tools/check_requirements_lock.py

      - name: Validate TTS model catalog
        run: python tools/check_tts_model_catalog.py

      - name: Reject embedded runtime packages
        shell: pwsh
        run: |
          $Parts = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "package.part*.b64" -File -Recurse)
          $EmbeddedZips = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*.zip" -File -Recurse)
          $InnerLaunchers = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*-Inner.ps1" -File -Recurse)
          if ($Parts.Count -gt 0 -or $EmbeddedZips.Count -gt 0 -or $InnerLaunchers.Count -gt 0) {
            $Parts + $EmbeddedZips + $InnerLaunchers | ForEach-Object { Write-Host $_.FullName }
            throw "Embedded ZIP/Base64/nested launchers are forbidden in production."
          }

      - name: Compile backend and VoxCPM2 surfaces
        shell: pwsh
        run: |
          python -m compileall -q services/speech_backends services/dub_preflight.py services/dub_rendering.py handlers/dub_health handlers/dub_wizard tools/voxcpm2
          python -m py_compile services/dub_worker_release.py services/dub_studio_runtime.py tools/check_tts_model_catalog.py
          if ($LASTEXITCODE -ne 0) {
            throw "Backend/VoxCPM2 compile failed."
          }

      - name: Parse every VoxCPM2 PowerShell launcher
        shell: pwsh
        run: |
          $Failed = $false
          $Scripts = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*.ps1" -File -Recurse)
          if ($Scripts.Count -eq 0) {
            throw "No VoxCPM2 PowerShell launchers found."
          }

          foreach ($Script in $Scripts) {
            $Tokens = $null
            $ParseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $Script.FullName,
              [ref]$Tokens,
              [ref]$ParseErrors
            )

            if ($ParseErrors.Count -gt 0) {
              $Failed = $true
              Write-Host "PowerShell parse failed: $($Script.FullName)" -ForegroundColor Red
              foreach ($ErrorItem in $ParseErrors) {
                Write-Host (
                  "Line {0}, column {1}: {2}`n{3}" -f
                  $ErrorItem.Extent.StartLineNumber,
                  $ErrorItem.Extent.StartColumnNumber,
                  $ErrorItem.Message,
                  $ErrorItem.Extent.Text
                ) -ForegroundColor Red
              }
            }
            else {
              Write-Host "PowerShell OK: $($Script.FullName)" -ForegroundColor Green
            }
          }

          if ($Failed) {
            throw "One or more VoxCPM2 launchers contain parse errors."
          }

      - name: Run backend and lightweight VoxCPM2 tests
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_backend_generation_execution_plan.py
          tests/test_speech_backend_command_contract.py
          tests/test_speech_backend_control_plane.py
          tests/test_speech_backend_generation_length_plan.py
          tests/test_speech_backend_generation_profile_plan.py
          tests/test_speech_backend_model_profile_contract.py
          tests/test_speech_backend_registry.py
          tests/test_speech_backend_request_boundary.py
          tests/test_speech_backend_runtime_paths.py
          tests/test_speech_model_profile_manifests.py
          tests/test_speech_model_profiles.py
          tests/test_generic_project_runtime_contract.py
          tests/test_dub_wizard_request_writer.py
          tests/test_dub_architecture_boundaries.py
          tests/test_voxcpm2_typed_generation_contract.py
          tests/test_voxcpm2_typed_session_contract.py
          tests/test_voxcpm2_tools.py
          tests/test_voxcpm2_quality_sweep.py
          tests/test_voxcpm2_production_preflight.py
          tests/test_voxcpm2_diagnostic_pack.py
          tests/test_voxcpm2_remaster_delayed_nvenc.py
          tests/test_voxcpm2_cuda_probation_probe.py
          tests/test_john_piper_voxcpm2_package.py

      - name: Ruff configured checks
        shell: pwsh
        run: >-
          python -m ruff check
          services/speech_backends
          services/dub_preflight.py
          services/dub_rendering.py
          services/dub_worker_release.py
          services/dub_studio_runtime.py
          handlers/dub_health
          handlers/dub_wizard
          tools/check_tts_model_catalog.py
          tools/voxcpm2
          tests/test_backend_generation_execution_plan.py
          tests/test_speech_backend_command_contract.py
          tests/test_speech_backend_control_plane.py
          tests/test_speech_backend_generation_length_plan.py
          tests/test_speech_backend_generation_profile_plan.py
          tests/test_speech_backend_model_profile_contract.py
          tests/test_speech_backend_registry.py
          tests/test_speech_backend_request_boundary.py
          tests/test_speech_backend_runtime_paths.py
          tests/test_speech_model_profile_manifests.py
          tests/test_speech_model_profiles.py
          tests/test_generic_project_runtime_contract.py
          tests/test_dub_wizard_request_writer.py
          tests/test_dub_architecture_boundaries.py
          tests/test_voxcpm2_typed_generation_contract.py
          tests/test_voxcpm2_typed_session_contract.py
          tests/test_voxcpm2_tools.py
          tests/test_voxcpm2_quality_sweep.py
          tests/test_voxcpm2_production_preflight.py
          tests/test_voxcpm2_diagnostic_pack.py
          tests/test_voxcpm2_remaster_delayed_nvenc.py
          tests/test_voxcpm2_cuda_probation_probe.py
          tests/test_john_piper_voxcpm2_package.py
