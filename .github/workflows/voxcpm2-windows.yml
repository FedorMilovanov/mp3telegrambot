name: VoxCPM2 Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/voxcpm2/**"
      - "tests/test_voxcpm2_*.py"
      - "tests/test_john_piper_voxcpm2_package.py"
      - ".github/workflows/voxcpm2-windows.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/voxcpm2/**"
      - "tests/test_voxcpm2_*.py"
      - "tests/test_john_piper_voxcpm2_package.py"
      - ".github/workflows/voxcpm2-windows.yml"

concurrency:
  group: voxcpm2-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Reject embedded runtime packages
        shell: pwsh
        run: |
          $Parts = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "package.part*.b64" -File -Recurse)
          $EmbeddedZips = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*.zip" -File -Recurse)
          $InnerLaunchers = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*-Inner.ps1" -File -Recurse)
          if ($Parts.Count -gt 0 -or $EmbeddedZips.Count -gt 0 -or $InnerLaunchers.Count -gt 0) {
            $Parts + $EmbeddedZips + $InnerLaunchers | ForEach-Object { Write-Host $_.FullName }
            throw "Embedded ZIP/Base64/nested launchers are forbidden in production."
          }

      - name: Compile every VoxCPM2 Python tool
        shell: pwsh
        run: |
          $Scripts = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*.py" -File -Recurse)
          if ($Scripts.Count -eq 0) {
            throw "No VoxCPM2 Python tools found."
          }
          foreach ($Script in $Scripts) {
            Write-Host "Compiling $($Script.FullName)"
            python -m py_compile $Script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Python compile failed: $($Script.FullName)"
            }
          }

      - name: Parse every VoxCPM2 PowerShell launcher
        shell: pwsh
        run: |
          $Failed = $false
          $Scripts = @(Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*.ps1" -File -Recurse)
          if ($Scripts.Count -eq 0) {
            throw "No VoxCPM2 PowerShell launchers found."
          }

          foreach ($Script in $Scripts) {
            $Tokens = $null
            $ParseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $Script.FullName,
              [ref]$Tokens,
              [ref]$ParseErrors
            )

            if ($ParseErrors.Count -gt 0) {
              $Failed = $true
              Write-Host "PowerShell parse failed: $($Script.FullName)" -ForegroundColor Red
              foreach ($ErrorItem in $ParseErrors) {
                Write-Host (
                  "Line {0}, column {1}: {2}`n{3}" -f
                  $ErrorItem.Extent.StartLineNumber,
                  $ErrorItem.Extent.StartColumnNumber,
                  $ErrorItem.Message,
                  $ErrorItem.Extent.Text
                ) -ForegroundColor Red
              }
            }
            else {
              Write-Host "PowerShell OK: $($Script.FullName)" -ForegroundColor Green
            }
          }

          if ($Failed) {
            throw "One or more VoxCPM2 launchers contain parse errors."
          }

      - name: Run lightweight VoxCPM2 tests
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_voxcpm2_tools.py
          tests/test_voxcpm2_quality_sweep.py
          tests/test_voxcpm2_production_preflight.py
          tests/test_voxcpm2_diagnostic_pack.py
          tests/test_voxcpm2_remaster_delayed_nvenc.py
          tests/test_voxcpm2_cuda_probation_probe.py
          tests/test_john_piper_voxcpm2_package.py

      - name: Ruff fatal checks
        shell: pwsh
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          tools/voxcpm2
          tests/test_voxcpm2_tools.py
          tests/test_voxcpm2_quality_sweep.py
          tests/test_voxcpm2_production_preflight.py
          tests/test_voxcpm2_diagnostic_pack.py
          tests/test_voxcpm2_remaster_delayed_nvenc.py
          tests/test_voxcpm2_cuda_probation_probe.py
          tests/test_john_piper_voxcpm2_package.py
