name: VoxCPM2 Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/voxcpm2/**"
      - "tests/test_voxcpm2_*.py"
      - "tests/test_john_piper_voxcpm2_package.py"
      - ".github/workflows/voxcpm2-windows.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/voxcpm2/**"
      - "tests/test_voxcpm2_*.py"
      - "tests/test_john_piper_voxcpm2_package.py"
      - ".github/workflows/voxcpm2-windows.yml"

concurrency:
  group: voxcpm2-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile every VoxCPM2 Python tool
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*.py" -File -Recurse
          if (-not $scripts) {
            throw "No VoxCPM2 Python tools found"
          }
          foreach ($script in $scripts) {
            Write-Host "Compiling $($script.FullName)"
            python -m py_compile $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Python compile failed: $($script.FullName)"
            }
          }

      - name: Reconstruct John Piper embedded production package
        shell: pwsh
        run: |
          $example = "tools/voxcpm2/examples/john_piper_z20py4yqhyq"
          $parts = @(
            Get-ChildItem -LiteralPath $example -File -Filter "package.part*.b64" |
              Sort-Object Name
          )
          if ($parts.Count -ne 7) {
            throw "Expected 7 John Piper package parts, found $($parts.Count)"
          }
          $encoded = ($parts | ForEach-Object {
            (Get-Content -LiteralPath $_.FullName -Raw).Trim()
          }) -join ""
          if ($encoded.Length -ne 26336) {
            throw "Unexpected John Piper Base64 length: $($encoded.Length)"
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "john-piper-package.zip"
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded))
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "e5247345d451cd00805d9157cf279a19aad6ee2ca9935a0167ee7b38fda9294f") {
            throw "John Piper package SHA256 mismatch: $hash"
          }
          $extractPath = Join-Path $env:RUNNER_TEMP "john-piper-package"
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
          "JOHN_PIPER_PACKAGE_DIR=$extractPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Parse every VoxCPM2 PowerShell launcher
        shell: pwsh
        run: |
          $failed = $false
          $scripts = @(
            Get-ChildItem -LiteralPath "tools/voxcpm2" -Filter "*.ps1" -File -Recurse
          )
          $embeddedScripts = @(
            Get-ChildItem -LiteralPath $env:JOHN_PIPER_PACKAGE_DIR -Filter "*.ps1" -File -Recurse
          )
          $scripts = @($scripts + $embeddedScripts)

          if (-not $scripts) {
            throw "No VoxCPM2 PowerShell launchers found"
          }

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )

            if ($parseErrors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse failed: $($script.FullName)" -ForegroundColor Red
              foreach ($errorItem in $parseErrors) {
                Write-Host (
                  "Line {0}, column {1}: {2}`n{3}" -f
                  $errorItem.Extent.StartLineNumber,
                  $errorItem.Extent.StartColumnNumber,
                  $errorItem.Message,
                  $errorItem.Extent.Text
                ) -ForegroundColor Red
              }
            }
            else {
              Write-Host "PowerShell OK: $($script.FullName)" -ForegroundColor Green
            }
          }

          if ($failed) {
            throw "One or more VoxCPM2 launchers contain parse errors"
          }

      - name: Run lightweight VoxCPM2 tests
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_voxcpm2_tools.py
          tests/test_voxcpm2_quality_sweep.py
          tests/test_voxcpm2_production_preflight.py
          tests/test_voxcpm2_diagnostic_pack.py
          tests/test_voxcpm2_remaster_delayed_nvenc.py
          tests/test_voxcpm2_cuda_probation_probe.py
          tests/test_john_piper_voxcpm2_package.py

      - name: Ruff fatal checks
        shell: pwsh
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          tools/voxcpm2
          tests/test_voxcpm2_tools.py
          tests/test_voxcpm2_quality_sweep.py
          tests/test_voxcpm2_production_preflight.py
          tests/test_voxcpm2_diagnostic_pack.py
          tests/test_voxcpm2_remaster_delayed_nvenc.py
          tests/test_voxcpm2_cuda_probation_probe.py
          tests/test_john_piper_voxcpm2_package.py
