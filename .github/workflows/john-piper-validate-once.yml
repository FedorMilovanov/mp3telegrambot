name: John Piper Direct Runner One-Time Validation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/john-piper-validate-once.yml"

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the exact direct runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $exampleRelative = "tools\voxcpm2\examples\john_piper_z20py4yqhyq"
          $example = Join-Path $PWD $exampleRelative
          $runner = Join-Path $example "Run-John-Piper-FINAL-CPU.ps1"
          $synth = Join-Path $example "voxcpm2_cpu_shorts_production.py"
          $master = Join-Path $example "master_constant_mix.py"
          $segments = Join-Path $example "segments_ru_final.json"
          $readme = Join-Path $example "README_RU.md"

          foreach ($path in @($runner, $synth, $master, $segments, $readme)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Missing required file: $path"
              }
          }

          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($runner, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              throw "PowerShell parser failed."
          }

          python -m py_compile $synth $master
          if ($LASTEXITCODE -ne 0) {
              throw "Python compile failed."
          }

          python -c "import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); s=json.loads(p.read_text(encoding='utf-8-sig')); assert isinstance(s,list) and len(s)==5; assert all(float(x['end'])>float(x['start']) and str(x['text']).strip() for x in s); print('segments JSON: OK')" $segments
          if ($LASTEXITCODE -ne 0) {
              throw "Segments JSON validation failed."
          }

          if (@(Get-ChildItem -LiteralPath $example -Filter "package.part*.b64" -File).Count -ne 0) {
              throw "Legacy Base64 package parts are present."
          }
          if (Test-Path -LiteralPath (Join-Path $example "Run-John-Piper-FINAL-CPU-Inner.ps1")) {
              throw "Legacy inner launcher is present."
          }

          $validationLine = "Windows validation passed: PowerShell parser, Python compile, five-segment JSON, and legacy-layer absence."
          $readmeText = Get-Content -LiteralPath $readme -Raw
          if ($readmeText -notmatch [regex]::Escape($validationLine)) {
              Add-Content -LiteralPath $readme -Value "`n## Проверка production-runner`n`n$validationLine`n"
          }

          git rm -- ".github/workflows/john-piper-validate-once.yml"
          git add -- $exampleRelative
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record successful John Piper Windows validation"
          git push origin HEAD:main
