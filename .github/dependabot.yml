version: 2

# Two pip entries on purpose:
#
#   1. the YouTube downloader pair moves *daily* — YouTube extractor breakage is
#      the most frequent production failure, so its updates must not wait for a
#      weekly window;
#   2. everything else moves *weekly* in grouped PRs, with `ignore` keeping the
#      YouTube pair out of this entry so a dependency never gets two competing
#      PRs.
#
# The previous configuration allowed only yt-dlp/yt-dlp-ejs with
# `open-pull-requests-limit: 1`, which is why 40+ pins in requirements-lock.txt
# could never be proposed at all.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(youtube)"
    allow:
      - dependency-name: "yt-dlp"
      - dependency-name: "yt-dlp-ejs"
    groups:
      youtube-downloader:
        patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "yt-dlp"
      - dependency-name: "yt-dlp-ejs"
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/vot_helper"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(npm)"
    groups:
      vot-js:
        patterns: ["@vot.js/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(ci)"
    groups:
      github-actions:
        patterns: ["*"]
