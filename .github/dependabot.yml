version: 2

# Policy: dependency updates are proposed automatically, reviewed as PRs and
# merged only after `Required PR Gate` is green (the gate includes the
# dependency audit).
#
# Ignore-список намеренно пуст: floor проекта — 3.12 (ci.yml), поэтому мажоры
# numpy 2.5+ и av 19+, которые его требуют, больше не «заведомо красные PR».
# Обновляться они должны через обычный Dependabot-PR с прогоном Windows-рантайма.
#
# Dependabot rejects two configs with the same (ecosystem, directory,
# target-branch), so the YouTube downloader pair cannot get its own pip entry:
# it is the first group below instead, and the other groups exclude it. Groups
# are evaluated in order, so `youtube-downloader` always wins for that pair.
#
# The previous configuration allowed only yt-dlp/yt-dlp-ejs with
# `open-pull-requests-limit: 1`, which is why 40+ pins in requirements-lock.txt
# could never be proposed at all.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      # Daily, but grouped: extractor breakage in yt-dlp is a production
      # incident and must not wait for a weekly window, while routine
      # minor/patch bumps arrive as one PR per group instead of forty.
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps"
    groups:
      # 1. yt-dlp and its EJS helper must always move together.
      youtube-downloader:
        patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"
      # 2. Routine bumps: one PR for the whole group.
      pip-minor-and-patch:
        patterns: ["*"]
        exclude-patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"
        update-types: ["minor", "patch"]
      # 3. Major bumps stay separate: each one needs its own review and run.
      pip-major:
        patterns: ["*"]
        exclude-patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/vot_helper"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(npm)"
    groups:
      vot-js:
        patterns: ["@vot.js/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(ci)"
    groups:
      github-actions:
        patterns: ["*"]
